<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Co-Op Vault (Live)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%AE</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  body{background:linear-gradient(180deg,#090b0e,#0c0f16 45%,#121620); color:#e2e8f0; font-family:'Rajdhani',sans-serif;}
  .stage{font-family:'Orbitron',sans-serif;}
  ::-webkit-scrollbar{width:7px;height:7px;}
  ::-webkit-scrollbar-track{background:#090b0e;}
  ::-webkit-scrollbar-thumb{background:#232a3b;border-radius:4px;}
  .row-hover:hover{background:rgba(56,189,248,0.06);}
  .tab-btn.active{background:linear-gradient(90deg,#f59e0b,#b45309);color:#000;box-shadow:0 0 14px rgba(245,158,11,.4);font-weight:900;}
  .grp-btn.active{background:#38bdf8;color:#000;box-shadow:0 0 14px rgba(56,189,248,.4);}
  .spin{animation:spin 1s linear infinite;} @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body class="antialiased min-h-screen flex flex-col">

<header class="bg-black/90 border-b border-slate-800/80 px-4 py-3 sticky top-0 z-40 backdrop-blur-md">
  <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-slate-900 border border-amber-500 flex items-center justify-center shadow-[0_0_12px_rgba(245,158,11,.3)]">
        <i class="fa-solid fa-gamepad text-amber-500 text-sm"></i>
      </div>
      <h1 class="stage text-base font-black tracking-widest uppercase">CO-OP VAULT <span class="text-amber-500 text-xs font-mono font-normal">| LIVE</span></h1>
    </div>
    <div class="flex items-center gap-3 w-full sm:w-auto">
      <div class="relative flex-1 sm:w-72">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
        <input id="q" placeholder="Search title, dev, notes..." class="w-full bg-slate-950 text-xs text-cyan-300 placeholder-slate-600 pl-8 pr-3 py-2 rounded-lg border border-slate-800 focus:outline-none focus:border-amber-500 font-mono">
      </div>
      <button id="randomBtn" class="shrink-0 px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-amber-400 text-xs font-mono hover:border-amber-500 flex items-center gap-1.5">
        <i class="fa-solid fa-dice"></i><span class="hidden sm:inline">Random</span>
      </button>
    </div>
  </div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-4">

  <div id="loadingBox" class="flex items-center gap-2 text-xs font-mono text-slate-400 py-8 justify-center">
    <i class="fa-solid fa-spinner spin text-amber-500"></i> Pulling live data from Google Sheets...
  </div>

  <div id="app" class="hidden flex flex-col gap-4">
    <div class="flex gap-2" id="grpTabs"></div>
    <div class="flex items-center gap-2 overflow-x-auto pb-1" id="catTabs"></div>
    <div class="flex items-center justify-between text-xs font-mono text-slate-400 px-1">
      <span id="countLabel">Showing 0 games</span>
      <span class="text-slate-600">Click row for details</span>
    </div>
    <div class="rounded-xl border border-slate-800/80 bg-slate-950/60 overflow-hidden">
      <div class="overflow-x-auto max-h-[65vh] overflow-y-auto">
        <table class="w-full text-xs font-mono">
          <thead class="bg-black/80 text-slate-500 uppercase text-[10px] tracking-wider sticky top-0">
            <tr>
              <th class="text-left px-3 py-2">Title</th>
              <th class="text-left px-3 py-2 hidden sm:table-cell">Release</th>
              <th class="text-left px-3 py-2 hidden md:table-cell">Size</th>
              <th class="text-left px-3 py-2 hidden lg:table-cell">HLTB</th>
              <th class="text-left px-3 py-2">Notes</th>
              <th class="text-left px-3 py-2 hidden xl:table-cell">Developer</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div id="modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
  <div class="bg-slate-950 border border-amber-500/40 rounded-xl max-w-md w-full p-5 shadow-[0_0_30px_rgba(245,158,11,.15)] font-mono text-xs space-y-3">
    <div class="flex items-start justify-between gap-3">
      <h2 id="mTitle" class="stage text-base font-black text-slate-100"></h2>
      <button onclick="closeModal()" class="text-slate-500 hover:text-slate-200"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="mBody" class="space-y-2 text-slate-300"></div>
  </div>
</div>

<footer class="bg-black/90 border-t border-slate-800/80 py-2.5 px-4 font-mono text-[11px] text-slate-500">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <span>Group: <strong id="grpLabel" class="text-amber-500 uppercase"></strong> / Tab: <strong id="tabLabel" class="text-cyan-400 uppercase"></strong></span>
    <span id="totalLabel">Loading...</span>
  </div>
</footer>

<script>
const TABS = [["Ready", "coop", "fa-circle-check", "https://docs.google.com/spreadsheets/d/1JVMyWMc8bA2xKbD2mCjkoj23sra_20kJt9fmfQtskAU/gviz/tq?tqx=out:csv&gid=0", "Game"], ["Early Access", "coop", "fa-hammer", "https://docs.google.com/spreadsheets/d/1JVMyWMc8bA2xKbD2mCjkoj23sra_20kJt9fmfQtskAU/gviz/tq?tqx=out:csv&gid=903152559", "Game"], ["COOP-BEATEN", "coop", "fa-trophy", "https://docs.google.com/spreadsheets/d/1JVMyWMc8bA2xKbD2mCjkoj23sra_20kJt9fmfQtskAU/gviz/tq?tqx=out:csv&gid=213429009", "Game"], ["Unreleased", "coop", "fa-hourglass-half", "https://docs.google.com/spreadsheets/d/1JVMyWMc8bA2xKbD2mCjkoj23sra_20kJt9fmfQtskAU/gviz/tq?tqx=out:csv&gid=559831002", "Game"], ["Mods", "coop", "fa-puzzle-piece", "https://docs.google.com/spreadsheets/d/1JVMyWMc8bA2xKbD2mCjkoj23sra_20kJt9fmfQtskAU/gviz/tq?tqx=out:csv&gid=1189991619", "Title"], ["BACKLOG", "sp", "fa-layer-group", "https://docs.google.com/spreadsheets/d/1JVMyWMc8bA2xKbD2mCjkoj23sra_20kJt9fmfQtskAU/gviz/tq?tqx=out:csv&gid=1196592826", "Game"], ["BACKLOG-SERIES", "sp", "fa-list-ol", "https://docs.google.com/spreadsheets/d/1JVMyWMc8bA2xKbD2mCjkoj23sra_20kJt9fmfQtskAU/gviz/tq?tqx=out:csv&gid=1611596685", "Title"], ["GAMEARCHIVE", "sp", "fa-box-archive", "https://docs.google.com/spreadsheets/d/1JVMyWMc8bA2xKbD2mCjkoj23sra_20kJt9fmfQtskAU/gviz/tq?tqx=out:csv&gid=1664752790", "Game"], ["MAINPC", "sp", "fa-desktop", "https://docs.google.com/spreadsheets/d/1JVMyWMc8bA2xKbD2mCjkoj23sra_20kJt9fmfQtskAU/gviz/tq?tqx=out:csv&gid=102102590", "Game"], ["Beaten", "sp", "fa-medal", "https://docs.google.com/spreadsheets/d/1JVMyWMc8bA2xKbD2mCjkoj23sra_20kJt9fmfQtskAU/gviz/tq?tqx=out:csv&gid=907767779", "Game"]]; // [name, group, icon, csvUrl, titleKey]
let GAMES = [];
let group = "coop";
let activeTab = TABS.find(t=>t[1]===group)[0];
let filtered = [];

function pick(row, keys){
  for(const k of keys){ if(row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== "") return String(row[k]).trim(); }
  return "";
}

function loadAll(){
  const promises = TABS.map(([name,grp,icon,url,titleKey]) => new Promise(resolve => {
    Papa.parse(url, {
      download: true, header: true, skipEmptyLines: true,
      complete: (res) => resolve({name,grp,titleKey,rows:res.data}),
      error: () => resolve({name,grp,titleKey,rows:[]})
    });
  }));
  Promise.all(promises).then(results => {
    results.forEach(({name,grp,titleKey,rows}) => {
      rows.forEach(r => {
        const title = pick(r, [titleKey, 'Game', 'Title']);
        const rel = pick(r, ['Release','Date']);
        const size = pick(r, ['Size']);
        const notes = pick(r, ['Notes']);
        const hltb = pick(r, ['HLTB']);
        const dev = pick(r, ['Developer']);
        const pub = pick(r, ['Publisher','System']);
        // skip fully blank rows
        if(!title && !rel && !size && !notes && !hltb && !dev && !pub) return;
        GAMES.push({t:title || "(name hidden in cell comment)", tab:name, grp, rel, sz:size, note:notes, hltb, dev, pub});
      });
    });
    document.getElementById('loadingBox').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('totalLabel').textContent = `Library total: ${GAMES.length} games (live)`;
    renderGrpTabs(); renderCatTabs(); filterAndRender();
  });
}

function tabCount(name){ return GAMES.filter(g=>g.tab===name).length; }

function renderGrpTabs(){
  document.getElementById('grpTabs').innerHTML = ['coop','sp'].map(g => `
    <button onclick="setGroup('${g}')" class="grp-btn ${g===group?'active':''} px-4 py-1.5 rounded-lg text-xs stage font-bold uppercase tracking-wider border border-slate-800 ${g===group?'':'bg-slate-950/80 text-slate-400 hover:text-slate-200'}">
      <i class="fa-solid ${g==='coop'?'fa-people-arrows':'fa-user'} mr-1.5"></i>${g==='coop'?'Co-op':'Singleplayer'}
    </button>`).join('');
}
function setGroup(g){ group=g; activeTab=TABS.find(t=>t[1]===g)[0]; renderGrpTabs(); renderCatTabs(); filterAndRender(); }
function renderCatTabs(){
  document.getElementById('catTabs').innerHTML = TABS.filter(t=>t[1]===group).map(([name,,icon]) => `
    <button onclick="setTab('${name}')" class="tab-btn ${name===activeTab?'active':''} px-3 py-1.5 rounded-lg text-[11px] stage font-bold uppercase tracking-wide whitespace-nowrap flex items-center gap-1.5 border border-slate-800 ${name===activeTab?'':'bg-slate-950/80 text-slate-400 hover:text-slate-200'}">
      <i class="fa-solid ${icon}"></i>${name}<span class="text-[9px] px-1 rounded ${name===activeTab?'bg-black text-amber-400':'bg-slate-900 text-slate-500'}">${tabCount(name)}</span>
    </button>`).join('');
}
function setTab(name){ activeTab=name; renderCatTabs(); filterAndRender(); }
function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function filterAndRender(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  filtered = GAMES.filter(g => g.tab===activeTab && (!q || g.t.toLowerCase().includes(q) || g.dev.toLowerCase().includes(q) || g.pub.toLowerCase().includes(q) || g.note.toLowerCase().includes(q)));
  renderRows();
  document.getElementById('countLabel').textContent = `Showing ${filtered.length} game${filtered.length===1?'':'s'}`;
  document.getElementById('grpLabel').textContent = group==='coop'?'Co-op':'Singleplayer';
  document.getElementById('tabLabel').textContent = activeTab;
}
function renderRows(){
  const body = document.getElementById('rows');
  if(filtered.length===0){ body.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-500">No games match.</td></tr>`; return; }
  body.innerHTML = filtered.slice(0,500).map(g => `
    <tr class="row-hover border-t border-slate-900 cursor-pointer" onclick='openModal(${JSON.stringify(g).replace(/'/g,"&apos;")})'>
      <td class="px-3 py-2 text-slate-100 font-semibold">${esc(g.t)}</td>
      <td class="px-3 py-2 text-slate-400 hidden sm:table-cell">${esc(g.rel)}</td>
      <td class="px-3 py-2 text-cyan-400 hidden md:table-cell">${esc(g.sz)}</td>
      <td class="px-3 py-2 text-slate-400 hidden lg:table-cell">${esc(g.hltb)}</td>
      <td class="px-3 py-2 text-amber-400 truncate max-w-[180px]">${esc(g.note)}</td>
      <td class="px-3 py-2 text-slate-500 hidden xl:table-cell">${esc(g.dev)}</td>
    </tr>`).join('') + (filtered.length>500 ? `<tr><td colspan="6" class="text-center py-3 text-slate-600">+ ${filtered.length-500} more — refine search</td></tr>` : '');
}
function openModal(g){
  document.getElementById('mTitle').textContent = g.t;
  document.getElementById('mBody').innerHTML = `
    <div class="flex justify-between border-b border-slate-800 pb-1.5"><span class="text-slate-500">Release</span><strong class="text-slate-100">${esc(g.rel)||'—'}</strong></div>
    <div class="flex justify-between border-b border-slate-800 pb-1.5"><span class="text-slate-500">Size</span><strong class="text-cyan-400">${esc(g.sz)||'—'}</strong></div>
    <div class="flex justify-between border-b border-slate-800 pb-1.5"><span class="text-slate-500">HLTB</span><strong class="text-slate-100">${esc(g.hltb)||'—'}</strong></div>
    <div class="flex justify-between border-b border-slate-800 pb-1.5"><span class="text-slate-500">Developer</span><strong class="text-slate-100">${esc(g.dev)||'—'}</strong></div>
    <div class="flex justify-between border-b border-slate-800 pb-1.5"><span class="text-slate-500">Publisher</span><strong class="text-slate-100">${esc(g.pub)||'—'}</strong></div>
    <div class="pt-1"><span class="text-slate-500 block mb-1">Notes</span><strong class="text-amber-400">${esc(g.note)||'—'}</strong></div>`;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
document.getElementById('q').addEventListener('input', filterAndRender);
document.getElementById('randomBtn').addEventListener('click', () => {
  const pool = GAMES.filter(g=>g.tab===activeTab);
  if(pool.length===0) return;
  openModal(pool[Math.floor(Math.random()*pool.length)]);
});
loadAll();
</script>
</body>
</html>
