<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co-Op Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d14;--bg-glow:#0f1622;--card:#101624;--border:#1e2836;
    --accent:#38bdf8;--accent-soft:rgba(56,189,248,.14);--accent-line:rgba(56,189,248,.35);
    --text:#e6ebf2;--muted:#7d8798;
    --green:#4ade80;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;
    --font-head:'Chakra Petch',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
  }
  body[data-group="single"]{
    --bg:#0d0708;--bg-glow:#1a0b0e;--card:#160d10;--border:#2a161b;
    --accent:#e11d48;--accent-soft:rgba(225,29,72,.14);--accent-line:rgba(225,29,72,.38);
  }
  *{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent-line);background-clip:padding-box}
  html{scroll-behavior:smooth}
  body{
    background:radial-gradient(ellipse 80% 55% at 50% -10%, var(--bg-glow) 0%, transparent 60%),var(--bg);
    background-attachment:fixed;color:var(--text);font-family:var(--font-body);min-height:100vh;padding:1.75rem;
  }
  .icon{display:inline-block;width:.85em;height:.85em;background-color:currentColor;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;flex-shrink:0;vertical-align:middle;}
  .icon-steam{-webkit-mask-image:url(icons/steam.png);mask-image:url(icons/steam.png);}
  .icon-pcgw{-webkit-mask-image:url(icons/wrench.svg);mask-image:url(icons/wrench.svg);}
  .icon-nexus{-webkit-mask-image:url(icons/nexus.svg);mask-image:url(icons/nexus.svg);}
  .icon-generic{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'/%3E%3Cpath d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'/%3E%3Cpath d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'/%3E%3C/svg%3E");}
  .icon-search{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M21 21l-4.3-4.3'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M21 21l-4.3-4.3'/%3E%3C/svg%3E");}
  .icon-hltb{-webkit-mask-image:url(icons/clock.svg);mask-image:url(icons/clock.svg);}
  .icon-size{-webkit-mask-image:url(icons/hdd.svg);mask-image:url(icons/hdd.svg);}
  .icon-date{-webkit-mask-image:url(icons/calendar.svg);mask-image:url(icons/calendar.svg);}
  .icon-platform{-webkit-mask-image:url(icons/monitor.svg);mask-image:url(icons/monitor.svg);}
  .icon-dev{-webkit-mask-image:url(icons/code.svg);mask-image:url(icons/code.svg);}
  .icon-pub{-webkit-mask-image:url(icons/briefcase.svg);mask-image:url(icons/briefcase.svg);}
  .icon-pencil{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 20h9'/%3E%3Cpath d='M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4z'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 20h9'/%3E%3Cpath d='M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4z'/%3E%3C/svg%3E");}
  .icon-trash{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='3 6 5 6 21 6'/%3E%3Cpath d='M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6'/%3E%3Cpath d='M10 11v6M14 11v6'/%3E%3Cpath d='M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='3 6 5 6 21 6'/%3E%3Cpath d='M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6'/%3E%3Cpath d='M10 11v6M14 11v6'/%3E%3Cpath d='M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2'/%3E%3C/svg%3E");}
  .icon-plus{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M12 5v14M5 12h14'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M12 5v14M5 12h14'/%3E%3C/svg%3E");}
  header{max-width:1400px;margin:0 auto 1.75rem;display:flex;justify-content:center;position:relative;}
  .admin-toggle{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    display:inline-flex;align-items:center;gap:.5rem;
    font-family:var(--font-head);font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:.55rem .85rem;border:1px solid var(--border);border-radius:8px;
    background:rgba(255,255,255,.015);color:var(--muted);cursor:pointer;transition:all .18s ease;
    white-space:nowrap;
  }
  .admin-toggle:hover{color:#cbd5e1;border-color:var(--accent-line)}
  .admin-toggle .lamp{width:7px;height:7px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1px #4a5468;transition:all .18s ease;}
  body.admin-on .admin-toggle{color:var(--red);border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
  body.admin-on .admin-toggle .lamp{background:var(--red);box-shadow:0 0 8px var(--red)}
  .lbdb-btn{
    position:absolute;left:0;top:50%;transform:translateY(-50%);
    display:none;align-items:center;gap:.5rem;
    font-family:var(--font-head);font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:.55rem .85rem;border:1px solid var(--border);border-radius:8px;
    background:rgba(255,255,255,.015);color:var(--muted);cursor:pointer;transition:all .18s ease;
    white-space:nowrap;
  }
  body.admin-on .lbdb-btn{display:inline-flex;}
  .lbdb-btn:hover{color:#cbd5e1;border-color:var(--accent-line)}
  .lbdb-btn .lamp{width:7px;height:7px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1px #4a5468;transition:all .18s ease;}
  .lbdb-btn.running .lamp{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1.4s ease-in-out infinite;}
  .lbdb-btn.running{color:var(--amber);border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.08)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .switch{
    position:relative;width:280px;height:58px;padding:5px;display:flex;cursor:pointer;user-select:none;border-radius:29px;
    background:linear-gradient(180deg,rgba(0,0,0,.55) 0%, rgba(255,255,255,.02) 100%);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.85),inset 0 -1px 0 rgba(255,255,255,.03),0 1px 0 rgba(255,255,255,.03);
    border:1px solid var(--border);transition:border-color .25s ease;
  }
  .switch:hover{border-color:var(--accent-line)}
  .switch-knob{position:absolute;top:5px;left:5px;width:calc(50% - 5px);height:calc(100% - 10px);border-radius:24px;background:linear-gradient(180deg,#2a3444 0%,#1b2330 55%,#141b26 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.6);transition:transform .32s cubic-bezier(.34,1.15,.4,1);z-index:1;}
  .switch-knob::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 50% 0%, var(--accent-soft), transparent 60%);transition:background .35s ease;}
  body[data-group="single"] .switch-knob{transform:translateX(100%)}
  .switch-label{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:.82rem;letter-spacing:.12em;color:#4a5468;transition:color .22s ease,text-shadow .22s ease;pointer-events:none;}
  .switch[data-active="coop"] .switch-label[data-side="coop"],.switch[data-active="single"] .switch-label[data-side="single"]{color:#e8f6ff;text-shadow:0 0 10px var(--accent-line);}
  .tabbar{max-width:1400px;margin:0 auto 1rem;display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;}
  .tabbar button{font-family:var(--font-head);font-weight:600;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:.5rem .9rem;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;transition:all .2s ease;}
  .tabbar button:hover{color:#cbd5e1;border-color:var(--accent-line)}
  .tabbar button.active{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
  .toolbar{max-width:1400px;margin:0 auto 1.25rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;}
  .toolbar.empty{display:none}
  .tb-left{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
  .tb-right{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
  .dd{position:relative}
  .dd-btn{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--font-head);font-weight:600;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:.6rem .9rem;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.015);color:#cbd5e1;cursor:pointer;transition:all .18s ease;white-space:nowrap;}
  .dd-btn:hover{color:#fff;border-color:var(--accent-line);background:var(--accent-soft)}
  .dd.open .dd-btn{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
  .dd-btn .chev{font-size:.7rem;line-height:1;opacity:.7;transition:transform .18s ease;}
  .dd.open .dd-btn .chev{transform:rotate(180deg)}
  .dd-btn .val{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:.02em;font-family:var(--font-body);font-size:.82rem;}
  .dd.open .dd-btn .val,.dd-btn:hover .val{color:#e6ebf2}
  .dd-menu{position:absolute;top:calc(100% + .35rem);left:0;z-index:50;min-width:200px;background:#0c1017;border:1px solid var(--border);border-radius:9px;padding:.35rem;box-shadow:0 12px 32px rgba(0,0,0,.55);display:none;flex-direction:column;gap:.1rem;animation:menuIn .13s ease-out;}
  .dd.open .dd-menu{display:flex}
  @keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .dd-item{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-radius:6px;font-family:var(--font-body);font-size:.86rem;font-weight:500;color:#cbd5e1;background:transparent;border:none;cursor:pointer;text-align:left;width:100%;transition:background .12s ease,color .12s ease;white-space:nowrap;}
  .dd-item:hover{background:rgba(255,255,255,.04);color:#fff}
  .dd-item.active{color:var(--accent)}
  .dd-item.active .dd-tick{opacity:1}
  .dd-tick{margin-left:auto;font-size:.85rem;line-height:1;opacity:0;color:var(--accent);}
  .dd-item .dir{font-size:.75rem;line-height:1;opacity:.45;color:var(--muted);}
  .dd-item.active .dir{opacity:1;color:var(--accent)}
  .search-box{position:relative;display:flex;align-items:center;}
  .search-box .s-icon{position:absolute;left:10px;width:14px;height:14px;color:var(--muted);pointer-events:none;}
  .search-box input{font-family:var(--font-body);font-size:.85rem;color:#e6ebf2;background:rgba(255,255,255,.015);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem .6rem 2.1rem;width:220px;outline:none;transition:border-color .18s ease,background .18s ease;}
  .search-box input::placeholder{color:#4a5468}
  .search-box input:focus{border-color:var(--accent-line);background:var(--accent-soft);}
  .chk{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-head);font-size:.6rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:.4rem .6rem;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;transition:all .16s ease;appearance:none;-webkit-appearance:none;}
  .chk:hover{color:#cbd5e1;border-color:var(--accent-line)}
  .chk .dot{width:7px;height:7px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1px #4a5468;transition:all .16s ease;}
  .chk.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
  .chk.on .dot{background:var(--accent);box-shadow:0 0 6px var(--accent);}
  .btn-add{
    display:none;align-items:center;gap:.45rem;
    font-family:var(--font-head);font-weight:700;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;
    padding:.6rem .95rem;border:1px solid var(--red);border-radius:8px;
    background:rgba(239,68,68,.1);color:var(--red);cursor:pointer;transition:all .18s ease;
  }
  body.admin-on .btn-add{display:inline-flex;}
  .btn-add:hover{background:rgba(239,68,68,.18);color:#fff;border-color:#fff}
  .section-header{max-width:1400px;margin:2rem auto 1rem;display:flex;align-items:center;gap:.85rem;scroll-margin-top:1.5rem;}
  .section-header:first-child{margin-top:0}
  .section-header .bar{width:3px;height:18px;background:var(--accent);border-radius:2px;flex-shrink:0;}
  .section-header .label{font-family:var(--font-head);font-size:.78rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);white-space:nowrap;}
  .section-header .line{flex:1;height:1px;background:var(--border);}
  .jump-btn{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-head);font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:.4rem .7rem;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .18s ease;}
  .jump-btn:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
  .jump-btn .arw{font-size:.85rem;line-height:1}
  .grid{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,580px),1fr));gap:1.25rem;}
  .grid-empty{max-width:1400px;margin:1.5rem auto;padding:2rem 1rem;text-align:center;font-family:var(--font-head);font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--border);border-radius:9px;line-height:1.8;}
  .grid-empty code{font-family:ui-monospace,monospace;background:rgba(255,255,255,.04);padding:.15rem .4rem;border-radius:4px;color:#cbd5e1;font-size:.85em;letter-spacing:0;text-transform:none;}
  .card{display:flex;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .2s ease;position:relative;}
  .card:hover{border-color:var(--accent-line)}
  .shot{width:70%;aspect-ratio:16 / 9;background:#000;flex-shrink:0;position:relative;display:grid;place-items:center;overflow:hidden;}
  .shot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,rgba(0,0,0,0) 100%);pointer-events:none;}
  .overlay{position:absolute;left:.55rem;right:.55rem;top:.5rem;bottom:.5rem;z-index:2;pointer-events:none;}
  .overlay-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:.4rem;}
  .status-tag{display:inline-flex;align-items:center;padding:.3rem .6rem;background:rgba(10,13,18,.92);border:1px solid rgba(255,255,255,.12);border-radius:6px;font-family:var(--font-head);font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--green);white-space:nowrap;line-height:1;}
  .steam-tag{display:inline-flex;align-items:center;justify-content:center;padding:.3rem .5rem;background:rgba(10,13,18,.92);border:1px solid rgba(255,255,255,.12);border-radius:6px;line-height:1;}
  .steam-tag .icon-steam{width:1.05em;height:1.05em;background-color:#cbd5e1;}
  .overlay-chips{position:absolute;left:0;right:0;bottom:0;display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;}
  .ov-chip{display:inline-flex;align-items:center;padding:.32rem .65rem;background:rgba(8,10,16,.72);border:1px solid rgba(255,255,255,.08);border-radius:6px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-family:var(--font-body);font-size:.78rem;font-weight:500;color:#e6ebf2;white-space:nowrap;line-height:1;}
  .logo-panel{width:30%;background:rgba(255,255,255,.015);border-left:1px solid var(--border);display:grid;place-items:center;padding:.75rem;}
  .logo-box{aspect-ratio:504 / 562;max-width:100%;max-height:100%;display:grid;place-items:center;}
  .ph{font-family:var(--font-head);font-size:.68rem;font-weight:600;letter-spacing:.14em;color:#3a4356;text-transform:uppercase;text-align:center;line-height:1.6;}
  .ph small{display:block;font-size:.6rem;letter-spacing:.1em;color:#2b3243;margin-top:.35rem}
  .card-admin{position:absolute;top:.5rem;right:.5rem;z-index:5;display:none;gap:.35rem;}
  body.admin-on .card-admin{display:flex;}
  .card-admin button{width:30px;height:30px;border-radius:6px;border:1px solid rgba(255,255,255,.14);background:rgba(10,13,18,.85);color:#cbd5e1;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:all .16s ease;}
  .card-admin button:hover{background:rgba(0,0,0,.95);color:#fff;}
  .card-admin button.edit:hover{border-color:var(--accent);color:var(--accent);}
  .card-admin button.del:hover{border-color:var(--red);color:var(--red);}
  .card-admin .icon{width:14px;height:14px;}
  .beaten-list{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:1rem;}
  .row-wrap{display:grid;grid-template-columns:86px 1fr;gap:.9rem;align-items:center;position:relative;}
  .rank{font-family:var(--font-head);font-weight:700;font-size:1.6rem;letter-spacing:.02em;color:var(--muted);text-align:right;padding-right:.2rem;transition:color .2s ease,text-shadow .2s ease;user-select:none;line-height:1;font-variant-numeric:tabular-nums;}
  .row-wrap:hover .rank{color:var(--accent);text-shadow:0 0 12px var(--accent-soft);}
  .rowD{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .2s ease;position:relative;}
  .rowD:hover{border-color:var(--accent-line)}
  .shot-cell{aspect-ratio:16/9;align-self:center;background:linear-gradient(135deg,#1a2230 0%,#0f1620 100%);display:grid;place-items:center;color:#3a4356;font-family:var(--font-head);font-weight:600;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;text-align:center;line-height:1.5;}
  .shot-cell small{display:block;font-size:.5rem;color:#2b3243;letter-spacing:.1em}

<script>
/* ============================================================
   TAB CONFIG (real config, not data)
   ============================================================ */
const TABS = {
  coop: [
    { id:'released',     label:'Released' },

    { id:'mods',         label:'Mods' },

    { id:'beaten',         label:'Beaten' },
  ]
};
const ALL_TABS = [...TABS.coop, ...TABS.single];

const NO_CHIPS_TABS = new Set(['early-access','unreleased']);
const NO_SIZE_TABS  = new Set(['early-access']);

/* Which data file each tab reads from. Matches the folder layout. */

  'released':      'data/coop-released.json',

  'backlog':       'data/single-backlog.json',

};

/* ============================================================
   DATA CACHE — populated by fetch on first view of each tab
   ============================================================ */
const DATA = {
  coop:   { released:null, 'early-access':null, unreleased:null, mods:null, 'coop-beaten':null },
  single: { backlog:null, 'backlog-series':null, gamearchive:null, mainpc:null, beaten:null }
};
const LOAD_STATE = {
  coop:   { released:'idle', 'early-access':'idle', unreleased:'idle', mods:'idle', 'coop-beaten':'idle' },
  single: { backlog:'idle', 'backlog-series':'idle', gamearchive:'idle', mainpc:'idle', beaten:'idle' }
};

/* ============================================================
   TAG SYSTEM
   ============================================================ */
const TAG_LABELS = {
  coop:'Co-op', single:'Vault', released:'Released', 'early-access':'Early Access', unreleased:'Unreleased',
  mods:'Mods', 'coop-beaten':'Co-op Beaten', backlog:'Backlog', 'backlog-series':'Backlog Series',
  gamearchive:'Game Archive', mainpc:'Main PC', beaten:'Beaten', ready:'Ready', ondisk:'On Disk',
};
const COOP_TAGS   = new Set(['coop','released','early-access','unreleased','mods','coop-beaten']);
const VAULT_TAGS  = new Set(['single','backlog','backlog-series','gamearchive','mainpc','beaten']);
const STATUS_TAGS = new Set(['ready','ondisk']);
const CROSS_TAGS  = ['released','early-access','unreleased','mods','coop-beaten','backlog','backlog-series','gamearchive','mainpc','beaten'];

function expandExtraTags(extraTags){
  const out = new Set();
  (extraTags||[]).forEach(t => {
    if(!t) return;
    out.add(t);
    if(COOP_TAGS.has(t)  && t !== 'coop')   out.add('coop');
    if(VAULT_TAGS.has(t) && t !== 'single') out.add('single');
  });
  return [...out];
}
function buildTags(g){
  const set = new Set();
  set.add(group); set.add(tab);
  if(group === 'coop'   && g.ready)  set.add('ready');
  if(group === 'single' && g.onDisk) set.add('ondisk');
  expandExtraTags(g.extraTags || []).forEach(t => set.add(t));
  return [...set];
}
function chipHTML(t){
  const label = TAG_LABELS[t] || t;
  let cls = 'chip';
  if(STATUS_TAGS.has(t))     cls += ' green';
  else if(COOP_TAGS.has(t))  cls += ' coop';
  else if(VAULT_TAGS.has(t)) cls += ' vault';
  return `<span class="${cls}">${label}</span>`;
}
function renderTags(g){ return buildTags(g).map(chipHTML).join(''); }

/* ============================================================
   FORMATTERS
   ============================================================ */
function fmtHltbMain(str){
  if(!str || str === '—') return '—';
  const s = String(str).trim();
  const m = s.match(/^Main:\s*([\d.]+)/i);
  if(m) return `${m[1]} hrs`;
  return s;
}
function fmtHltb(str, html){
  if(!str || str === '—') return '—';
  const s = String(str).trim();
  const m = s.match(/^Main:\s*([\d.]+)(?:\s*,\s*\+Extra:\s*([\d.]+))?$/i);
  if(m){
    const main = m[1], extra = m[2];
    if(html){
      if(extra && extra !== main) return `${main}<span class="sep">to</span>${extra}<span class="unit">hrs</span>`;
      return `${main}<span class="unit">hrs</span>`;
    }
    if(extra && extra !== main) return `${main} to ${extra} hrs`;
    return `${main} hrs`;
  }
  return s;
}
function fmtHltbRange(main, extra, html){
  if(main === undefined || main === null || main === '') return '—';
  const same = (extra === undefined || extra === null || extra === main);
  if(html){
    if(same) return `${main}<span class="unit">hrs</span>`;
    return `${main}<span class="sep">to</span>${extra}<span class="unit">hrs</span>`;
  }
  if(same) return `${main} hrs`;
  return `${main} to ${extra} hrs`;
}
function fmtSize(str, html){
  if(!str || str === '—') return str || '—';
  const s = String(str).trim();
  if(!html) return s;
  const m = s.match(/^([\d.]+)\s*(GB|MB|TB|KB)$/i);
  if(!m) return s;
  return `${m[1]}<span class="unit">${m[2]}</span>`;
}
function parseEADates(str){
  if(!str) return { initial:null, target:null };
  const s = String(str).trim();
  const m = s.match(/^Init\.\s*([^→]+?)(?:\s*→\s*(.+))?$/);
  if(m) return { initial: m[1].trim(), target: m[2] ? m[2].trim() : null };
  return { initial:null, target:null };
}
function releaseKey(str){
  if(!str) return 0;
  let s = String(str).trim();
  s = s.replace(/^Init\.\s*/i, '').split('→')[0].trim();
  const full = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if(full) return +full[3]*10000 + +full[2]*100 + +full[1];
  const y = s.match(/(\d{4})/);
  if(y) return +y[1]*10000;
  return 0;
}
function sizeKey(str){
  if(!str || str === '—') return -1;
  const m = String(str).match(/([\d.]+)\s*(TB|GB|MB|KB)/i);
  if(!m) return -1;
  const v = parseFloat(m[1]); const u = m[2].toUpperCase();
  if(u==='TB') return v*1024;
  if(u==='GB') return v;
  if(u==='MB') return v/1024;
  if(u==='KB') return v/1024/1024;
  return v;
}
function hltbMainKey(str){
  if(!str || str === '—') return -1;
  const s = String(str);
  if(/unending|ongoing/i.test(s)) return 999999;
  const m = s.match(/Main:\s*([\d.]+)/i);
  return m ? parseFloat(m[1]) : -1;
}
function hltbExtraKey(str){
  if(!str || str === '—') return -1;
  const s = String(str);
  if(/unending|ongoing/i.test(s)) return 999999;
  const m = s.match(/\+Extra:\s*([\d.]+)/i);
  if(m) return parseFloat(m[1]);
  const main = s.match(/Main:\s*([\d.]+)/i);
  return main ? parseFloat(main[1]) : -1;
}
function nameKey(str){ return String(str||'').toLowerCase(); }

/* ============================================================
   SORT / FILTER STATE
   ============================================================ */
let sortKey = 'natural';
let sortDir = 'asc';
let filterKey = 'all';
let searchTerm = '';
const searchFields = { name: true, dev: false, pub: false };
const defaultDir = { natural:'asc', name:'asc', size:'desc', release:'desc', main:'asc', extra:'asc' };
const SORT_LABELS = { natural:'Date Added', name:'Name', size:'Size', release:'Released', main:'HLTB Main', extra:'HLTB Extra' };

/* ============================================================
   ELEMENT REFS + RUNTIME STATE
   ============================================================ */
let group = 'coop';
let tab = 'released';
let adminMode = false;
let adminBusy = false;

const bodyEl   = document.body;

const tabbarEl = document.getElementById('tabbar');

const tokenSlot= document.getElementById('token-slot');

const lbdbBtn = document.getElementById('lbdbBtn');
const lbdbBtnLabel = document.getElementById('lbdbBtnLabel');

const seriesGameIndex = new Map();

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg, kind){
  toastEl.textContent = msg;
  toastEl.className = 'toast show ' + (kind === 'bad' ? 'bad' : 'ok');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toastEl.classList.remove('show'); }, 2600);
}

/* ============================================================
   DATA LOADER
   ============================================================ */
function normaliseFileData(tabId, raw){
  // The file shape must match the tab type.
  if(tabId === 'backlog'){
    return {
      mirror: Array.isArray(raw.mirror) ? raw.mirror : [],
      seriesLeftovers: Array.isArray(raw.seriesLeftovers) ? raw.seriesLeftovers : [],
    };
  }
  if(tabId === 'backlog-series'){
    return { series: Array.isArray(raw.series) ? raw.series : [] };
  }
  // Regular tabs: expect { games: [...] }
  return Array.isArray(raw.games) ? raw.games : [];
}

async function loadTabData(grp, tabId, force){
  if(!force && LOAD_STATE[grp][tabId] === 'loaded') return;
  if(!force && LOAD_STATE[grp][tabId] === 'loading') return;
  LOAD_STATE[grp][tabId] = 'loading';
  const file = TAB_FILES[tabId];
  try{
    const res = await fetch(file, { cache: 'no-cache' });
    if(res.status === 404){
      DATA[grp][tabId] = normaliseFileData(tabId, tabId === 'backlog' ? {} : tabId === 'backlog-series' ? {} : { games: [] });
      LOAD_STATE[grp][tabId] = 'missing';
      return;
    }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();
    DATA[grp][tabId] = normaliseFileData(tabId, raw);
    LOAD_STATE[grp][tabId] = 'loaded';
  }catch(e){
    console.error('loadTabData failed for', file, e);
    DATA[grp][tabId] = normaliseFileData(tabId, tabId === 'backlog' ? {} : tabId === 'backlog-series' ? {} : { games: [] });
    LOAD_STATE[grp][tabId] = 'error';
  }
}
function currentTabData(){
  return DATA[group][tab];
}

/* ============================================================
   ADMIN AUTH
   ============================================================ */
function getToken(){ return localStorage.getItem('gh_admin_token') || ''; }
function setToken(t){ localStorage.setItem('gh_admin_token', t); }
function clearToken(){ localStorage.removeItem('gh_admin_token'); }

async function verifyToken(token){
  try{
    const res = await fetch('https://api.github.com/user', {
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
    });
    if(res.status === 200){
      const data = await res.json();
      return { ok: true, login: data.login };
    }
    if(res.status === 401) return { ok: false, err: 'Invalid or expired token' };
    if(res.status === 403) return { ok: false, err: 'Token rejected (rate limit or insufficient scope)' };
    return { ok: false, err: 'GitHub API error HTTP ' + res.status };
  }catch(e){
    return { ok: false, err: 'Network error: ' + e.message };
  }
}

function showTokenPrompt(){
  tokenSlot.innerHTML = `
    <div class="token-modal">
      <button class="modal-close" data-close>✕</button>
      <h2><span class="lamp"></span>Admin access</h2>
      <p>
        Paste a GitHub personal access token. It's stored only in this browser's
        localStorage and is never sent anywhere except
        <code style="background:rgba(255,255,255,.05);padding:.1rem .35rem;border-radius:4px;font-family:ui-monospace,monospace;font-size:.78rem;color:#cbd5e1">api.github.com</code>.
      </p>
      <p>
        Generate one at <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener">github.com/settings/tokens</a>
        with <strong>Contents</strong> and <strong>Actions: read &amp; write</strong> permissions on
        <code style="background:rgba(255,255,255,.05);padding:.1rem .35rem;border-radius:4px;font-family:ui-monospace,monospace;font-size:.78rem;color:#cbd5e1">TheDeusDeceptor/coopbible</code>.
      </p>
      <input type="password" id="token-input" placeholder="ghp_… or github_pat_…" autocomplete="off" spellcheck="false">
      <div class="token-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="button" class="btn primary" id="token-verify">Verify &amp; Save</button>
      </div>
    </div>`;
  tokenBackdrop.classList.add('open');
  setTimeout(() => tokenSlot.querySelector('#token-input').focus(), 50);
  tokenSlot.querySelector('#token-verify').onclick = async () => {
    const t = tokenSlot.querySelector('#token-input').value.trim();
    if(!t){ toast('Paste a token first', 'bad'); return; }
    const btn = tokenSlot.querySelector('#token-verify');
    btn.disabled = true; btn.textContent = 'Checking…';
    const r = await verifyToken(t);
    if(r.ok){
      setToken(t);
      closeTokenPrompt();
      enterAdmin();
      toast('Signed in as ' + r.login);
    } else {
      toast(r.err, 'bad');
      btn.disabled = false; btn.textContent = 'Verify & Save';
    }
  };
  tokenSlot.querySelector('#token-input').addEventListener('keydown', e => {
    if(e.key === 'Enter') tokenSlot.querySelector('#token-verify').click();
  });
}
function closeTokenPrompt(){ tokenBackdrop.classList.remove('open'); tokenSlot.innerHTML = ''; }

function enterAdmin(){
  adminMode = true;
  bodyEl.classList.add('admin-on');
  adminToggleLabel.textContent = 'Exit Admin';
  renderContent();
}
function exitAdmin(){
  adminMode = false;
  bodyEl.classList.remove('admin-on');
  adminToggleLabel.textContent = 'Admin';
  renderContent();
}

async function bootAdminFlow(){
  const tok = getToken();
  if(!tok) return;
  try{
    const r = await verifyToken(tok);
    if(!r.ok) clearToken();
  }catch(e){ /* re-checked on click */ }
}

adminToggleBtn.addEventListener('click', async () => {
  if(adminBusy) return;
  if(adminMode){ exitAdmin(); return; }
  const tok = getToken();
  if(!tok){ showTokenPrompt(); return; }
  adminBusy = true;
  adminToggleLabel.textContent = 'Checking…';
  const r = await verifyToken(tok);
  if(r.ok){ enterAdmin(); }
  else {
    clearToken();
    adminToggleLabel.textContent = 'Admin';
    toast(r.err, 'bad');
    showTokenPrompt();
  }
  adminBusy = false;
});
adminToggleBtn.addEventListener('contextmenu', e => {
  e.preventDefault();
  if(!getToken()) return;
  if(confirm('Sign out? This removes the saved token from this browser.')){
    clearToken();
    bodyEl.classList.remove('admin-on');
    adminMode = false;
    adminToggleLabel.textContent = 'Admin';
    renderContent();
    toast('Signed out');
  }
});
tokenBackdrop.addEventListener('click', e => { if(e.target === tokenBackdrop) closeTokenPrompt(); });
tokenSlot.addEventListener('click', e => { if(e.target.closest('[data-close]')) closeTokenPrompt(); });

/* ============================================================
   LBDB UPDATE BUTTON
   ============================================================ */
const GITHUB_OWNER = 'TheDeusDeceptor';
const GITHUB_REPO  = 'coopbible';
const LBDB_WORKFLOW = 'update-lbdb.yml';
let lbdbPollTimer = null;
let lbdbStartTime = 0;

async function ghFetch(url, opts = {}){
  const tok = getToken();
  if(!tok) throw new Error('No token');
  const headers = {
    'Authorization': 'Bearer ' + tok,
    'Accept': 'application/vnd.github+json',
    ...(opts.headers || {}),
  };
  return fetch(url, { ...opts, headers });
}

async function triggerLbdbUpdate(){
  if(!getToken()){ showTokenPrompt(); return; }
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/${LBDB_WORKFLOW}/dispatches`;
  try{
    const res = await ghFetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: 'main' }),
    });
    if(res.status === 204){
      toast('LBDB update queued');
      startLbdbPolling();
    } else if(res.status === 404){
      toast('Workflow not found — did you push update-lbdb.yml?', 'bad');
    } else if(res.status === 403 || res.status === 401){
      toast('Token needs Actions: write permission', 'bad');
    } else {
      toast('Trigger failed: HTTP ' + res.status, 'bad');
    }
  }catch(e){ toast('Trigger failed: ' + e.message, 'bad'); }
}
function startLbdbPolling(){
  lbdbStartTime = Date.now();
  lbdbBtn.classList.add('running');
  lbdbBtnLabel.textContent = 'Running…';
  clearInterval(lbdbPollTimer);
  lbdbPollTimer = setInterval(checkLbdbStatus, 8000);
  checkLbdbStatus();
}
async function checkLbdbStatus(){
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/${LBDB_WORKFLOW}/runs?per_page=1`;
  try{
    const res = await ghFetch(url);
    if(!res.ok) return;
    const data = await res.json();
    const run = (data.workflow_runs || [])[0];
    if(!run) return;
    const startedAt = new Date(run.created_at).getTime();
    if(startedAt < lbdbStartTime - 30000) return;
    const elapsed = Math.round((Date.now() - lbdbStartTime) / 1000);
    lbdbBtnLabel.textContent = `Running… ${elapsed}s`;
    if(run.status === 'completed'){
      clearInterval(lbdbPollTimer);
      lbdbPollTimer = null;
      lbdbBtn.classList.remove('running');
      if(run.conclusion === 'success'){
        lbdbBtnLabel.textContent = 'LBDB up to date';
        toast('LBDB updated — reload to use fresh data');
      } else {
        lbdbBtnLabel.textContent = 'Update failed';
        toast('LBDB update failed: ' + run.conclusion, 'bad');
      }
      setTimeout(() => { lbdbBtnLabel.textContent = 'Update LBDB'; }, 8000);
    }
  }catch(e){ /* keep polling quietly */ }
}
lbdbBtn.addEventListener('click', () => {
  if(lbdbPollTimer) return;
  triggerLbdbUpdate();
});

   RENDER — SHELL

  `).join('');

function applyTooltips(){

    const truncated = el.scrollWidth > el.clientWidth + 1;
    if(truncated) el.setAttribute('title', el.dataset.tooltip);
  });

/* ============================================================
   RENDER — FILTERS / SORT
   ============================================================ */
function statusFlag(g){ return group === 'coop' ? !!g.ready : !!g.onDisk; }
function passesFilter(g){
  if(filterKey === 'all')       return true;
  if(filterKey === 'status')    return statusFlag(g);
  if(filterKey === 'no-status') return !statusFlag(g);
  return true;
}
function passesSearch(g){
  if(!searchTerm) return true;
  const q = searchTerm.toLowerCase().trim();
  if(!q) return true;
  const name = String(g.name||'').toLowerCase();
  const dev  = String(g.dev ||'').toLowerCase();
  const pub  = String(g.pub ||'').toLowerCase();
  if(searchFields.name && name.includes(q)) return true;
  if(searchFields.dev  && dev.includes(q))  return true;
  if(searchFields.pub  && pub.includes(q))  return true;
  return false;
}
function passesAll(g){ return passesFilter(g) && passesSearch(g); }
function getComparator(){
  switch(sortKey){
    case 'name':    return (a,b)=> nameKey(a.name).localeCompare(nameKey(b.name));
    case 'size':    return (a,b)=> sizeKey(a.size) - sizeKey(b.size);
    case 'release': return (a,b)=> releaseKey(a.release) - releaseKey(b.release);
    case 'main':    return (a,b)=> hltbMainKey(a.hltb) - hltbMainKey(b.hltb);
    case 'extra':   return (a,b)=> hltbExtraKey(a.hltb) - hltbExtraKey(b.hltb);
    default:        return null;
  }
}
function applySort(arr){
  const cmp = getComparator();
  if(!cmp) return sortDir === 'desc' ? arr.slice().reverse() : arr;
  const copy = arr.slice();
  copy.sort((a,b)=>{ const r = cmp(a,b); return sortDir === 'asc' ? r : -r; });
  return copy;
}

/* ============================================================
   RENDER — CONTENT
   ============================================================ */
function emptyHTML(file){
  return `<div class="grid-empty">
    No data yet.<br>
    Add <code>${file}</code> to the repo and refresh.
  </div>`;
}
function loadingHTML(){
  return `<div class="loader">Loading</div>`;
}
function renderContent(){
  seriesGameIndex.clear();
  const state = LOAD_STATE[group][tab];
  const file = TAB_FILES[tab];

  if(state === 'loading'){ hideToolbar(); contentEl.innerHTML = loadingHTML(); return; }
  if(state === 'idle'){
    hideToolbar();
    contentEl.innerHTML = loadingHTML();
    loadTabData(group, tab).then(() => { if(LOAD_STATE[group][tab] !== 'loading') renderContent(); });
    return;
  }

  const list = currentTabData();

  // --- Backlog: two sections ---
  if(tab === 'backlog'){
    const data = list || { mirror: [], seriesLeftovers: [] };
    const mirror = applySort((data.mirror||[]).filter(passesAll));
    const series = filterKey === 'all' ? (data.seriesLeftovers||[]) : [];
    renderToolbar();
    if(!data.mirror.length && !data.seriesLeftovers.length){
      contentEl.innerHTML = emptyHTML(file);
      return;
    }
    contentEl.innerHTML = `
      ${sectionHeader('Backloggd', { target:'sec-series', label:'To series', dir:'down' })}
      ${mirror.length ? `<div class="grid">${mirror.map(cardHTML).join('')}</div>` : `<div class="grid-empty">No games match</div>`}
      ${sectionHeader('Series', { target:'sec-backloggd', label:'To main list', dir:'up' })}
      ${series.length ? `<div class="grid">${series.map(cardHTML).join('')}</div>` : `<div class="grid-empty">Hidden by current filter</div>`}`;
    applyTooltips();
    return;
  }

  // --- Backlog Series: blocks ---
  if(tab === 'backlog-series'){
    const data = list || { series: [] };
    hideToolbar();
    if(!data.series.length){ contentEl.innerHTML = emptyHTML(file); return; }
    contentEl.innerHTML = `<div class="series-blocks">${data.series.map(seriesBlockHTML).join('')}</div>`;
    applyTooltips();
    return;
  }

  // --- Regular tabs ---
  const arr = Array.isArray(list) ? list : [];
  const filtered = applySort(arr.filter(passesAll));
  renderToolbar();
  if(!arr.length){ contentEl.innerHTML = emptyHTML(file); return; }

  // Beaten tabs use the single-column layout
  if(BEATEN_TABS.has(tab)){
    const rankMap = new Map();
    arr.forEach((g, i) => rankMap.set(g.id, i + 1));
    contentEl.innerHTML = filtered.length
      ? `<div class="beaten-list">${filtered.map(g => beatenRowHTML(g, rankMap.get(g.id))).join('')}</div>`
      : `<div class="grid-empty">No games match</div>`;
    applyTooltips();
    return;
  }

  contentEl.innerHTML = filtered.length
    ? `<div class="grid">${filtered.map(cardHTML).join('')}</div>`
    : `<div class="grid-empty">No games match</div>`;
  applyTooltips();
}
function refreshGrid(){
  const list = currentTabData();
  if(!Array.isArray(list)){ renderContent(); return; }
  if(BEATEN_TABS.has(tab)){
    const rankMap = new Map();
    list.forEach((g, i) => rankMap.set(g.id, i + 1));
    const filtered = applySort(list.filter(passesAll));
    contentEl.innerHTML = filtered.length
      ? `<div class="beaten-list">${filtered.map(g => beatenRowHTML(g, rankMap.get(g.id))).join('')}</div>`
      : `<div class="grid-empty">No games match</div>`;
    applyTooltips();
    return;
  }
  const filtered = applySort(list.filter(passesAll));
  contentEl.innerHTML = filtered.length
    ? `<div class="grid">${filtered.map(cardHTML).join('')}</div>`
    : `<div class="grid-empty">No games match</div>`;
  applyTooltips();
}

function findGameById(id){
  const list = currentTabData();
  if(Array.isArray(list)) return list.find(x => x.id === id) || null;
  if(list && list.mirror){
    const a = list.mirror.find(x => x.id === id); if(a) return a;

/* ============================================================
   ADMIN FORM
   ============================================================ */
function hltbToParts(str){
  if(!str || str === '—') return { main:'', extra:'' };
  const s = String(str);
  const mm = s.match(/Main:\s*([\d.]+)/i);
  const me = s.match(/\+Extra:\s*([\d.]+)/i);
  if(mm) return { main: mm[1] || '', extra: me ? me[1] : '' };
  return { main: s, extra: '' };
}
function partsToHltb(main, extra){
  main = String(main||'').trim();
  extra = String(extra||'').trim();
  if(!main) return '—';
  if(/^\d/.test(main) && extra && /^\d/.test(extra)) return `Main: ${main}, +Extra: ${extra}`;
  if(/^\d/.test(main)) return `Main: ${main}`;
  return main;
}
function hltbIsNumeric(str){ return !str || str === '—' || /^\d/.test(String(str).replace(/^Main:\s*/i,'')); }
function linkIconGuess(label){
  const l = String(label||'').toLowerCase();
  if(l.includes('steam')) return 'steam';
  if(l.includes('pcgw') || l.includes('pcgamingwiki')) return 'pcgw';
  if(l.includes('nexus')) return 'nexus';
  return '';
}

            <div class="field">
              <label>Size</label>
              <input type="text" id="f-size" value="${String(draft.size||'').replace(/"/g,'&quot;')}" placeholder="3.2 GB">
            </div>
            <div class="field">
              <label>HLTB type</label>
              <div class="radio-row" id="f-hltb-type">
                <label><input type="radio" name="fhltb" value="numeric" ${numericHltb?'checked':''}> Numeric</label>
                <label><input type="radio" name="fhltb" value="text" ${!numericHltb?'checked':''}> Text</label>
              </div>
            </div>
            <div class="field span-2" id="hltb-numeric" style="${numericHltb?'':'display:none'}">
              <label>HLTB</label>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:.6rem">
                <input type="number" id="f-hltb-main" placeholder="Main hrs" value="${hp.main}">
                <input type="number" id="f-hltb-extra" placeholder="+ Extra hrs (optional)" value="${hp.extra}">
              </div>
            </div>
            <div class="field span-2" id="hltb-text" style="${numericHltb?'display:none':''}">
              <label>HLTB (free text)</label>
              <input type="text" id="f-hltb-raw" placeholder="Unending / Ongoing / Endless…" value="${!numericHltb ? String(draft.hltb||'').replace(/"/g,'&quot;') : ''}">
            </div>
            <div class="field">
              <label>Developer</label>
              <input type="text" id="f-dev" value="${String(draft.dev||'').replace(/"/g,'&quot;')}" placeholder="Studio name">
            </div>
            <div class="field">
              <label>Publisher</label>
              <input type="text" id="f-pub" value="${String(draft.pub||'').replace(/"/g,'&quot;')}" placeholder="Publisher">
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="sec-title">Media</div>
          <div class="form-grid">
            <div class="field span-2">
              <label>Screenshot</label>
              <div class="img-input">
                <div class="preview shot-preview" id="shot-preview">${draft.screenshot ? `<img src="${draft.screenshot}" alt="">` : '1280 × 720'}</div>
                <div class="controls">
                  <input type="text" id="f-screenshot" placeholder="images/xyz.jpg or https://…" value="${String(draft.screenshot||'').replace(/"/g,'&quot;')}">
                  <label class="upload-btn">↑ Upload file<input type="file" accept="image/*" id="f-screenshot-file"></label>
                </div>
              </div>
            </div>
            <div class="field span-2">
              <label>Logo</label>
              <div class="img-input">
                <div class="preview" id="logo-preview">${draft.logo ? `<img src="${draft.logo}" alt="">` : '504 × 562'}</div>
                <div class="controls">
                  <input type="text" id="f-logo" placeholder="images/xyz-logo.png or https://…" value="${String(draft.logo||'').replace(/"/g,'&quot;')}">
                  <label class="upload-btn">↑ Upload file<input type="file" accept="image/*" id="f-logo-file"></label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="sec-title">Links</div>
          <div class="links-list" id="links-list">${linksHTML}</div>
          <button type="button" class="add-link-btn" id="add-link-btn"><span class="icon icon-plus"></span>Add link</button>
        </div>

        <div class="form-section">
          <div class="sec-title">Cross-references</div>
          <div class="tag-cloud" id="cross-tags">${crossTagsHTML}</div>
        </div>

        <div class="form-section">
          <div class="sec-title">Status</div>
          <div class="flag-row" id="flag-row">
            <button type="button" class="flag-btn ${draft.ready?'on':''}" data-flag="ready"><span class="lamp"></span>Ready</button>
            <button type="button" class="flag-btn ${draft.onDisk?'on':''}" data-flag="onDisk"><span class="lamp"></span>On Disk</button>
          </div>
        </div>

        <div class="form-section">
          <div class="sec-title">Notes</div>
          <div class="field">
            <textarea id="f-notes" placeholder="Any notes about this game…">${String(draft.notes||'').replace(/</g,'&lt;')}</textarea>
          </div>
        </div>
      </div>

      <div class="admin-foot">
        <div class="left-actions">
          ${!isNew ? `<button type="button" class="btn danger" id="delete-btn"><span class="icon icon-trash"></span>Delete</button>` : ''}
        </div>
        <div class="right-actions">
          <button type="button" class="btn" data-close>Cancel</button>
          <button type="button" class="btn primary" id="save-btn">${isNew ? 'Create' : 'Save changes'}</button>
        </div>
      </div>
    </div>`;
  backdrop.classList.add('open');

  const $ = sel => modalSlot.querySelector(sel);

  $('#f-group').addEventListener('change', e => {
    const grp = e.target.value;
    $('#f-tab').innerHTML = TABS[grp].map(t => `<option value="${t.id}">${t.label}</option>`).join('');
  });

  $('#f-hltb-type').addEventListener('change', e => {
    const v = e.target.value;
    $('#hltb-numeric').style.display = v === 'numeric' ? '' : 'none';
    $('#hltb-text').style.display    = v === 'numeric' ? 'none' : '';
  });

  $('#f-screenshot').addEventListener('input', e => {
    const v = e.target.value.trim();
    $('#shot-preview').innerHTML = v ? `<img src="${v}" alt="">` : '1280 × 720';
  });
  $('#f-logo').addEventListener('input', e => {
    const v = e.target.value.trim();
    $('#logo-preview').innerHTML = v ? `<img src="${v}" alt="">` : '504 × 562';
  });
  $('#f-screenshot-file').addEventListener('change', () => toast('File upload not wired yet — paste a URL instead', 'bad'));
  $('#f-logo-file').addEventListener('change', () => toast('File upload not wired yet — paste a URL instead', 'bad'));

  $('#flag-row').addEventListener('click', e => {
    const btn = e.target.closest('.flag-btn');
    if(!btn) return;
    btn.classList.toggle('on');
  });

  const linksList = $('#links-list');
  $('#add-link-btn').addEventListener('click', () => {
    const row = document.createElement('div');
    row.className = 'link-row';
    row.innerHTML = `<input type="text" class="link-label" placeholder="Label"><input type="text" class="link-url" placeholder="https://…"><button type="button" class="remove-link">✕</button>`;
    linksList.appendChild(row);
    row.querySelector('.link-label').focus();
  });
  linksList.addEventListener('click', e => {
    if(!e.target.closest('.remove-link')) return;
    e.target.closest('.link-row').remove();
  });

  if(!isNew){
    $('#delete-btn').addEventListener('click', () => openConfirmDelete(g));
  }

  $('#save-btn').addEventListener('click', () => {
    const name = $('#f-name').value.trim();
    if(!name){ toast('Name is required', 'bad'); return; }
    const fgroup = $('#f-group input:checked').value;
    const ftab = $('#f-tab').value;
    const hltbType = $('#f-hltb-type input:checked').value;
    const hltb = hltbType === 'numeric'
      ? partsToHltb($('#f-hltb-main').value, $('#f-hltb-extra').value)
      : ($('#f-hltb-raw').value.trim() || '—');
    const links = [...linksList.querySelectorAll('.link-row')].map(row => {
      const label = row.querySelector('.link-label').value.trim();
      const url   = row.querySelector('.link-url').value.trim();
      if(!label && !url) return null;
      const obj = { label: label || 'Link', url };
      const guess = linkIconGuess(label);
      if(guess) obj.icon = guess;
      return obj;
    }).filter(Boolean);
    const extraTags = [...$('#cross-tags').querySelectorAll('input[type=checkbox]:checked')]
      .map(cb => cb.dataset.tag).filter(t => t !== ftab);
    const ready  = $('#flag-row [data-flag="ready"]').classList.contains('on');
    const onDisk = $('#flag-row [data-flag="onDisk"]').classList.contains('on');

    const out = {
      id: draft.id || name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),
      name, group: fgroup, tab: ftab,
      platform: $('#f-platform').value.trim(),
      release: $('#f-release').value.trim(),
      size: $('#f-size').value.trim(),
      hltb,
      dev: $('#f-dev').value.trim(),
      pub: $('#f-pub').value.trim(),
      notes: $('#f-notes').value.trim(),
      ready, onDisk, links, extraTags,
      screenshot: $('#f-screenshot').value.trim(),
      logo: $('#f-logo').value.trim(),
    };
    console.log('Save payload:', out);
    toast('Save not wired yet — GitHub write API comes next', 'bad');
  });
}
function openConfirmDelete(g){
  modalSlot.innerHTML = `
    <div class="confirm">
      <h3><span class="icon icon-trash" style="width:1em;height:1em"></span>Delete game?</h3>
      <p>You're about to remove <span class="gname">${g.name}</span> from <strong>${tabLabelFor(g)}</strong>.</p>
      <p class="warn">This edits the repo JSON directly. A commit is created — you can always recover via git history, but the site updates immediately.</p>
      <div class="btns">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="button" class="btn danger" id="confirm-delete"><span class="icon icon-trash"></span>Delete</button>
      </div>
    </div>`;
  backdrop.classList.add('open');
  modalSlot.querySelector('#confirm-delete').addEventListener('click', () => {
    console.log('Delete payload:', g);
    toast('Delete not wired yet — GitHub write API comes next', 'bad');
  });
}
function tabLabelFor(g){
  const tb = g._tab || tab;
  const t = ALL_TABS.find(x => x.id === tb);
  return t ? t.label : tb;
}
function closeAll(){
  backdrop.classList.remove('open');
  modalSlot.innerHTML = '';
  closeAllDropdowns();
}
modalSlot.addEventListener('click', e => { if(e.target.closest('[data-close]')) closeAll(); });

/* ============================================================
   CONTENT CLICKS
   ============================================================ */
contentEl.addEventListener('click', e => {
  const adminBtnEl = e.target.closest('.card-admin button');
  if(adminBtnEl){
    e.stopPropagation();
    const g = findGameById(adminBtnEl.dataset.id);
    if(!g) return;
    g._group = group; g._tab = tab;
    if(adminBtnEl.dataset.act === 'edit') openEditor(g);
    else if(adminBtnEl.dataset.act === 'del') openConfirmDelete(g);
    return;
  }
  const jb = e.target.closest('.jump-btn');
  if(jb){
    const t = document.getElementById(jb.dataset.jump);
    if(t) t.scrollIntoView({ behavior:'smooth', block:'start' });
    return;
  }
  const sr = e.target.closest('.series-game-row');
  if(sr){
    const sg = seriesGameIndex.get(sr.dataset.rowId);
    if(sg) openSeriesModal(sg);
    return;
  }
  const rowD = e.target.closest('.rowD');
  if(rowD){
    const arr = currentTabData();
    if(Array.isArray(arr)){
      const g = arr.find(x => x.id === rowD.dataset.id);
      if(g){
        const rankMap = new Map();
        arr.forEach((x,i) => rankMap.set(x.id, i+1));
        openModal(g, rankMap.get(g.id));
      }
    }
    return;
  }
  const card = e.target.closest('.card');
  if(card){
    const g = findGameById(card.dataset.id);
    if(!g) return;
    if(g.source === 'series'){
      openSeriesModal({ ...g, seriesName: g.series, note: g.notes || '' });
    } else {
      openModal(g);
    }
  }
});

/* ============================================================
   BOOT
   ============================================================ */
renderTabs();
renderContent();
bootAdminFlow();
</script>
</body>
</html>
