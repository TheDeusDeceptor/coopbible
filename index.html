<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co-Op Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/corsfix"></script>
<style>
  :root{
    --bg:#0a0d14;--bg-glow:#0f1622;--card:#101624;--border:#1e2836;
    --accent:#38bdf8;--accent-soft:rgba(56,189,248,.14);--accent-line:rgba(56,189,248,.35);
    --text:#e6ebf2;--muted:#7d8798;
    --green:#4ade80;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;
    --purple:#a78bfa;--hltb:#fb7185;
    --pink:#f472b6;
    --steam:#66c0f4;
    --xbox:#4ade80;
    --font-head:'Chakra Petch',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --cols:auto;
  }
  body[data-group="single"]{
    --bg:#0d0708;--bg-glow:#1a0b0e;--card:#160d10;--border:#2a161b;
    --accent:#e11d48;--accent-soft:rgba(225,29,72,.14);--accent-line:rgba(225,29,72,.38);
  }
  html{font-size:16px}
  *{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent-line);background-clip:padding-box}
  html{scroll-behavior:smooth}
  body{
    background:radial-gradient(ellipse 80% 55% at 50% -10%, var(--bg-glow) 0%, transparent 60%),var(--bg);
    background-attachment:fixed;color:var(--text);font-family:var(--font-body);min-height:100vh;padding:1.75rem;
  }
  .icon{display:inline-block;width:.85em;height:.85em;background-color:currentColor;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;flex-shrink:0;vertical-align:middle;}
  .icon-pcgw{-webkit-mask-image:url(icons/wrench.svg);mask-image:url(icons/wrench.svg);}
  .icon-nexus{-webkit-mask-image:url(icons/nexus.svg);mask-image:url(icons/nexus.svg);}
  .icon-generic{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'/%3E%3Cpath d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'/%3E%3Cpath d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'/%3E%3C/svg%3E");}
  .icon-search{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M21 21l-4.3-4.3'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M21 21l-4.3-4.3'/%3E%3C/svg%3E");}
  .icon-hltb{-webkit-mask-image:url(icons/clock.svg);mask-image:url(icons/clock.svg);}
  .icon-size{-webkit-mask-image:url(icons/hdd.svg);mask-image:url(icons/hdd.svg);}
  .icon-date{-webkit-mask-image:url(icons/calendar.svg);mask-image:url(icons/calendar.svg);}
  .icon-platform{-webkit-mask-image:url(icons/monitor.svg);mask-image:url(icons/monitor.svg);}
  .icon-dev{-webkit-mask-image:url(icons/code.svg);mask-image:url(icons/code.svg);}
  .icon-pub{-webkit-mask-image:url(icons/briefcase.svg);mask-image:url(icons/briefcase.svg);}
  .icon-pencil{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 20h9'/%3E%3Cpath d='M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4z'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 20h9'/%3E%3Cpath d='M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4z'/%3E%3C/svg%3E");}
  .icon-trash{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='3 6 5 6 21 6'/%3E%3Cpath d='M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6'/%3E%3Cpath d='M10 11v6M14 11v6'/%3E%3Cpath d='M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='3 6 5 6 21 6'/%3E%3Cpath d='M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6'/%3E%3Cpath d='M10 11v6M14 11v6'/%3E%3Cpath d='M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2'/%3E%3C/svg%3E");}
  .icon-plus{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M12 5v14M5 12h14'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M12 5v14M5 12h14'/%3E%3C/svg%3E");}
  .icon-move{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='5 9 2 12 5 15'/%3E%3Cpolyline points='9 5 12 2 15 5'/%3E%3Cpolyline points='15 19 12 22 9 19'/%3E%3Cpolyline points='19 9 22 12 19 15'/%3E%3Cline x1='2' y1='12' x2='22' y2='12'/%3E%3Cline x1='12' y1='2' x2='12' y2='22'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='5 9 2 12 5 15'/%3E%3Cpolyline points='9 5 12 2 15 5'/%3E%3Cpolyline points='15 19 12 22 9 19'/%3E%3Cpolyline points='19 9 22 12 19 15'/%3E%3Cline x1='2' y1='12' x2='22' y2='12'/%3E%3Cline x1='12' y1='2' x2='12' y2='22'/%3E%3C/svg%3E");}
  .icon-cols{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='7' height='18' rx='1'/%3E%3Crect x='14' y='3' width='7' height='18' rx='1'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='7' height='18' rx='1'/%3E%3Crect x='14' y='3' width='7' height='18' rx='1'/%3E%3C/svg%3E");}
  header{max-width:1400px;margin:0 auto 1.75rem;display:flex;justify-content:center;position:relative;}
  .admin-toggle,.lbdb-btn{
    position:absolute;top:50%;transform:translateY(-50%);
    display:none;align-items:center;gap:.5rem;
    font-family:var(--font-head);font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:.55rem .85rem;border:1px solid var(--border);border-radius:8px;
    background:rgba(255,255,255,.015);color:var(--muted);cursor:pointer;transition:all .18s ease;
    white-space:nowrap;
  }
  body.admin-on .lbdb-btn{display:inline-flex;}
  .lbdb-btn{left:0;}
  .admin-toggle{right:0;display:inline-flex;}
  .admin-toggle:hover,.lbdb-btn:hover{color:#cbd5e1;border-color:var(--accent-line)}
  .admin-toggle .lamp,.lbdb-btn .lamp{width:7px;height:7px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1px #4a5468;transition:all .18s ease;}
  body.admin-on .admin-toggle{color:var(--red);border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
  body.admin-on .admin-toggle .lamp{background:var(--red);box-shadow:0 0 8px var(--red)}
  .lbdb-btn.running .lamp{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1.4s ease-in-out infinite;}
  .lbdb-btn.running{color:var(--amber);border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.08)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .switch{
    position:relative;width:280px;height:58px;padding:5px;display:flex;cursor:pointer;user-select:none;border-radius:29px;
    background:linear-gradient(180deg,rgba(0,0,0,.55) 0%, rgba(255,255,255,.02) 100%);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.85),inset 0 -1px 0 rgba(255,255,255,.03),0 1px 0 rgba(255,255,255,.03);
    border:1px solid var(--border);transition:border-color .25s ease;
  }
  .switch:hover{border-color:var(--accent-line)}
  .switch-knob{position:absolute;top:5px;left:5px;width:calc(50% - 5px);height:calc(100% - 10px);border-radius:24px;background:linear-gradient(180deg,#2a3444 0%,#1b2330 55%,#141b26 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.6);transition:transform .32s cubic-bezier(.34,1.15,.4,1);z-index:1;}
  .switch-knob::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 50% 0%, var(--accent-soft), transparent 60%);transition:background .35s ease;}
  body[data-group="single"] .switch-knob{transform:translateX(100%)}
  .switch-label{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:.82rem;letter-spacing:.12em;color:#4a5468;transition:color .22s ease,text-shadow .22s ease;pointer-events:none;}
  .switch[data-active="coop"] .switch-label[data-side="coop"],.switch[data-active="single"] .switch-label[data-side="single"]{color:#e8f6ff;text-shadow:0 0 10px var(--accent-line);}
  .tabbar{max-width:1400px;margin:0 auto 1rem;display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;}
  .tabbar button{font-family:var(--font-head);font-weight:600;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:.5rem .9rem;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;transition:all .2s ease;}
  .tabbar button:hover{color:#cbd5e1;border-color:var(--accent-line)}
  .tabbar button.active{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}

  .commit-badge{
    position:fixed;top:1.5rem;right:1.5rem;z-index:450;
    display:none;align-items:center;gap:.5rem;
    padding:.45rem .75rem;
    background:rgba(12,16,23,.92);
    border:1px solid var(--border);border-radius:8px;
    font-family:var(--font-head);font-size:.58rem;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:all .2s ease;
  }
  body.admin-on .commit-badge{display:inline-flex}
  .commit-badge .dot{
    width:8px;height:8px;border-radius:50%;
    background:#4a5468;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
    transition:all .2s ease;flex-shrink:0;
  }
  .commit-badge.pushing{color:var(--amber);border-color:rgba(245,158,11,.45);}
  .commit-badge.pushing .dot{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1.1s ease-in-out infinite;}
  .commit-badge.accepted{color:var(--green);border-color:rgba(74,222,128,.45);}
  .commit-badge.accepted .dot{background:var(--green);box-shadow:0 0 8px var(--green);}
  .commit-badge.failed{color:var(--red);border-color:rgba(239,68,68,.45);cursor:pointer;}
  .commit-badge.failed .dot{background:var(--red);box-shadow:0 0 8px var(--red);}
  .commit-badge.failed:hover{background:rgba(239,68,68,.1);}

  .pending-strip{
    max-width:1400px;margin:0 auto 1rem;
    display:none;align-items:center;gap:1rem;
    padding:.6rem 1rem;
    background:linear-gradient(180deg,rgba(74,222,128,.06) 0%,transparent 100%);
    border:1px solid rgba(74,222,128,.35);border-radius:9px;
    cursor:pointer;transition:border-color .18s ease,background .18s ease;
  }
  .pending-strip:hover{border-color:rgba(74,222,128,.55);background:linear-gradient(180deg,rgba(74,222,128,.1) 0%,transparent 100%);}
  .pending-strip.on{display:flex}
  .pending-strip .count{font-family:var(--font-head);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);}
  .pending-strip .count .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);margin-right:.5rem;vertical-align:middle;animation:pulse 1.6s ease-in-out infinite;}
  .pending-strip .hint{margin-left:auto;font-family:var(--font-head);font-size:.58rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .pending-strip .btns{display:flex;gap:.5rem;pointer-events:auto;}
  .pending-strip button{font-family:var(--font-head);font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:.45rem .85rem;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;transition:all .18s ease;}
  .pending-strip button:hover{color:#cbd5e1;border-color:var(--accent-line)}
  .pending-strip button.commit{color:var(--green);border-color:rgba(74,222,128,.5);background:rgba(74,222,128,.08);}
  .pending-strip button.commit:hover{color:#fff;background:rgba(74,222,128,.2)}
  .pending-strip button:disabled{opacity:.5;cursor:wait}

  .toolbar{max-width:1400px;margin:0 auto 1.25rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;}
  .toolbar.empty{display:none}
  .tb-left{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
  .tb-right{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
  .dd{position:relative}
  .dd-btn{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--font-head);font-weight:600;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:.6rem .9rem;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.015);color:#cbd5e1;cursor:pointer;transition:all .18s ease;white-space:nowrap;}
  .dd-btn:hover{color:#fff;border-color:var(--accent-line);background:var(--accent-soft)}
  .dd.open .dd-btn{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
  .dd-btn .chev{font-size:.7rem;line-height:1;opacity:.7;transition:transform .18s ease;}
  .dd.open .dd-btn .chev{transform:rotate(180deg)}
  .dd-btn .val{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:.02em;font-family:var(--font-body);font-size:.82rem;}
  .dd.open .dd-btn .val,.dd-btn:hover .val{color:#e6ebf2}
  /* Non-default sort indicator — outlined like the search-field chips */
  .dd-btn.non-default{
    color:var(--accent);
    border-color:var(--accent-line);
    background:var(--accent-soft);
  }
  .dd-btn.non-default .val{color:var(--accent);}
  .dd-menu{position:absolute;top:calc(100% + .35rem);left:0;z-index:50;min-width:200px;background:#0c1017;border:1px solid var(--border);border-radius:9px;padding:.35rem;box-shadow:0 12px 32px rgba(0,0,0,.55);display:none;flex-direction:column;gap:.1rem;animation:menuIn .13s ease-out;}
  .dd.open .dd-menu{display:flex}
  @keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .dd-item{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-radius:6px;font-family:var(--font-body);font-size:.86rem;font-weight:500;color:#cbd5e1;background:transparent;border:none;cursor:pointer;text-align:left;width:100%;transition:background .12s ease,color .12s ease;white-space:nowrap;}
  .dd-item:hover{background:rgba(255,255,255,.04);color:#fff}
  .dd-item.active{color:var(--accent)}
  .dd-item.active .dd-tick{opacity:1}
  .dd-tick{margin-left:auto;font-size:.85rem;line-height:1;opacity:0;color:var(--accent);}
  .dd-item .dir{font-size:.75rem;line-height:1;opacity:.45;color:var(--muted);}
  .dd-item.active .dir{opacity:1;color:var(--accent)}
  .search-box{position:relative;display:flex;align-items:center;}
  .search-box .s-icon{position:absolute;left:10px;width:14px;height:14px;color:var(--muted);pointer-events:none;}
  .search-box input{font-family:var(--font-body);font-size:.85rem;color:#e6ebf2;background:rgba(255,255,255,.015);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem .6rem 2.1rem;width:220px;outline:none;transition:border-color .18s ease,background .18s ease;}
  .search-box input::placeholder{color:#4a5468}
  .search-box input:focus{border-color:var(--accent-line);background:var(--accent-soft);}
  .chk{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-head);font-size:.6rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:.4rem .6rem;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;transition:all .16s ease;appearance:none;-webkit-appearance:none;}
  .chk:hover{color:#cbd5e1;border-color:var(--accent-line)}
  .chk .dot{width:7px;height:7px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1px #4a5468;transition:all .16s ease;}
  .chk.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
  .chk.on .dot{background:var(--accent);box-shadow:0 0 6px var(--accent);}
  .btn-add{display:none;align-items:center;gap:.45rem;font-family:var(--font-head);font-weight:700;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;padding:.6rem .95rem;border:1px solid var(--red);border-radius:8px;background:rgba(239,68,68,.1);color:var(--red);cursor:pointer;transition:all .18s ease;}
  body.admin-on .btn-add{display:inline-flex;}
  .btn-add:hover{background:rgba(239,68,68,.18);color:#fff;border-color:#fff}
  .section-header{max-width:1400px;margin:2rem auto 1rem;display:flex;align-items:center;gap:.85rem;scroll-margin-top:1.5rem;}
  .section-header:first-child{margin-top:0}
  .section-header .bar{width:3px;height:18px;background:var(--accent);border-radius:2px;flex-shrink:0;}
  .section-header .label{font-family:var(--font-head);font-size:.78rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);white-space:nowrap;}
  .section-header .line{flex:1;height:1px;background:var(--border);}
  .jump-btn{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-head);font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:.4rem .7rem;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .18s ease;}
  .jump-btn:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
  .jump-btn .arw{font-size:.85rem;line-height:1}

function fmtHltbMain(str){
  if(!str || str === '—') return '—';
  const s = String(str).trim();
  const m = s.match(/^Main:\s*([\d.]+)/i);
  if(m) return `${m[1]} hrs`;
  return s;
}
function fmtHltb(str, html){
  if(!str || str === '—') return '—';
  const s = String(str).trim();
  const m = s.match(/^Main:\s*([\d.]+)(?:\s*,\s*\+Extra:\s*([\d.]+))?$/i);
  if(m){
    const main = m[1], extra = m[2];
    if(html){
      if(extra && extra !== main) return `${main}<span class="sep">to</span>${extra}<span class="unit">hrs</span>`;
      return `${main}<span class="unit">hrs</span>`;
    }
    if(extra && extra !== main) return `${main} to ${extra} hrs`;
    return `${main} hrs`;
  }
  return s;
}
function fmtHltbRange(main, extra, html){
  if(main === undefined || main === null || main === '') return '—';
  const same = (extra === undefined || extra === null || extra === main);
  if(html){
    if(same) return `${main}<span class="unit">hrs</span>`;
    return `${main}<span class="sep">to</span>${extra}<span class="unit">hrs</span>`;
  }
  if(same) return `${main} hrs`;
  return `${main} to ${extra} hrs`;
}
function fmtSize(str, html){
  if(!str || str === '—') return str || '—';
  const s = String(str).trim();
  if(!html) return s;
  const m = s.match(/^([\d.]+)\s*(GB|MB|TB|KB)$/i);
  if(!m) return s;
  return `${m[1]}<span class="unit">${m[2]}</span>`;
}
function parseEADates(str){
  if(!str) return { initial:null, target:null };
  const s = String(str).trim();
  const m = s.match(/^Init\.\s*([^→]+?)(?:\s*→\s*(.+))?$/);
  if(m) return { initial: m[1].trim(), target: m[2] ? m[2].trim() : null };
  return { initial:null, target:null };
}
function releaseKey(str){
  if(!str) return 0;
  let s = String(str).trim();
  s = s.replace(/^Init\.\s*/i, '').split('→')[0].trim();
  const full = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if(full) return +full[3]*10000 + +full[2]*100 + +full[1];
  const y = s.match(/(\d{4})/);
  if(y) return +y[1]*10000;
  return 0;
}
function sizeKey(str){
  if(!str || str === '—') return -1;

  const v = parseFloat(m[1]); const u = m[2].toUpperCase();
  if(u==='TB') return v*1024;
  if(u==='GB') return v;
  if(u==='MB') return v/1024;
  if(u==='KB') return v/1024/1024;
  return v;
}

function levSimilarity(a, b){
  let longer = String(a||'').toLowerCase().trim();
  let shorter = String(b||'').toLowerCase().trim();
  if(longer.length < shorter.length){ const t = longer; longer = shorter; shorter = t; }
  if(longer.length === 0) return 1.0;
  const m = longer.length, n = shorter.length;
  let prev = new Array(n + 1), curr = new Array(n + 1);
  for(let j = 0; j <= n; j++) prev[j] = j;
  for(let i = 1; i <= m; i++){
    curr[0] = i;
    for(let j = 1; j <= n; j++){
      const cost = longer[i-1] === shorter[j-1] ? 0 : 1;
      curr[j] = Math.min(curr[j-1]+1, prev[j]+1, prev[j-1]+cost);
    }
    [prev, curr] = [curr, prev];
  }
  return Math.round(((m - prev[n]) / m) * 100) / 100;
}

/* ============================================================
   LBDB TITLE NORMALIZATION
   ============================================================ */
const ROM_EXTENSIONS = [
  "chd","zip","7z","rar","iso","cue","bin","gdi","cdi","mdf","ccd","img",
  "nes","fds","sfc","smc","gb","gbc","gba","n64","z64","v64","nds","3ds",
  "cso","pbp","wbfs","rvz","wad","elf","pkg","xex","wsc","ws","ngp","ngc",
  "vec","col","a26","a52","a78","lnx","pce","sgx","md","gen","32x","gg",
  "sms","dsk","d64","adf","ipf","hdf","st",
  "m3u","nsp","zcci","singe","j64","ndd","sv","vb","min","int","hdi","wux","cpr"
];
const ROM_EXT_REGEX = new RegExp("\\.(" + ROM_EXTENSIONS.join("|") + ")$", "i");
const ROM_REGION_WORDS = new Set([
  "usa","europe","japan","world","asia","korea","china","taiwan","brazil",
  "australia","canada","germany","france","spain","italy","netherlands",
  "sweden","pal","ntsc","ntscu","ntscj","unl","proto","beta","demo","sample"
]);
const ROM_LANG_BLOB_RE = /^(en|fr|de|es|it|ja|ko|zh|nl|sv|pt|ru|pl|da|no|fi){2,}$/;
const ROM_VERSION_RE = /^v\d+(\.\d+)*$/;

function stripTrailingRomTags_(tokens){
  while(tokens.length > 1){
    const last = tokens[tokens.length - 1];
    const secondLast = tokens[tokens.length - 2];
    if(ROM_REGION_WORDS.has(last) || ROM_LANG_BLOB_RE.test(last) || ROM_VERSION_RE.test(last)){
      tokens.pop();
      continue;
    }
    if(/^\d+$/.test(last) && secondLast === "rev"){
      tokens.pop(); tokens.pop();
      continue;
    }
    if(last === "rev"){
      tokens.pop();
      continue;
    }
    break;
  }
  return tokens;
}
function normalizeLBDBTitle_(str){
  const cleaned = String(str || '')
    .replace(ROM_EXT_REGEX, "")
    .toLowerCase()
    .replace(/\[.*?\]/g, " ")
    .replace(/\(.*?\)/g, " ")
    .replace(/[_]/g, " ")
    .replace(/['’]/g, "")
    .replace(/[:\-–—.,!®™]/g, " ")
    .replace(/\b(the|a|an)\b/g, " ")
    .replace(/\s+/g, " ")
    .trim();
  const tokens = stripTrailingRomTags_(cleaned.split(" ").filter(Boolean));
  return tokens.join(" ");
}
function normKey(s){ return normalizeLBDBTitle_(String(s || '')); }

/* ============================================================
   MEDIA SOURCE HELPERS
   ============================================================ */
function resolveImgUrl(url){
  if(!url) return '';
  const s = String(url);
  if(/^https?:|^data:|^\/\//.test(s)) return s;
  return PAGES_BASE + s.replace(/^\/+/, '');
}
function b64url(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');
}
function screenshotSrc(url){
  if(!url) return '';
  const staged = stagedAssetUrls.get(url);
  if(staged) return staged;
  const u = resolveImgUrl(url);
  if(!u) return '';
  if(u.startsWith('data:')) return u;
  if(/\/images\//.test(u)) return u;
  return 'https://images.weserv.nl/?url=' + encodeURIComponent(u) + '&h=720';
}
function logoSrc(url){
  if(!url) return '';
  const staged = stagedAssetUrls.get(url);
  if(staged) return staged;
  const u = resolveImgUrl(url);
  if(!u) return '';
  if(u.startsWith('data:')) return u;
  if(/\/images\//.test(u)) return u;
  const b64 = b64url(u);
  return 'https://res.cloudinary.com/' + CLOUDINARY_CLOUD +
    '/image/fetch/l_fetch:' + b64 +
    ',w_400,h_400,c_limit,g_center/fl_layer_apply/' +
    CLOUDINARY_CANVAS;
}

/* ============================================================

   ============================================================ */
function normaliseFileData(tabId, raw){
  if(tabId === 'backlog'){
    return {
      mirror: Array.isArray(raw.mirror) ? raw.mirror : [],
      seriesLeftovers: Array.isArray(raw.seriesLeftovers) ? raw.seriesLeftovers : [],
    };
  }
  if(tabId === 'backlog-series'){
    return { series: Array.isArray(raw.series) ? raw.series : [] };
  }
  return Array.isArray(raw.games) ? raw.games : [];
}
async function loadTabData(grp, tabId, force){
  if(!force && LOAD_STATE[grp][tabId] === 'loaded') return;
  if(!force && LOAD_STATE[grp][tabId] === 'loading') return;
  LOAD_STATE[grp][tabId] = 'loading';
  const file = TAB_FILES[tabId];
  try{
    const res = await fetch(file, { cache: 'no-cache' });
    if(res.status === 404){
      DATA[grp][tabId] = normaliseFileData(tabId, tabId === 'backlog' ? {} : tabId === 'backlog-series' ? {} : { games: [] });
      LOAD_STATE[grp][tabId] = 'missing';
      return;
    }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();
    DATA[grp][tabId] = normaliseFileData(tabId, raw);
    LOAD_STATE[grp][tabId] = 'loaded';
  }catch(e){
    console.error('loadTabData failed for', file, e);
    DATA[grp][tabId] = normaliseFileData(tabId, tabId === 'backlog' ? {} : tabId === 'backlog-series' ? {} : { games: [] });
    LOAD_STATE[grp][tabId] = 'error';
  }
}
function currentTabData(){ return DATA[group][tab]; }

  LOAD_STATE[group][tab] = 'idle';
  DATA[group][tab] = null;

}
async function forceLoadAll(){
  const tasks = [];
  for(const t of ALL_TABS){
    const g = TAB_GROUP[t.id];
    tasks.push(loadTabData(g, t.id));
  }
  await Promise.all(tasks);
}

function getToken(){ return localStorage.getItem('gh_admin_token') || ''; }

async function verifyToken(token){
  try{
    const res = await fetch('https://api.github.com/user', {
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
    });
    if(res.status === 200){ const data = await res.json(); return { ok:true, login: data.login }; }
    if(res.status === 401) return { ok:false, err:'Invalid or expired token' };
    if(res.status === 403) return { ok:false, err:'Token rejected' };
    return { ok:false, err:'GitHub API HTTP ' + res.status };
  }catch(e){ return { ok:false, err:'Network error: ' + e.message }; }
}

let lbdbPollTimer = null;
let lbdbStartTime = 0;

async function ghFetch(url, opts = {}){
  const tok = getToken();
  if(!tok) throw new Error('No token');
  const headers = { 'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json', ...(opts.headers || {}) };
  return fetch(url, { ...opts, headers });
}
async function triggerLbdbUpdate(){
  if(!getToken()){ showTokenPrompt(); return; }
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/${LBDB_WORKFLOW}/dispatches`;
  try{
    const res = await ghFetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: 'main' })
    });
    if(res.status === 204){ toast('LBDB update queued'); startLbdbPolling(); }
    else if(res.status === 404){ toast('Workflow not found', 'bad'); }
    else if(res.status === 403 || res.status === 401){ toast('Token needs Actions: write', 'bad'); }
    else { toast('Trigger failed: HTTP ' + res.status, 'bad'); }
  }catch(e){ toast('Trigger failed: ' + e.message, 'bad'); }
}
function startLbdbPolling(){
  lbdbStartTime = Date.now();
  lbdbBtn.classList.add('running');
  lbdbBtnLabel.textContent = 'Running…';
  clearInterval(lbdbPollTimer);
  lbdbPollTimer = setInterval(checkLbdbStatus, 8000);
  checkLbdbStatus();
}
async function checkLbdbStatus(){
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/${LBDB_WORKFLOW}/runs?per_page=1`;
  try{
    const res = await ghFetch(url);
    if(!res.ok) return;
    const data = await res.json();
    const run = (data.workflow_runs || [])[0];
    if(!run) return;
    const startedAt = new Date(run.created_at).getTime();
    if(startedAt < lbdbStartTime - 30000) return;
    const elapsed = Math.round((Date.now() - lbdbStartTime) / 1000);
    lbdbBtnLabel.textContent = `Running… ${elapsed}s`;
    if(run.status === 'completed'){
      clearInterval(lbdbPollTimer); lbdbPollTimer = null;
      lbdbBtn.classList.remove('running');
      if(run.conclusion === 'success'){
        lbdbBtnLabel.textContent = 'LBDB up to date';
        LBDB_INDEX = null; LBDB_LOADING = null;
        toast('LBDB updated — reload to use fresh data');
      } else {
        lbdbBtnLabel.textContent = 'Update failed';
        toast('LBDB update failed: ' + run.conclusion, 'bad');
      }
      setTimeout(() => { lbdbBtnLabel.textContent = 'Update LBDB'; }, 8000);
    }
  }catch(e){}
}

/* ============================================================
   GITHUB FILE READ (for staging)
   ============================================================ */
async function getFileContent(path){
  const token = getToken();
  if(!token) throw new Error('Not signed in');
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}?t=${Date.now()}`;
  const res = await fetch(url, {
    headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
  });
  if(res.status === 404) return { sha: null, json: null };
  if(!res.ok) throw new Error('getFile HTTP ' + res.status);
  const data = await res.json();
  const cleaned = data.content.replace(/\s/g, '');
  const bin = atob(cleaned);
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const text = new TextDecoder('utf-8').decode(bytes);
  return { sha: data.sha, json: JSON.parse(text) };
}

/* ============================================================
   ATOMIC COMMIT (Git Data API)

async function ghGetHeadSha(){
  const r = await ghFetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/ref/heads/main`);
  if(!r.ok) throw new Error('ref HTTP ' + r.status);
  const d = await r.json();
  return d.object.sha;
}
async function ghGetCommitTree(sha){
  const r = await ghFetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/commits/${sha}`);
  if(!r.ok) throw new Error('commit HTTP ' + r.status);
  const d = await r.json();
  return d.tree.sha;
}
async function ghCreateBlob(content){
  const r = await ghFetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/blobs`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content, encoding: 'utf-8' })
  });
  if(!r.ok) throw new Error('blob HTTP ' + r.status);
  const d = await r.json();
  return d.sha;
}
async function ghCreateBlobBase64(content){
  const r = await ghFetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/blobs`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content, encoding: 'base64' })
  });
  if(!r.ok) throw new Error('blob HTTP ' + r.status);
  const d = await r.json();
  return d.sha;
}
async function ghCreateTree(baseTree, tree){
  const r = await ghFetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ base_tree: baseTree, tree })
  });
  if(!r.ok) throw new Error('tree HTTP ' + r.status);
  const d = await r.json();
  return d.sha;
}
async function ghCreateCommit(message, treeSha, parentSha){
  const r = await ghFetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/commits`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, tree: treeSha, parents: [parentSha] })
  });
  if(!r.ok) throw new Error('commit-create HTTP ' + r.status);
  const d = await r.json();
  return d.sha;
}
async function ghUpdateRef(sha){
  const r = await ghFetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/refs/heads/main`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sha, force: false })
  });
  if(!r.ok) throw new Error('ref-update HTTP ' + r.status);
}

function emptyShapeFor(tabId){
  if(tabId === 'backlog') return { mirror: [], seriesLeftovers: [] };
  if(tabId === 'backlog-series') return { series: [] };
  return { games: [] };
}
function upsertGameInFile(json, tabId, game){
  if(tabId === 'backlog'){
    if(!Array.isArray(json.mirror)) json.mirror = [];
    if(!Array.isArray(json.seriesLeftovers)) json.seriesLeftovers = [];
    const idxM = json.mirror.findIndex(x => x.id === game.id);
    if(idxM >= 0){ json.mirror[idxM] = game; return; }
    const idxS = json.seriesLeftovers.findIndex(x => x.id === game.id);
    if(idxS >= 0){ json.seriesLeftovers[idxS] = game; return; }
    json.mirror.push(game);
    return;
  }
  if(tabId === 'backlog-series') throw new Error('Series entries cannot be edited');
  if(!Array.isArray(json.games)) json.games = [];
  const idx = json.games.findIndex(x => x.id === game.id);
  if(idx >= 0){
    json.games[idx] = game;
  } else if(BEATEN_TABS.has(tabId)){
    // Beaten JSONs are stored newest-first — a new beaten game belongs at index 0.
    json.games.unshift(game);
  } else {
    json.games.push(game);
  }
}
function removeGameFromFile(json, tabId, gameId){
  if(tabId === 'backlog'){
    if(Array.isArray(json.mirror)) json.mirror = json.mirror.filter(x => x.id !== gameId);
    if(Array.isArray(json.seriesLeftovers)) json.seriesLeftovers = json.seriesLeftovers.filter(x => x.id !== gameId);
    return;
  }
  if(tabId === 'backlog-series') return;
  if(Array.isArray(json.games)) json.games = json.games.filter(x => x.id !== gameId);
}
function stripInternal(game){
  const out = { ...game };
  delete out._group; delete out._tab; delete out.group; delete out.tab; delete out.source; delete out.series;
  return out;
}
async function commitPending(){
  if(pendingOps.size === 0){ toast('Nothing to commit', 'bad'); return; }
  if(!getToken()){ showTokenPrompt(); return; }

  const stripCommit = pendingStrip.querySelector('.commit');
  const stripDisc = pendingStrip.querySelector('.discard');
  if(stripCommit){ stripCommit.disabled = true; stripCommit.textContent = '…Committing'; }
  if(stripDisc) stripDisc.disabled = true;

  setCommitState('pushing');

  try{
    const jsonOps = [];
    const assetOps = [];
    for(const op of pendingOps.values()){
      if(op.action === 'asset') assetOps.push(op);
      else jsonOps.push(op);
    }

    const byTab = new Map();
    for(const op of jsonOps){
      if(!byTab.has(op.tabId)) byTab.set(op.tabId, []);
      byTab.get(op.tabId).push(op);
    }

    const writes = [];
    for(const [tabId, ops] of byTab){
      const path = TAB_FILES[tabId];
      const { json } = await getFileContent(path);
      const fileJson = json || emptyShapeFor(tabId);
      for(const op of ops){
        if(op.action === 'upsert' && op.game) upsertGameInFile(fileJson, tabId, stripInternal(op.game));
        else if(op.action === 'delete') removeGameFromFile(fileJson, tabId, op.id);
      }
      writes.push({ path, content: JSON.stringify(fileJson, null, 2) + '\n' });
    }

    const headSha = await ghGetHeadSha();
    const baseTree = await ghGetCommitTree(headSha);
    const tree = [];
    for(const w of writes){
      const blobSha = await ghCreateBlob(w.content);
      tree.push({ path: w.path, mode: '100644', type: 'blob', sha: blobSha });
    }
    for(const op of assetOps){
      const blobSha = await ghCreateBlobBase64(op.content);
      tree.push({ path: op.path, mode: '100644', type: 'blob', sha: blobSha });
    }
    const newTree = await ghCreateTree(baseTree, tree);

    let adds = 0, edits = 0, dels = 0, assets = 0;
    for(const op of pendingOps.values()){
      if(op.action === 'delete') dels++;
      else if(op.action === 'asset') assets++;
      else if(op.original) edits++;
      else adds++;
    }
    const parts = [];
    if(adds) parts.push(`${adds} added`);
    if(edits) parts.push(`${edits} edited`);
    if(dels) parts.push(`${dels} deleted`);
    if(assets) parts.push(`${assets} asset${assets === 1 ? '' : 's'}`);
    const msg = 'Batch: ' + (parts.join(', ') || 'update');

    const newCommit = await ghCreateCommit(msg, newTree, headSha);
    await ghUpdateRef(newCommit);

    pendingOps.clear();
    stagedAssetUrls.clear();
    updatePendingStrip();
    refreshCurrentTab();
    setCommitState('accepted');
    toast('Committed');
  }catch(e){
    console.error('commit failed', e);
    setCommitState('failed', e.message);
    toast('Commit failed: ' + e.message, 'bad');
    updatePendingStrip();
  }
}

function findGameAnywhere(id){
  for(const t of ALL_TABS){
    const list = DATA[TAB_GROUP[t.id]][t.id];
    if(Array.isArray(list)){
      const found = list.find(x => x.id === id);
      if(found) return found;
    } else if(list && list.mirror){
      const found = list.mirror.find(x => x.id === id) || (list.seriesLeftovers||[]).find(x => x.id === id);
      if(found) return found;
    }
  }
  return null;
}
function openPendingModal(){
  const ops = [...pendingOps.values()];
  if(!ops.length){ toast('No pending changes', 'bad'); return; }
  const rows = ops.map(op => {
    const tabInfo = ALL_TABS.find(t => t.id === op.tabId);
    const tabLabel = tabInfo ? tabInfo.label : (op.tabId || '?');
    let name = '';
    let action = '';
    let actionClass = 'pr-action-upsert';
    let key = '';
    if(op.action === 'asset'){
      name = op.path.split('/').pop() || op.path;
      action = 'Asset';
      actionClass = 'pr-action-asset';
      key = 'asset:' + op.path;
    } else if(op.action === 'delete'){
      const cur = findGameAnywhere(op.id);
      name = (op.name || (cur && cur.name)) || op.id;
      action = 'Delete';
      actionClass = 'pr-action-delete';
      key = op.tabId + ':' + op.id;
    } else {
      name = op.game ? op.game.name : op.id;
      action = op.original ? 'Edit' : 'Add';
      key = op.tabId + ':' + op.id;
    }
    return `<div class="pending-row" data-key="${key}">
      <span class="pr-tab">${tabLabel}</span>
      <span class="pr-action ${actionClass}">${action}</span>
      <span class="pr-name" title="${String(name).replace(/"/g,'&quot;')}">${name}</span>
      <button type="button" class="pr-discard" title="Discard this change">✕</button>
    </div>`;
  }).join('');
  pendingSlot.innerHTML = `
    <div class="pending-modal">
      <button class="modal-close" data-close>✕</button>
      <h2>Pending changes (${ops.length})</h2>
      <p class="sub">These will be committed to GitHub in a single atomic commit.</p>
      <div class="pending-list">${rows}</div>
      <div class="token-actions">
        <button type="button" class="btn" data-close>Close</button>
        <button type="button" class="btn danger" id="pm-discard-all">Discard all</button>
        <button type="button" class="btn primary" id="pm-commit">Commit</button>
      </div>
    </div>`;
  pendingBackdrop.classList.add('open');
  pendingSlot.querySelectorAll('[data-close]').forEach(el => el.onclick = closePendingModal);
  pendingSlot.querySelectorAll('.pr-discard').forEach(btn => btn.onclick = () => {
    const key = btn.closest('.pending-row').dataset.key;
    const op = pendingOps.get(key);
    pendingOps.delete(key);
    if(op && op.action === 'asset') stagedAssetUrls.delete(op.path);
    updatePendingStrip();
    refreshCurrentTab();
    if(pendingOps.size === 0) closePendingModal();
    else openPendingModal();
  });
  pendingSlot.querySelector('#pm-discard-all').onclick = () => {
    if(!confirm('Discard all pending changes?')) return;
    pendingOps.clear();
    stagedAssetUrls.clear();
    updatePendingStrip();
    closePendingModal();
    refreshCurrentTab();
    toast('Discarded all');
  };
  pendingSlot.querySelector('#pm-commit').onclick = () => {
    closePendingModal();
    commitPending();
  };
}

  pendingBackdrop.classList.remove('open');
  pendingSlot.innerHTML = '';
}

async function igdbSearch(name){

}
function igdbFmtDate(unixSec){
  if(!unixSec) return '';
  const d = new Date(unixSec * 1000);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return dd + '.' + mm + '.' + d.getFullYear();
}
function igdbImg(url, size){
  if(!url) return '';
  return url.replace(/^\/\//,'https://').replace(/\/t_[a-z0-9_]+\//, '/' + size + '/');
}
function igdbMapToFields(hit){
  const out = {};
  if(hit.name) out.name = hit.name;
  if(hit.first_release_date) out.release = igdbFmtDate(hit.first_release_date);
  const devs = [], pubs = [];
  (hit.involved_companies || []).forEach(ic => {
    const nm = ic.company && ic.company.name;
    if(!nm) return;
    if(ic.developer) devs.push(nm);
    if(ic.publisher) pubs.push(nm);
  });
  if(devs.length) out.dev = devs.join(', ');
  if(pubs.length) out.pub = pubs.join(', ');
  if(hit.screenshots && hit.screenshots.length) out.screenshot = igdbImg(hit.screenshots[0].url, 't_1080p');
  if(hit.summary) out.notes = hit.summary;
  if(hit.platforms && hit.platforms.length) out.platform = hit.platforms.slice(0,4).map(p => p.name).join(', ');
  return out;
}
function igdbPlatformString(hit){ return (hit.platforms || []).map(p => p.name).join(', '); }
function igdbReleaseYear(hit){
  if(!hit.first_release_date) return '';
  return String(new Date(hit.first_release_date * 1000).getFullYear());
}

function steamFmtDate(str){

function steamMapToFields(data){

function hltbMapToFields(d){
  if(!d) return {};
  const story = d.story != null ? Math.max(1, Math.round(d.story)) : null;
  const extras = d.extras != null ? Math.max(1, Math.round(d.extras)) : null;

async function pcgwSearch(name){

async function pcgwGetWikitext(pageTitle){
  const target = 'https://www.pcgamingwiki.com/w/api.php'
    + '?action=parse&page=' + encodeURIComponent(pageTitle)
    + '&prop=wikitext&format=json';
  const res = await corsfix.fetch(target);
  if(!res.ok) throw new Error('page HTTP ' + res.status);
  const data = await res.json();
  return (data.parse && data.parse.wikitext && data.parse.wikitext['*']) || '';
}
function pcgwExtractTemplateField(wikitext, field){
  const re = new RegExp('\\{\\{\\s*Infobox game\\/row\\/' + field + '\\s*\\|\\s*([^\\}\\|]+?)\\s*(?:\\||\\}\\})', 'gi');
  const out = []; let m;
  while((m = re.exec(wikitext)) !== null){
    const v = m[1].trim();
    if(v && !out.includes(v)) out.push(v);
  }
  return out;
}
function pcgwExtractDates(wikitext){
  const re = /\{\{\s*Infobox game\/row\/date\s*\|\s*([^\|\}]+?)\s*\|\s*([^\|\}]+?)\s*(?:\||\}\})/gi;
  const out = []; let m;
  while((m = re.exec(wikitext)) !== null){
    const dateStr = m[2].trim();
    const d = new Date(dateStr);
    if(isNaN(d.getTime())) continue;
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    out.push(dd + '.' + mm + '.' + d.getFullYear());
  }
  return out;
}
function pcgwExtractSize(wikitext){
  const re = /\|minHD\s*=\s*([^\|\}\n]+)/gi;
  let m; let best = '';
  while((m = re.exec(wikitext)) !== null){
    const v = m[1].trim();
    if(v && (!best || v.length < best.length)) best = v;
  }
  const sz = best.match(/(\d+(?:[.,]\d+)?)\s*(GB|MB|TB)/i);
  if(!sz) return '';
  let num = parseFloat(sz[1].replace(',', '.'));
  let unit = sz[2].toUpperCase();
  if(unit === 'MB'){ num = num / 1024; unit = 'GB'; }
  num = Math.round(num * 10) / 10;
  return num + ' ' + unit;
}
function pcgwMapToFields(wikitext){
  const out = {};
  const devs = pcgwExtractTemplateField(wikitext, 'developer');
  const pubs = pcgwExtractTemplateField(wikitext, 'publisher');
  if(devs.length) out.dev = devs.join(', ');
  if(pubs.length) out.pub = pubs.join(', ');
  const dates = pcgwExtractDates(wikitext);
  if(dates.length) out.release = dates[0];
  const size = pcgwExtractSize(wikitext);
  if(size) out.size = size;
  return out;
}

   LBDB
   ============================================================ */
let LBDB_INDEX = null;
let LBDB_LOADING = null;

function lbdbFmtDate(str){
  if(!str) return '';
  const s = String(str);
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[3] + '.' + m[2] + '.' + m[1];
  return s;
}
async function lbdbEnsure(){
  if(LBDB_INDEX) return LBDB_INDEX;
  if(LBDB_LOADING) return LBDB_LOADING;
  LBDB_LOADING = (async () => {
    const res = await fetch(LBDB_FILE);
    if(!res.ok) throw new Error('LBDB file missing (' + res.status + ')');
    const data = await res.json();
    const games = data.games || (Array.isArray(data) ? data : []);
    const map = new Map();
    for(const g of games){
      const n = g.n || g.name;
      if(!n) continue;
      const key = normKey(n);
      if(!key) continue;
      if(!map.has(key)) map.set(key, []);
      map.get(key).push(g);
    }
    LBDB_INDEX = { map, raw: games, count: games.length };
    return LBDB_INDEX;
  })();
  try { return await LBDB_LOADING; }
  catch(e){ LBDB_LOADING = null; throw e; }
}
async function lbdbLookup(name){
  const idx = await lbdbEnsure();
  const key = normKey(name);
  if(!key) return [];
  return idx.map.get(key) || [];
}
function lbdbMapToFields(entry){
  const out = {};
  if(entry.n) out.name = entry.n;
  if(entry.p) out.platform = entry.p;
  if(entry.dev) out.dev = entry.dev;
  if(entry.pub) out.pub = entry.pub;
  if(entry.rel) out.release = lbdbFmtDate(entry.rel);
  if(entry.logo) out.logo = 'https://images.launchbox-app.com/' + entry.logo;
  if(entry.screenshot) out.screenshot = 'https://images.launchbox-app.com/' + entry.screenshot;
  return out;
}

/* ============================================================
   SCORING
   ============================================================ */
function scoreCandidate(cName, cPlatform, cRelease, fName, fPlatform, fRelease){
  let score = levSimilarity(cName || '', fName || '');
  if(fPlatform && String(fPlatform).trim()){
    const cp = String(cPlatform || '').toLowerCase().trim();
    const fp = String(fPlatform).toLowerCase().trim();
    if(cp){
      if(cp === fp || cp.includes(fp) || fp.includes(cp)) score += 0.4;
      else score -= 0.3;
    }
  }
  if(fRelease && String(fRelease).trim() && cRelease){
    const fy = String(fRelease).match(/\d{4}/);
    const cy = String(cRelease).match(/\d{4}/);
    if(fy && cy){
      const diff = Math.abs(+fy[0] - +cy[0]);
      if(diff === 0) score += 0.15;
      else if(diff <= 1) score += 0.05;
      else if(diff >= 3) score -= 0.1;
    }
  }
  return score;
}

/* ============================================================
   GITHUB MEDIA — STAGED ASSET UPLOAD
   ============================================================ */
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      const idx = result.indexOf(',');
      resolve(result.slice(idx + 1));
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function stageAssetToRepo(file, gameId, kind){
  if(!getToken()) throw new Error('Not signed in');
  const ext = (file.name.split('.').pop() || 'png').toLowerCase();
  const path = 'images/' + kind + 's/' + gameId + '.' + ext;
  const b64 = await fileToBase64(file);
  const dataUrl = 'data:image/' + (ext === 'jpg' ? 'jpeg' : ext) + ';base64,' + b64;
  stagedAssetUrls.set(path, dataUrl);
  pendingOps.set('asset:' + path, {
    action: 'asset',
    path,
    content: b64,
    kind,
    gameId
  });
  return path;
}

/* ============================================================
   TAB PANES — persistent per-tab containers
   ============================================================ */
const TAB_PANES = new Map();

function getPane(tabId){
  if(!TAB_PANES.has(tabId)){
    const el = document.createElement('section');
    el.className = 'tab-pane';
    el.dataset.tab = tabId;
    contentEl.appendChild(el);
    TAB_PANES.set(tabId, { el, signature: null });
  }
  return TAB_PANES.get(tabId);
}

function paneSignature(){
  return [
    adminMode ? 'A' : '-',
    pendingOps.size,
    sortKey,
    sortDir,
    filterKey,
    searchTerm,
  ].join('|');
}

function invalidateAllPanes(){
  TAB_PANES.forEach(p => { p.signature = null; });
}

function buildPaneInner(pane){
  const list = currentTabData();
  const file = TAB_FILES[tab];

  if(tab === 'backlog'){
    const data = list || { mirror: [], seriesLeftovers: [] };
    const mirror = applySort((data.mirror||[]).filter(passesAll));
    const series = filterKey === 'all' ? (data.seriesLeftovers||[]) : [];
    if(!data.mirror.length && !data.seriesLeftovers.length){
      pane.el.innerHTML = emptyHTML(file);
      return;
    }
    pane.el.innerHTML = `
      ${sectionHeader('Backloggd', { target:'sec-series', label:'To series', dir:'down' })}
      <div class="grid">${mirror.length ? mirror.map(cardHTML).join('') : ''}</div>
      ${!mirror.length ? `<div class="grid-empty">No games match</div>` : ''}
      ${sectionHeader('Series', { target:'sec-backloggd', label:'To main list', dir:'up' })}
      <div class="grid">${series.length ? series.map(cardHTML).join('') : ''}</div>
      ${!series.length ? `<div class="grid-empty">Hidden by current filter</div>` : ''}`;
    return;
  }

  if(tab === 'backlog-series'){
    const data = list || { series: [] };
    if(!data.series.length){
      pane.el.innerHTML = emptyHTML(file);
      return;
    }
    seriesGameIndex.clear();
    pane.el.innerHTML = `<div class="series-blocks">${data.series.map(seriesBlockHTML).join('')}</div>`;
    return;
  }

  const arr = Array.isArray(list) ? list : [];
  const filtered = applySort(arr.filter(passesAll));
  if(!arr.length){
    pane.el.innerHTML = emptyHTML(file);
    return;
  }

  if(BEATEN_TABS.has(tab)){
    currentRankMap = buildRankMap(arr);
    pane.el.innerHTML = filtered.length
      ? `<div class="beaten-list">${filtered.map(g => beatenRowHTML(g, currentRankMap.get(g.id))).join('')}</div>`
      : `<div class="grid-empty">No games match</div>`;
    return;
  }

  pane.el.innerHTML = filtered.length
    ? `<div class="grid">${filtered.map(cardHTML).join('')}</div>`
    : `<div class="grid-empty">No games match</div>`;
}

function markLoadedImages(root){
  root.querySelectorAll('img').forEach(img => {
    if(img.complete) img.classList.add('img-loaded');
  });
}

/* ============================================================
   RENDER — CONTENT
   ============================================================ */
function renderContent(){
  const pane = getPane(tab);

  TAB_PANES.forEach((p, id) => {
    if(id !== tab) p.el.classList.remove('active');
  });
  pane.el.classList.add('active');

  const state = LOAD_STATE[group][tab];

  if(state === 'loading' || state === 'idle'){
    hideToolbar();
    pane.el.innerHTML = loadingHTML();
    pane.signature = null;
    if(state === 'idle'){
      loadTabData(group, tab).then(() => {
        if(LOAD_STATE[group][tab] !== 'loading') renderContent();
      });
    }
    return;
  }

  if(tab === 'backlog-series') hideToolbar();
  else renderToolbar();

  const sig = paneSignature();
  if(pane.signature === sig){
    applyTooltips();
    return;
  }

  buildPaneInner(pane);
  pane.signature = sig;
  markLoadedImages(pane.el);
  applyTooltips();
}

function refreshGrid(){
  const pane = getPane(tab);
  buildPaneInner(pane);
  pane.signature = paneSignature();
  markLoadedImages(pane.el);
  applyTooltips();
}

/* ============================================================

   ============================================================ */
function hltbToParts(str){
  if(!str || str === '—') return { main:'', extra:'' };
  const s = String(str);
  const mm = s.match(/Main:\s*([\d.]+)/i);
  const me = s.match(/\+Extra:\s*([\d.]+)/i);
  if(mm) return { main: mm[1] || '', extra: me ? me[1] : '' };
  return { main: s, extra: '' };
}
function partsToHltb(main, extra){
  main = String(main||'').trim();
  extra = String(extra||'').trim();
  if(!main) return '—';
  if(/^\d/.test(main) && extra && /^\d/.test(extra)) return `Main: ${main}, +Extra: ${extra}`;
  if(/^\d/.test(main)) return `Main: ${main}`;
  return main;
}
function hltbIsNumeric(str){ return !str || str === '—' || /^\d/.test(String(str).replace(/^Main:\s*/i,'')); }
function linkIconGuess(label){
  const l = String(label||'').toLowerCase();
  if(l.includes('steam')) return 'steam';
  if(l.includes('pcgw') || l.includes('pcgamingwiki')) return 'pcgw';
  if(l.includes('nexus')) return 'nexus';
  return '';
}

    dev:'#f-dev', pub:'#f-pub', screenshot:'#f-screenshot', logo:'#f-logo',
  };
  for(const [field, sel] of Object.entries(fieldMap)){
    const input = modalSlot.querySelector(sel);
    if(!input) continue;
    const pillsHost = modalSlot.querySelector(`.pills[data-field="${field}"]`);
    if(!pillsHost) continue;
    const pills = [];
    for(const src of PARSE_SOURCES){
      const r = results[src];

          pills.push(`<button type="button" class="pill src-sgdb picker" data-field="logo" data-picker="sgdb"><span class="p-src">sgdb</span>${r.logos.length} logos</button>`);

  };
  const locked = modalSlot._lockedSources || new Set();
  const prevResults = modalSlot._parseResults || {};
  PARSE_SOURCES.forEach(s => { if(!locked.has(s)) setSrcDot(dots[s], 'loading'); });
  goBtn.disabled = true; goBtn.classList.add('loading');
  goBtn.textContent = 'Working';
  const results = { igdb:null, steam:null, pcgw:null, lbdb:null, hltb:null, sgdb:null };
  locked.forEach(s => { results[s] = prevResults[s] || { fields:{} }; });
  const igdbTask = (async () => {
    if(locked.has('igdb')) return;
    try{
      const hits = await igdbSearch(name);
      if(!hits || !hits.length){
        results.igdb = { fields:{} };
        setSrcDot(dots.igdb, 'notfound');
        return;
      }
      let best = hits[0], bestScore = -Infinity;
      for(const h of hits){
        const s = scoreCandidate(h.name, igdbPlatformString(h), igdbReleaseYear(h), name, formPlatform, formRelease);
        if(s > bestScore){ bestScore = s; best = h; }
      }
      const nameOnly = levSimilarity(best.name || '', name);
      if(nameOnly < 0.95 && hits.length > 1){
        const picked = await new Promise(resolve => showIgdbPicker(hits, hit => resolve(hit)));
        if(picked) best = picked;
      }
      results.igdb = { fields: igdbMapToFields(best) };
      setSrcDot(dots.igdb, 'found');
    }catch(e){
      console.error('IGDB parse failed:', e);
      results.igdb = { error: e.message };
      setSrcDot(dots.igdb, 'error');
    }
  })();
  const steamTask = (async () => {
    if(locked.has('steam')) return;
    try{
      const data = await steamSearch(name);
      results.steam = { fields: steamMapToFields(data), storeUrl: data.storeUrl || '' };
      setSrcDot(dots.steam, 'found');
    }catch(e){
      console.error('Steam parse failed:', e);
      results.steam = { error: e.message };
      setSrcDot(dots.steam, 'error');
    }
  })();
  const pcgwTask = (async () => {
    if(locked.has('pcgw')) return;
    try{
      const hits = await pcgwSearch(name);
      if(!hits || !hits.length){
        results.pcgw = { fields:{} };
        setSrcDot(dots.pcgw, 'notfound');
        return;
      }
      let best = hits[0], bestScore = -Infinity;
      for(const h of hits){
        const s = scoreCandidate(h.title, '', '', name, formPlatform, formRelease);
        if(s > bestScore){ bestScore = s; best = h; }
      }
      const wt = await pcgwGetWikitext(best.title);
      results.pcgw = { fields: pcgwMapToFields(wt), page: best.title };
      setSrcDot(dots.pcgw, 'found');
    }catch(e){
      console.error('PCGW parse failed:', e);
      results.pcgw = { error: e.message };
      setSrcDot(dots.pcgw, 'error');
    }
  })();
  const lbdbTask = (async () => {
    if(locked.has('lbdb')) return;
    try{
      const entries = await lbdbLookup(name);
      if(!entries || !entries.length){
        results.lbdb = { fields:{} };
        setSrcDot(dots.lbdb, 'notfound');
        return;
      }
      let best = entries[0], bestScore = -Infinity;
      for(const e of entries){
        const s = scoreCandidate(e.n || e.name, e.p || '', e.rel || '', name, formPlatform, formRelease);
        if(s > bestScore){ bestScore = s; best = e; }
      }
      results.lbdb = { fields: lbdbMapToFields(best), entries: entries };
      setSrcDot(dots.lbdb, 'found');
    }catch(e){
      console.error('LBDB parse failed:', e);
      results.lbdb = { error: e.message };
      setSrcDot(dots.lbdb, 'error');
    }
  })();
  const hltbTask = (async () => {
    if(locked.has('hltb')) return;
    try{
      const data = await hltbSearch(name);
      const fields = hltbMapToFields(data);
      if(!fields.hltb){
        results.hltb = { fields:{} };
        setSrcDot(dots.hltb, 'notfound');
        return;
      }
      results.hltb = { fields };
      setSrcDot(dots.hltb, 'found');
    }catch(e){
      console.error('HLTB parse failed:', e);
      results.hltb = { error: e.message };
      setSrcDot(dots.hltb, 'error');
    }
  })();
  const sgdbTask = (async () => {
    if(locked.has('sgdb')) return;
    try{
      const data = await sgdbSearch(name);
      if(!data.logos || !data.logos.length){
        results.sgdb = { fields:{} };
        setSrcDot(dots.sgdb, 'notfound');
        return;
      }
      results.sgdb = { fields:{}, logos: data.logos, gameName: data.gameName };
      setSrcDot(dots.sgdb, 'found');
    }catch(e){
      console.error('SGDB parse failed:', e);
      results.sgdb = { error: e.message };
      setSrcDot(dots.sgdb, 'error');
    }
  })();
  await Promise.all([igdbTask, steamTask, pcgwTask, lbdbTask, hltbTask, sgdbTask]);
  renderVariantPills(results);
  autoAddKeyLinks(results);
  goBtn.disabled = false; goBtn.classList.remove('loading');
  goBtn.textContent = 'GO';
  const found = PARSE_SOURCES.filter(s => dots[s]?.classList.contains('found'));
  if(found.length === 0) toast('No matches from any source', 'bad');
  else toast('Found on: ' + found.join(', '));
}

   MOVE PICKER
   ============================================================ */
async function findGameEverywhere(id){
  await forceLoadAll();
  const found = [];
  for(const t of ALL_TABS){
    const g = TAB_GROUP[t.id];
    const list = DATA[g][t.id];
    if(Array.isArray(list)){
      if(list.find(x => x.id === id)) found.push(t.id);
    } else if(list && list.mirror){
      if(list.mirror.find(x => x.id === id) || (list.seriesLeftovers||[]).find(x => x.id === id)){
        found.push(t.id);
      }
    }
  }
  return found;
}
async function openMovePicker(game, ctxTab){
  moveSlot.innerHTML = `
    <div class="move-modal">
      <button class="modal-close" data-close>✕</button>
      <h2>Move game</h2>
      <p class="sub">Check every tab where <strong>${game.name}</strong> should live. Unchecked tabs will have it removed.</p>
      <div class="move-groups"><div style="padding:1.5rem;text-align:center;color:var(--muted);font-family:var(--font-head);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase">Loading…</div></div>
      <div class="token-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="button" class="btn primary" id="move-apply" disabled>Apply</button>
      </div>
    </div>`;
  moveBackdrop.classList.add('open');
  moveSlot.querySelectorAll('[data-close]').forEach(el => el.onclick = () => {
    moveBackdrop.classList.remove('open'); moveSlot.innerHTML = '';
  });

  let existing = [];
  try{
    existing = await findGameEverywhere(game.id);
  }catch(e){
    console.error('findGameEverywhere failed:', e);
  }
  if(!existing.includes(ctxTab)) existing.push(ctxTab);

  const groupHTML = (grp, label) => `
    <div class="move-group">
      <div class="mg-title">${label}</div>
      ${TABS[grp].map(t => `
        <label class="move-check">
          <input type="checkbox" data-tab="${t.id}" ${existing.includes(t.id) ? 'checked' : ''}>
          <span class="box"></span>
          <span class="label">${t.label}</span>
        </label>
      `).join('')}
    </div>`;
  moveSlot.querySelector('.move-groups').innerHTML = groupHTML('coop','Co-op') + groupHTML('single','Vault');
  moveSlot.querySelector('#move-apply').disabled = false;

  moveSlot.querySelector('#move-apply').onclick = () => {
    const checked = [...moveSlot.querySelectorAll('input[type=checkbox]:checked')].map(i => i.dataset.tab);
    for(const t of ALL_TABS){
      const tabId = t.id;
      const shouldBe = checked.includes(tabId);
      const wasThere = existing.includes(tabId);
      const key = `${tabId}:${game.id}`;
      if(shouldBe){
        if(!wasThere || tabId === ctxTab){
          pendingOps.set(key, {
            tabId, id: game.id, action:'upsert',
            game: { ...stripInternal(game), group: TAB_GROUP[tabId], tab: tabId },
            original: wasThere
          });
        }
      } else if(wasThere){
        pendingOps.set(key, { tabId, id: game.id, action:'delete', name: game.name });
      }
    }
    moveBackdrop.classList.remove('open'); moveSlot.innerHTML = '';
    closeAll();
    invalidateAllPanes();
    updatePendingStrip();
    refreshCurrentTab();
    toast('Staged move — commit when ready');
  };
}
moveBackdrop.addEventListener('click', e => {
  if(e.target === moveBackdrop){ moveBackdrop.classList.remove('open'); moveSlot.innerHTML = ''; }
});

      const path = await saveImageLocally(kind, gameId, url);
      $(fieldSel).value = path;
      $(fieldSel).dispatchEvent(new Event('input', { bubbles: true }));
      toast('Saved → ' + path);
    }catch(err){
      console.error('saveLocally failed:', err);
      toast('Save failed: ' + err.message, 'bad');
    }finally{
      btn.disabled = false; btn.innerHTML = orig;
    }
  }
  $('#save-screenshot-local')?.addEventListener('click', () => saveLocal('screenshot'));
  $('#save-logo-local')?.addEventListener('click', () => saveLocal('logo'));
  $('#google-screenshot')?.addEventListener('click', () => {
    const nameVal = ($('#f-name').value || '').trim();
    if(!nameVal){ toast('Enter a name first', 'bad'); return; }
    window.open('https://www.google.com/search?q=' + encodeURIComponent(nameVal + ' gameplay screenshot'), '_blank', 'noopener');
  });
  $('#sgdb-logo')?.addEventListener('click', async () => {
    const nameVal = ($('#f-name').value || '').trim();
    if(!nameVal){ toast('Enter a name first', 'bad'); return; }
    const btn = $('#sgdb-logo');
    const orig = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '…Loading';
    try{
      const data = await sgdbSearch(nameVal);
      const items = (data.logos || []).map(l => ({
        url: l.url, thumb: l.thumb || l.url,
        label: (l.style || 'logo') + ' · ' + l.width + '×' + l.height
      }));
      showLogoPicker('SGDB — ' + data.gameName, items, picked => {
        $('#f-logo').value = picked.url;
        $('#f-logo').dispatchEvent(new Event('input', { bubbles: true }));
        toast('SGDB logo selected — click "↓ Save locally" to commit');
      });
    }catch(err){
      console.error('SGDB search failed:', err);
      toast('SGDB: ' + err.message, 'bad');
    }finally{
      btn.disabled = false; btn.innerHTML = orig;
    }
  });
  $('#lbdb-logo')?.addEventListener('click', async () => {
    const nameVal = ($('#f-name').value || '').trim();
    if(!nameVal){ toast('Enter a name first', 'bad'); return; }
    const btn = $('#lbdb-logo');
    const orig = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '…Loading';
    try{
      const entries = await lbdbLookup(nameVal);
      const items = entries.filter(e => e.logo).map(e => ({
        url: 'https://images.launchbox-app.com/' + e.logo,
        thumb: 'https://images.launchbox-app.com/' + e.logo,
        label: (e.p || 'unknown') + (e.rel ? ' · ' + e.rel : '')
      }));
      showLogoPicker('LBDB — ' + nameVal, items, picked => {
        $('#f-logo').value = picked.url;
        $('#f-logo').dispatchEvent(new Event('input', { bubbles: true }));
        toast('LBDB logo selected — click "↓ Save locally" to commit');
      });
    }catch(err){
      console.error('LBDB search failed:', err);
      toast('LBDB: ' + err.message, 'bad');
    }finally{
      btn.disabled = false; btn.innerHTML = orig;
    }
  });
  $('#flag-row').addEventListener('click', e => {
    const btn = e.target.closest('.flag-btn');
    if(!btn) return;
    btn.classList.toggle('on');
  });
  const linksList = $('#links-list');
  $('#add-link-btn').addEventListener('click', () => {
    const row = document.createElement('div');
    row.className = 'link-row';
    row.innerHTML = `<input type="text" class="link-label" placeholder="Label"><input type="text" class="link-url" placeholder="https://…"><button type="button" class="remove-link">✕</button>`;
    linksList.appendChild(row);
    row.querySelector('.link-label').focus();
  });
  linksList.addEventListener('click', e => {
    if(!e.target.closest('.remove-link')) return;
    e.target.closest('.link-row').remove();
  });
  $('#parse-go').addEventListener('click', runParse);
  attachPillHandlers();

  if(!isNew){
    $('#delete-btn').addEventListener('click', () => openConfirmDelete(g));
    $('#move-btn').addEventListener('click', () => {
      g._group = editGroup; g._tab = editTab;
      openMovePicker(g, editTab);
    });
  }

  $('#save-btn').addEventListener('click', () => {
    const name = $('#f-name').value.trim();
    if(!name){ toast('Name is required', 'bad'); return; }
    const fgroup = $('#f-group input:checked').value;
    const ftab = $('#f-tab').value;
    const hltbType = $('#f-hltb-type input:checked').value;
    const hltb = hltbType === 'numeric'
      ? partsToHltb($('#f-hltb-main').value, $('#f-hltb-extra').value)
      : ($('#f-hltb-raw').value.trim() || '—');
    const links = [...linksList.querySelectorAll('.link-row')].map(row => {
      const label = row.querySelector('.link-label').value.trim();
      const url   = row.querySelector('.link-url').value.trim();
      if(!label && !url) return null;
      const obj = { label: label || 'Link', url };
      const guess = linkIconGuess(label);
      if(guess) obj.icon = guess;
      return obj;
    }).filter(Boolean);
    const extraTags = [...$('#cross-tags').querySelectorAll('input[type=checkbox]:checked')]
      .map(cb => cb.dataset.tag).filter(t => t !== ftab);

    const out = {
      id: draft.id || name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),
      name,
      platform: $('#f-platform').value.trim(),
      release: $('#f-release').value.trim(),
      size: $('#f-size').value.trim(),
      hltb,
      dev: $('#f-dev').value.trim(),
      pub: $('#f-pub').value.trim(),
      notes: $('#f-notes').value.trim(),
      installed:    $('#flag-row [data-flag="installed"]').classList.contains('on'),
      localCoop:    $('#flag-row [data-flag="localCoop"]').classList.contains('on'),
      authRequired: $('#flag-row [data-flag="authRequired"]').classList.contains('on'),
      ownedSteam:   $('#flag-row [data-flag="ownedSteam"]').classList.contains('on'),
      gamepass:     $('#flag-row [data-flag="gamepass"]').classList.contains('on'),
      links, extraTags,
      screenshot: $('#f-screenshot').value.trim(),
      logo: $('#f-logo').value.trim(),
    };

    const key = `${ftab}:${out.id}`;
    const originalTab = !isNew ? editTab : null;

    if(!isNew && originalTab && originalTab !== ftab){
      pendingOps.set(`${originalTab}:${out.id}`, { tabId: originalTab, id: out.id, action:'delete', name: out.name });
      pendingOps.set(key, { tabId: ftab, id: out.id, action:'upsert', game: out, original: true });
    } else {
      pendingOps.set(key, { tabId: ftab, id: out.id, action:'upsert', game: out, original: !isNew });
    }

    closeAll();
    invalidateAllPanes();
    updatePendingStrip();
    refreshCurrentTab();
    toast(isNew ? 'Staged new game' : 'Staged changes');
  });
}
function openConfirmDelete(g){
  modalSlot.innerHTML = `
    <div class="confirm">
      <h3><span class="icon icon-trash" style="width:1em;height:1em"></span>Delete game?</h3>
      <p>You're about to remove <span class="gname">${g.name}</span> from <strong>${tabLabelFor(g)}</strong>.</p>
      <p class="warn">This stages the removal. Nothing is committed to GitHub until you press Commit.</p>
      <div class="btns">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="button" class="btn danger" id="confirm-delete"><span class="icon icon-trash"></span>Stage delete</button>
      </div>
    </div>`;
  backdrop.classList.add('open');
  modalSlot.querySelector('#confirm-delete').addEventListener('click', () => {
    const gTab = g._tab || tab;
    pendingOps.set(`${gTab}:${g.id}`, { tabId: gTab, id: g.id, action:'delete', name: g.name });
    closeAll();
    invalidateAllPanes();
    updatePendingStrip();
    refreshCurrentTab();
    toast('Staged delete');
  });
}
function tabLabelFor(g){
  const tb = g._tab || tab;
  const t = ALL_TABS.find(x => x.id === tb);
  return t ? t.label : tb;
}
function closeAll(){
  backdrop.classList.remove('open');
  modalSlot.innerHTML = '';
  modalSlot._pillsBound = false;
  modalSlot._parseResults = null;
  modalSlot._lockedSources = null;
  pickerBackdrop.classList.remove('open'); pickerSlot.innerHTML = '';
  logopickerBackdrop.classList.remove('open'); logopickerSlot.innerHTML = '';
  moveBackdrop.classList.remove('open'); moveSlot.innerHTML = '';
  closeAllDropdowns();
}
modalSlot.addEventListener('click', e => { if(e.target.closest('[data-close]')) closeAll(); });

contentEl.addEventListener('click', e => {
  const adminBtnEl = e.target.closest('.card-admin button');
  if(adminBtnEl){
    e.stopPropagation();
    const g = findGameById(adminBtnEl.dataset.id);
    if(!g) return;
    if(g.source === 'series'){
      toast('Series entries are edited in the JSON directly', 'bad');
      return;
    }
    g._group = group; g._tab = tab;
    if(adminBtnEl.dataset.act === 'edit') openEditor(g);
    else if(adminBtnEl.dataset.act === 'del') openConfirmDelete(g);
    return;
  }
  const jb = e.target.closest('.jump-btn');
  if(jb){
    const t = document.getElementById(jb.dataset.jump);
    if(t) t.scrollIntoView({ behavior:'smooth', block:'start' });
    return;
  }
  const sr = e.target.closest('.series-game-row');
  if(sr){
    const sg = seriesGameIndex.get(sr.dataset.rowId);
    if(sg) openSeriesModal(sg);
    return;
  }
  const rowD = e.target.closest('.rowD');
  if(rowD){
    const arr = currentTabData();
    if(Array.isArray(arr)){
      const g = arr.find(x => x.id === rowD.dataset.id);
      if(g){
        currentRankMap = buildRankMap(arr);
        openModal(g);
      }
    }
    return;
  }
  const card = e.target.closest('.card');
  if(card){
    const g = findGameById(card.dataset.id);
    if(!g) return;
    if(g.source === 'series'){
      openSeriesModal({ ...g, seriesName: g.series, note: g.notes || '' });
    } else {
      openModal(g);
    }
  }
});

/* ============================================================
   BOOT
   ============================================================ */
pendingStrip.addEventListener('click', e => {
  if(e.target.closest('.btns')) return;
  if(!pendingOps.size) return;
  openPendingModal();
});

(function restoreLastTab(){
  try{
    const saved = JSON.parse(localStorage.getItem('view_last_tab') || 'null');
    if(saved && saved.group && saved.tab
       && TABS[saved.group]
       && TABS[saved.group].some(t => t.id === saved.tab)){
      group = saved.group;
      tab = saved.tab;
    }
  }catch(e){}
  switchEl.dataset.active = group;
  bodyEl.dataset.group = group;
  applySortForTab(tab);
})();

applyView();
renderTabs();
renderContent();
updatePendingStrip();
bootAdminFlow();
</script>
</body>
</html>
