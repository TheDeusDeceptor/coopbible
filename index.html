    if(!wasOn){
      btn.classList.add('on');
      if(btn.dataset.status === 'rerun') btn.classList.add('rerun');
      if(btn.dataset.status === 'optional') btn.classList.add('optional');
    }
  });
  const linksList = $('#links-list');
  $('#add-link-btn').addEventListener('click', () => {
    const row = document.createElement('div');
    row.className = 'link-row';
    row.innerHTML = `<input type="text" class="link-label"><input type="text" class="link-url"><button type="button" class="remove-link">✕</button>`;
    linksList.appendChild(row);
    row.querySelector('.link-label').focus();
  });
  linksList.addEventListener('click', e => {
    if(!e.target.closest('.remove-link')) return;
    e.target.closest('.link-row').remove();
  });

  const dlcList = $('#dlc-editor-list');
  function bindDlcRow(row){
    row.querySelector('.dlc-played-toggle').addEventListener('click', function(){
      this.classList.toggle('on');
    });
    row.querySelector('.dlc-remove').addEventListener('click', () => row.remove());
  }
  [...dlcList.querySelectorAll('.dlc-editor-row')].forEach(bindDlcRow);
  $('#add-dlc-btn').addEventListener('click', () => {
    const row = document.createElement('div');
    row.className = 'dlc-editor-row';
    row.innerHTML = `
      <div class="dlc-editor-line1">
        <input type="text" class="dlc-name" placeholder="DLC name">
        <input type="text" class="dlc-release" placeholder="Release">
        <button type="button" class="dlc-played-toggle" title="Toggle played">✓</button>
        <button type="button" class="dlc-remove" title="Remove">✕</button>
      </div>`;
    dlcList.appendChild(row);
    bindDlcRow(row);
    row.querySelector('.dlc-name').focus();
  });

  $('#parse-go').addEventListener('click', runParse);
  attachPillHandlers();
  if(!isNew) $('#delete-btn').addEventListener('click', () => openConfirmDelete(g));

  $('#reset-editor-btn').addEventListener('click', () => {
    if(!confirm('Reset the form? Any unsaved edits in this editor will be cleared.')) return;
    editorDrafts.delete(modalSlot._editorKey);
    const base = modalSlot._editorBase;
    const eopts = modalSlot._editorOpts || {};
    openEditor(base, eopts);
    const f = modalSlot.querySelector('#f-series');
    if(f && eopts.presetSeries) f.value = eopts.presetSeries;
  });

  $('#save-btn').addEventListener('click', () => {
    const mode2 = modalSlot._mode;
    const isAttach = isNew && modalSlot._attachId;

    const name = nameInput.value.trim();
    if(!name){ toast('Name is required', 'bad'); return; }

    const id = (idInput.value || '').trim();
    if(!id){ toast('ID is required', 'bad'); return; }
    if(!/^[a-z0-9\-]+$/.test(id)){ toast('ID must be lowercase letters, digits, hyphens', 'bad'); return; }

    if(mode2 === 'add' && !isAttach){
      const exists = MANIFEST.games[id] || pendingGameWrites.has(id);
      if(exists){
        toast('ID already exists — pick it above or change the ID', 'bad');
        return;
      }
    }

    const checkedLists = new Set(
      [...listGrid.querySelectorAll('input[type=checkbox]')]
        .filter(cb => cb.checked)
        .map(cb => cb.dataset.list)
    );
    if(checkedLists.size === 0){ toast('Pick at least one list', 'bad'); return; }

    const releaseVal = releaseInput.value.trim();
    const eaVal      = eaInput.value.trim();

    const hltbType = $('#f-hltb-type input:checked').value;
    const hltb = hltbType === 'numeric'
      ? partsToHltb($('#f-hltb-main').value, $('#f-hltb-extra').value)
      : ($('#f-hltb-raw').value.trim() || '—');

    const links = [...linksList.querySelectorAll('.link-row')].map(row => {
      const label = row.querySelector('.link-label').value.trim();
      const url   = row.querySelector('.link-url').value.trim();
      if(!label && !url) return null;
      const obj = { label: label || 'Link', url };
      const guess = linkIconGuess(label);
      if(guess) obj.icon = guess;
      return obj;
    }).filter(Boolean);

    const altNames = ($('#f-alt').value || '').split(',').map(s => s.trim()).filter(Boolean);
    const dlcEntries = readDlcFromEditor();
    const platform = platformInput.value.trim();

    if(mode2 === 'add' && isAttach){
      const existingId = modalSlot._attachId;
      const base = MANIFEST.games[existingId] || viewGame(existingId);
      if(!base){ toast('Original game not found', 'bad'); return; }
      const merged = JSON.parse(JSON.stringify(base));
      merged.name = name;
      merged.alt_names = altNames;
      merged.platform = platform;
      merged.release = releaseVal;
      merged.ea_release = eaVal;
      merged.size = $('#f-size').value.trim();
      merged.hltb = hltb;
      merged.dev = $('#f-dev').value.trim();
      merged.pub = $('#f-pub').value.trim();
      merged.notes = $('#f-notes').value.trim();
      merged.screenshot = $('#f-screenshot').value.trim();
      merged.logo = $('#f-logo').value.trim();
      merged.links = links;
      merged.dlc = dlcEntries;
      merged.flags = {
        installed:    $('#flag-row [data-flag="installed"]').classList.contains('on'),
        localCoop:    $('#flag-row [data-flag="localCoop"]').classList.contains('on'),
        authRequired: $('#flag-row [data-flag="authRequired"]').classList.contains('on'),
        ownedSteam:   $('#flag-row [data-flag="ownedSteam"]').classList.contains('on'),
        gamepass:     $('#flag-row [data-flag="gamepass"]').classList.contains('on'),
      };
      merged.series = $('#f-series').value.trim() || null;
      const sOn = statusRow.querySelector('.status-btn.on');
      merged.series_status = sOn && sOn.dataset.status ? sOn.dataset.status : null;
      merged.series_note = $('#f-series-note').value.trim() || null;
      const before = JSON.stringify(base);
      const after = JSON.stringify(merged);
      if(before !== after){ pendingGameWrites.set(existingId, merged); }
      for(const listId of checkedLists){
        const list = (pendingListWrites.get(listId) || MANIFEST.lists[listId] || []).slice();
        if(!list.includes(existingId)) list.push(existingId);
        pendingListWrites.set(listId, list);
      }
      editorDrafts.delete(modalSlot._editorKey);
      closeAll({ skipSnapshot: true });
      invalidateAllPanes();
      updatePendingStrip();
      renderContent();
      toast('Added to list' + (before !== after ? ' + saved edits' : ''));
      return;
    }

    const oldId = draft.id || '';
    const out = JSON.parse(JSON.stringify(draft));
    Object.assign(out, {
      id,
      name,
      platform,
      release: releaseVal,
      ea_release: eaVal,
      size: $('#f-size').value.trim(),
      hltb,
      dev: $('#f-dev').value.trim(),
      pub: $('#f-pub').value.trim(),
      notes: $('#f-notes').value.trim(),
      screenshot: $('#f-screenshot').value.trim(),
      logo: $('#f-logo').value.trim(),
      alt_names: altNames,
      links,
      dlc: dlcEntries,
      flags: {
        installed:    $('#flag-row [data-flag="installed"]').classList.contains('on'),
        localCoop:    $('#flag-row [data-flag="localCoop"]').classList.contains('on'),
        authRequired: $('#flag-row [data-flag="authRequired"]').classList.contains('on'),
        ownedSteam:   $('#flag-row [data-flag="ownedSteam"]').classList.contains('on'),
        gamepass:     $('#flag-row [data-flag="gamepass"]').classList.contains('on'),
      },
      series:        $('#f-series').value.trim() || null,
      series_status: (statusRow.querySelector('.status-btn.on')?.dataset.status) || null,
      series_note:   $('#f-series-note').value.trim() || null,
    });
    delete out.series_owner;

    if(!isNew && oldId && oldId !== id){
      for(const listId of REAL_LISTS){
        const list = (pendingListWrites.get(listId) || MANIFEST.lists[listId] || []).slice();
        const idx = list.indexOf(oldId);
        if(idx >= 0){ list[idx] = id; pendingListWrites.set(listId, list); }
      }
      for(const slug of Object.keys(MANIFEST.series)){
        const s = viewSeries(slug);
        if(!s) continue;
        const order = (s.order || []).slice();
        const idx = order.indexOf(oldId);
        if(idx >= 0){
          order[idx] = id;
          const copy = pendingSeriesWrites.get(slug) || JSON.parse(JSON.stringify(s));
          copy.order = order;
          if(copy.display && copy.display[oldId]){
            copy.display[id] = copy.display[oldId];
            delete copy.display[oldId];
          }
          pendingSeriesWrites.set(slug, copy);
        }
      }
      for(const [slug, s] of pendingSeriesWrites){
        if(s && s.order && s.order.includes(oldId)){
          s.order = s.order.map(x => x === oldId ? id : x);
        }
      }
      pendingGameDeletes.add(oldId);
      pendingGameWrites.delete(oldId);
      for(const [listId, list] of pendingListWrites){
        const filtered = list.filter(x => x !== oldId);
        pendingListWrites.set(listId, filtered);
      }
    }

    pendingGameWrites.set(id, out);

    const checkedListsArray = [...checkedLists];
    if(isNew){
      for(const listId of checkedListsArray){
        const list = (pendingListWrites.get(listId) || MANIFEST.lists[listId] || []).slice();
        if(!list.includes(id)) list.push(id);
        pendingListWrites.set(listId, list);
      }
    } else {
      const before = membershipsOf(id);
      for(const listId of REAL_LISTS){
        const inBefore = before.has(listId);
        const inAfter = checkedLists.has(listId);
        if(inBefore && !inAfter){
          const list = (pendingListWrites.get(listId) || MANIFEST.lists[listId] || []).slice();
          const idx = list.indexOf(id);
          if(idx >= 0){ list.splice(idx, 1); pendingListWrites.set(listId, list); }
        } else if(!inBefore && inAfter){
          const list = (pendingListWrites.get(listId) || MANIFEST.lists[listId] || []).slice();
          if(!list.includes(id)){ list.push(id); pendingListWrites.set(listId, list); }
        }
      }
    }

    const presetSlug = modalSlot._presetSeriesSlug;
    if(presetSlug && isNew){
      const s = viewSeries(presetSlug);
      if(s){
        const copy = pendingSeriesWrites.get(presetSlug) || JSON.parse(JSON.stringify(s));
        copy.order = (copy.order || []).slice();
        if(!copy.order.includes(id)) copy.order.push(id);
        pendingSeriesWrites.set(presetSlug, copy);
      }
    }

    editorDrafts.delete(modalSlot._editorKey);
    closeAll({ skipSnapshot: true });
    invalidateAllPanes();
    updatePendingStrip();
    renderContent();
    toast(isNew ? 'Staged new game' : 'Staged changes');
  });

  const storedDraft = editorDrafts.get(modalSlot._editorKey);
  if(storedDraft){
    idInput.value = storedDraft.id ?? idInput.value;
    nameInput.value = storedDraft.name ?? nameInput.value;
    if($('#f-alt')) $('#f-alt').value = storedDraft.alt ?? '';
    releaseInput.value = storedDraft.release ?? releaseInput.value;
    eaInput.value = storedDraft.eaRelease ?? eaInput.value;
    platformInput.value = storedDraft.platform ?? platformInput.value;
    $('#f-size').value = storedDraft.size ?? '';
    $('#f-dev').value = storedDraft.dev ?? '';
    $('#f-pub').value = storedDraft.pub ?? '';
    $('#f-series').value = storedDraft.series ?? '';
    $('#f-series-note').value = storedDraft.seriesNote ?? '';
    $('#f-screenshot').value = storedDraft.screenshot ?? '';
    $('#f-logo').value = storedDraft.logo ?? '';
    $('#f-notes').value = storedDraft.notes ?? '';
    if(storedDraft.hltbType){
      const r = $('#f-hltb-type').querySelector(`input[value="${storedDraft.hltbType}"]`);
      if(r){ r.checked = true; r.dispatchEvent(new Event('change', { bubbles: true })); }
    }
    $('#f-hltb-main').value = storedDraft.hltbMain ?? '';
    $('#f-hltb-extra').value = storedDraft.hltbExtra ?? '';
    $('#f-hltb-raw').value = storedDraft.hltbRaw ?? '';
    $('#f-screenshot').dispatchEvent(new Event('input', { bubbles: true }));
    $('#f-logo').dispatchEvent(new Event('input', { bubbles: true }));
    if(storedDraft.flags){
      for(const [k, v] of Object.entries(storedDraft.flags)){
        const b = $('#flag-row').querySelector(`.flag-btn[data-flag="${k}"]`);
        if(b) b.classList.toggle('on', v);
      }
    }
    if(storedDraft.status !== undefined){
      statusRow.querySelectorAll('.status-btn').forEach(b => {
        b.classList.remove('on','rerun','optional');
        if((b.dataset.status || '') === storedDraft.status){
          b.classList.add('on');
          if(storedDraft.status === 'rerun') b.classList.add('rerun');
          if(storedDraft.status === 'optional') b.classList.add('optional');
        }
      });
    }
    if(storedDraft.memberships){
      const set = new Set(storedDraft.memberships);
      listGrid.querySelectorAll('input[type=checkbox]').forEach(cb => {
        cb.checked = set.has(cb.dataset.list);
        cb.closest('.list-cb').classList.toggle('on', cb.checked);
      });
    }
    if(storedDraft.links){
      const linksHost = $('#links-list');
      linksHost.innerHTML = storedDraft.links.map((l, i) => `
        <div class="link-row" data-link-idx="${i}">
          <input type="text" class="link-label" value="${esc(l.label||'')}">
          <input type="text" class="link-url" value="${esc(l.url||'')}">
          <button type="button" class="remove-link" title="Remove">✕</button>
        </div>`).join('');
    }
    if(storedDraft.dlc){
      const dlcHost = $('#dlc-editor-list');
      dlcHost.innerHTML = storedDraft.dlc.map((d, i) => dlcEditRowHTML(d, i)).join('');
      [...dlcHost.querySelectorAll('.dlc-editor-row')].forEach(row => {
        row.querySelector('.dlc-played-toggle').addEventListener('click', function(){
          this.classList.toggle('on');
        });
        row.querySelector('.dlc-remove').addEventListener('click', () => row.remove());
      });
    }
    modalSlot._attachId = storedDraft.attachId || null;
    const derivedNow = deriveGameId(nameInput.value, releaseInput.value, eaInput.value, platformInput.value);
    userEditedId = (idInput.value !== derivedNow);
    refreshMatches();
  } else {
    if(isNew) refreshIdDerived();
    refreshMatches();
  }
}

function openConfirmDelete(g){
  editorDrafts.delete(g.id);
  modalSlot._editorKey = null;
  modalSlot.innerHTML = `
    <div class="confirm">
      <h3><span class="icon icon-trash" style="width:1em;height:1em"></span>Delete game?</h3>
      <p>Remove <span class="gname">${esc(g.name)}</span> from the database?</p>
      <p class="warn">Staged. Nothing goes to GitHub until you press Commit. Will also remove from all lists and series.</p>
      <div class="btns">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="button" class="btn danger" id="confirm-delete"><span class="icon icon-trash"></span>Stage delete</button>
      </div>
    </div>`;
  backdrop.classList.add('open');
  modalSlot.querySelector('#confirm-delete').addEventListener('click', () => {
    const id = g.id;
    pendingGameDeletes.add(id);
    pendingGameWrites.delete(id);
    for(const listId of REAL_LISTS){
      const list = (pendingListWrites.get(listId) || MANIFEST.lists[listId] || []).slice();
      const idx = list.indexOf(id);
      if(idx >= 0){ list.splice(idx, 1); pendingListWrites.set(listId, list); }
    }
    for(const slug of Object.keys(MANIFEST.series)){
      const s = viewSeries(slug);
      if(!s) continue;
      if((s.order || []).includes(id)){
        const copy = pendingSeriesWrites.get(slug) || JSON.parse(JSON.stringify(s));
        copy.order = (copy.order || []).filter(x => x !== id);
        pendingSeriesWrites.set(slug, copy);
      }
    }
    closeAll();
    invalidateAllPanes();
    updatePendingStrip();
    renderContent();
    toast('Staged delete');
  });
}

/* DRAFT CAPTURE */
function captureEditorDraft(key){
  const fId = modalSlot.querySelector('#f-id');
  if(!fId) return;
  const $ = sel => modalSlot.querySelector(sel);
  const $$ = sel => modalSlot.querySelectorAll(sel);
  const hltbRadio = $('#f-hltb-type input:checked');
  const sOn = $('#status-row .status-btn.on');
  const flags = {};
  $$('#flag-row .flag-btn').forEach(b => { flags[b.dataset.flag] = b.classList.contains('on'); });
  const memberships = [...$$('#list-grid input[type=checkbox]')]
    .filter(cb => cb.checked).map(cb => cb.dataset.list);
  const links = [...$$('#links-list .link-row')].map(row => ({
    label: row.querySelector('.link-label').value,
    url: row.querySelector('.link-url').value
  }));
  const dlc = [...$$('#dlc-editor-list .dlc-editor-row')].map(row => ({
    name: row.querySelector('.dlc-name').value,
    release: row.querySelector('.dlc-release').value,
    played: row.querySelector('.dlc-played-toggle').classList.contains('on')
  }));
  const snapshot = {
    id: fId.value,
    name: $('#f-name')?.value ?? '',
    alt: $('#f-alt')?.value ?? '',
    release: $('#f-release')?.value ?? '',
    eaRelease: $('#f-ea-release')?.value ?? '',
    platform: $('#f-platform')?.value ?? '',
    size: $('#f-size')?.value ?? '',
    dev: $('#f-dev')?.value ?? '',
    pub: $('#f-pub')?.value ?? '',
    series: $('#f-series')?.value ?? '',
    seriesNote: $('#f-series-note')?.value ?? '',
    screenshot: $('#f-screenshot')?.value ?? '',
    logo: $('#f-logo')?.value ?? '',
    notes: $('#f-notes')?.value ?? '',
    hltbType: hltbRadio ? hltbRadio.value : 'numeric',
    hltbMain: $('#f-hltb-main')?.value ?? '',
    hltbExtra: $('#f-hltb-extra')?.value ?? '',
    hltbRaw: $('#f-hltb-raw')?.value ?? '',
    status: sOn ? (sOn.dataset.status || '') : '',
    flags, memberships, links, dlc,
    attachId: modalSlot._attachId || null,
    presetSeriesSlug: modalSlot._presetSeriesSlug || null
  };
  editorDrafts.set(key, snapshot);
}

function closeAll(opts){
  opts = opts || {};
  if(modalSlot._editorKey && !opts.skipSnapshot){
    captureEditorDraft(modalSlot._editorKey);
  }
  modalSlot._editorKey = null;
  modalSlot._editorBase = null;
  modalSlot._editorOpts = null;
  backdrop.classList.remove('open');
  modalSlot.innerHTML = '';
  modalSlot._pillsBound = false;
  modalSlot._parseResults = null;
  modalSlot._lockedSources = null;
  modalSlot._attachId = null;
  modalSlot._presetSeriesSlug = null;
  pickerBackdrop.classList.remove('open'); pickerSlot.innerHTML = '';
  logopickerBackdrop.classList.remove('open'); logopickerSlot.innerHTML = '';
  closeAllDropdowns();
}

/* PARSE */
const PARSE_SOURCES = ['igdb','steam','pcgw','lbdb','hltb','sgdb'];
function setSrcDot(btn, state){
  if(!btn) return;
  btn.classList.remove('loading','found','notfound','error');
  if(state === 'loading')  btn.classList.add('loading');
  if(state === 'found')    btn.classList.add('found');
  if(state === 'notfound') btn.classList.add('notfound');
  if(state === 'error')    btn.classList.add('error');
}
function renderVariantPills(results){
  modalSlot._parseResults = results;
  const fieldMap = { name:'#f-name', release:'#f-release', platform:'#f-platform', size:'#f-size', dev:'#f-dev', pub:'#f-pub', screenshot:'#f-screenshot', logo:'#f-logo' };
  for(const [field, sel] of Object.entries(fieldMap)){
    const input = modalSlot.querySelector(sel);
    if(!input) continue;
    const pillsHost = modalSlot.querySelector(`.pills[data-field="${field}"]`);
    if(!pillsHost) continue;
    const pills = [];
    for(const src of PARSE_SOURCES){
      const r = results[src];
      if(!r || !r.fields) continue;
      if(field === 'logo'){
        if(src === 'sgdb' && r.logos && r.logos.length){
          pills.push(`<button type="button" class="pill src-sgdb picker" data-field="logo" data-picker="sgdb"><span class="p-src">sgdb</span>${r.logos.length} logos</button>`);
          continue;
        }
        if(src === 'lbdb' && r.entries){
          const withLogos = r.entries.filter(e => e.logo);
          if(withLogos.length){
            pills.push(`<button type="button" class="pill src-lbdb picker" data-field="logo" data-picker="lbdb"><span class="p-src">lbdb</span>${withLogos.length} logos</button>`);
            continue;
          }
        }
      }
      if(field === 'platform'){
        if(src === 'igdb' && typeof r.fields.platform === 'string' && r.fields.platform){
          r.fields.platform.split(',').map(s=>s.trim()).filter(Boolean).forEach(p => {
            pills.push(`<button type="button" class="pill src-igdb" data-field="platform" data-value="${esc(p)}"><span class="p-src">igdb</span>${esc(p)}</button>`);
          });
          continue;
        }
        if(src === 'lbdb' && r.entries){
          const seen = new Set();
          r.entries.forEach(e => {
            if(e.p && !seen.has(e.p)){
              seen.add(e.p);
              pills.push(`<button type="button" class="pill src-lbdb" data-field="platform" data-value="${esc(e.p)}"><span class="p-src">lbdb</span>${esc(e.p)}</button>`);
            }
          });
          continue;
        }
      }
      if(r.fields[field] === undefined) continue;
      const val = r.fields[field];
      if(val === null || val === undefined || val === '') continue;
      const short = String(val).replace(/\s+/g,' ').slice(0, 120);
      pills.push(`<button type="button" class="pill src-${src}" data-field="${field}" data-value="${esc(val)}"><span class="p-src">${src}</span>${esc(short)}</button>`);
    }
    pillsHost.innerHTML = pills.join('');
  }
  const hltbHost = modalSlot.querySelector('.pills[data-field="hltb"]');
  if(hltbHost){
    const pills = [];
    for(const src of PARSE_SOURCES){
      const r = results[src];
      if(!r || !r.fields || r.fields.hltb === undefined) continue;
      const val = r.fields.hltb;
      if(!val) continue;
      pills.push(`<button type="button" class="pill src-${src}" data-field="hltb" data-value="${esc(val)}"><span class="p-src">${src}</span>${esc(String(val).slice(0, 80))}</button>`);
    }
    hltbHost.innerHTML = pills.join('');
  }
}
function attachPillHandlers(){
  if(modalSlot._pillsBound) return;
  modalSlot._pillsBound = true;
  modalSlot.addEventListener('click', e => {
    const pill = e.target.closest('.pill');
    if(!pill || !pill.dataset.field) return;
    const field = pill.dataset.field;
    if(pill.dataset.picker){
      const kind = pill.dataset.picker;
      const results = modalSlot._parseResults || {};
      const nameNow = (modalSlot.querySelector('#f-name')?.value || '').trim();
      let items = [], title = '';
      if(kind === 'sgdb' && results.sgdb && results.sgdb.logos){
        items = results.sgdb.logos.map(l => ({ url: l.url, thumb: l.thumb || l.url, label: (l.style || 'logo') + ' · ' + l.width + '×' + l.height }));
        title = 'SGDB — ' + (results.sgdb.gameName || '');
      } else if(kind === 'lbdb' && results.lbdb && results.lbdb.entries){
        items = results.lbdb.entries.filter(x => x.logo).map(x => ({ url: 'https://images.launchbox-app.com/' + x.logo, thumb: 'https://images.launchbox-app.com/' + x.logo, label: (x.p || 'unknown') + (x.rel ? ' · ' + x.rel : '') }));
        title = 'LBDB';
      }
      const onSearch = kind === 'sgdb'
        ? async (q) => {
            const d = await sgdbSearch(q);

}
async function runParse(){
  const nameInput = modalSlot.querySelector('#f-name');
  const name = (nameInput?.value || '').trim();
  if(!name){ toast('Enter a name first', 'bad'); return; }
  const formPlatform = (modalSlot.querySelector('#f-platform')?.value || '').trim();
  const formRelease = (modalSlot.querySelector('#f-release')?.value || '').trim();
  const goBtn = modalSlot.querySelector('#parse-go');
  const dots = {
    igdb:  modalSlot.querySelector('[data-src-dot="igdb"]'),
    steam: modalSlot.querySelector('[data-src-dot="steam"]'),
    pcgw:  modalSlot.querySelector('[data-src-dot="pcgw"]'),
    lbdb:  modalSlot.querySelector('[data-src-dot="lbdb"]'),
    hltb:  modalSlot.querySelector('[data-src-dot="hltb"]'),
    sgdb:  modalSlot.querySelector('[data-src-dot="sgdb"]'),
  };
  const locked = modalSlot._lockedSources || new Set();
  const prevResults = modalSlot._parseResults || {};
  PARSE_SOURCES.forEach(s => { if(!locked.has(s)) setSrcDot(dots[s], 'loading'); });
  goBtn.disabled = true;
  const results = { igdb:null, steam:null, pcgw:null, lbdb:null, hltb:null, sgdb:null };
  locked.forEach(s => { results[s] = prevResults[s] || { fields:{} }; });
  const tasks = [];
  if(!locked.has('igdb')) tasks.push((async () => {
    try{
      const hits = await igdbSearch(name);
      if(!hits || !hits.length){ results.igdb = { fields:{} }; setSrcDot(dots.igdb, 'notfound'); return; }
      let best = hits[0], bestScore = -Infinity;
      for(const h of hits){
        const s = scoreCandidate(h.name, igdbPlatformString(h), igdbReleaseYear(h), name, formPlatform, formRelease);
        if(s > bestScore){ bestScore = s; best = h; }
      }
      const nameMismatch = levSimilarity(best.name || '', name) < 0.95;
      const bestYear = igdbReleaseYear(best);
      const wantYear = extractYear(formRelease);
      const yearMismatch = wantYear && bestYear && bestYear !== wantYear;
      const bestPlat = igdbPlatformString(best).toLowerCase();
      const wantPlat = formPlatform.toLowerCase();
      const platformMismatch = wantPlat && bestPlat && bestPlat.indexOf(wantPlat) === -1;
      if((nameMismatch || yearMismatch || platformMismatch) && hits.length > 1){
        const picked = await new Promise(resolve => showIgdbPicker(hits, hit => resolve(hit)));
        if(picked) best = picked;
      }
      results.igdb = { fields: igdbMapToFields(best) };
      setSrcDot(dots.igdb, 'found');
    }catch(e){ results.igdb = { error: e.message }; setSrcDot(dots.igdb, 'error'); }
  })());
  if(!locked.has('steam')) tasks.push((async () => {
    try{
      const data = await steamSearch(name);
      results.steam = { fields: steamMapToFields(data), storeUrl: data.storeUrl || '' };
      setSrcDot(dots.steam, 'found');
    }catch(e){ results.steam = { error: e.message }; setSrcDot(dots.steam, 'error'); }
  })());
  if(!locked.has('pcgw')) tasks.push((async () => {
    try{
      const hits = await pcgwSearch(name);
      if(!hits || !hits.length){ results.pcgw = { fields:{} }; setSrcDot(dots.pcgw, 'notfound'); return; }
      let best = hits[0], bestScore = -Infinity;
      for(const h of hits){
        const s = scoreCandidate(h.title, '', '', name, formPlatform, formRelease);
        if(s > bestScore){ bestScore = s; best = h; }
      }
      const wt = await pcgwGetWikitext(best.title);
      results.pcgw = { fields: pcgwMapToFields(wt), page: best.title };
      setSrcDot(dots.pcgw, 'found');
    }catch(e){ results.pcgw = { error: e.message }; setSrcDot(dots.pcgw, 'error'); }
  })());
  if(!locked.has('lbdb')) tasks.push((async () => {
    try{
      const entries = await lbdbLookup(name);
      if(!entries || !entries.length){ results.lbdb = { fields:{} }; setSrcDot(dots.lbdb, 'notfound'); return; }
      let best = entries[0], bestScore = -Infinity;
      for(const e of entries){
        const s = scoreCandidate(e.n || e.name, e.p || '', e.rel || '', name, formPlatform, formRelease);
        if(s > bestScore){ bestScore = s; best = e; }
      }
      results.lbdb = { fields: lbdbMapToFields(best), entries };
      setSrcDot(dots.lbdb, 'found');
    }catch(e){ results.lbdb = { error: e.message }; setSrcDot(dots.lbdb, 'error'); }
  })());
  if(!locked.has('hltb')) tasks.push((async () => {
    try{
      const data = await hltbSearch(name);
      const fields = hltbMapToFields(data);
      if(!fields.hltb){ results.hltb = { fields:{} }; setSrcDot(dots.hltb, 'notfound'); return; }
      results.hltb = { fields };
      setSrcDot(dots.hltb, 'found');
    }catch(e){ results.hltb = { error: e.message }; setSrcDot(dots.hltb, 'error'); }
  })());
  if(!locked.has('sgdb')) tasks.push((async () => {
    try{
      const data = await sgdbSearch(name);
      if(!data.logos || !data.logos.length){ results.sgdb = { fields:{} }; setSrcDot(dots.sgdb, 'notfound'); return; }
      results.sgdb = { fields:{}, logos: data.logos, gameName: data.gameName };
      setSrcDot(dots.sgdb, 'found');
    }catch(e){ results.sgdb = { error: e.message }; setSrcDot(dots.sgdb, 'error'); }
  })());
  await Promise.all(tasks);
  renderVariantPills(results);
  autoAddLinksFromParse(results);
  goBtn.disabled = false;
  const found = PARSE_SOURCES.filter(s => dots[s]?.classList.contains('found'));
  if(found.length === 0) toast('No matches', 'bad');
  else toast('Found on: ' + found.join(', '));
}

      const s = new Set(filterSet);

    updatePendingStrip();
    renderContent();
    toast('Removed from series');
    return;
  }

  const adminBtnEl = e.target.closest('.card-admin button');
  if(adminBtnEl){
    e.stopPropagation();
    const g = viewGame(adminBtnEl.dataset.id);
    if(!g) return;
    if(adminBtnEl.dataset.act === 'edit') openEditor(g);
    else if(adminBtnEl.dataset.act === 'del') openConfirmDelete(g);
    return;
  }
  const jb = e.target.closest('.jump-btn');
  if(jb){
    const target = document.getElementById(jb.dataset.jump);
    if(target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  const sRowAdmin = e.target.closest('.series-game-row[data-series]');
  if(sRowAdmin){
    if(adminMode) return;
  }
  const srow = e.target.closest('.series-game-row');
  if(srow){ const g = viewGame(srow.dataset.id); if(g) openModal(g, 'backlog-series'); return; }
  const rowD = e.target.closest('.rowD');
  if(rowD){ const g = viewGame(rowD.dataset.id); if(g) openModal(g, tab); return; }
  const card = e.target.closest('.card');
  if(card){ const g = viewGame(card.dataset.id); if(g) openModal(g, voidMode ? 'void' : tab); }
});
pendingStrip.addEventListener('click', e => {
  if(e.target.closest('.btns')) return;
  if(!totalPendingCount()) return;
  openPendingModal();
});

/* DRAG */
let dragSrcId = null;
let dragSrcSeries = null;
let dragSrcRow = null;
contentEl.addEventListener('dragstart', e => {
  const block = e.target.closest('.series-block[draggable="true"]');
  if(block){
    dragSrcSeries = block.dataset.series;
    e.dataTransfer.effectAllowed = 'move';
    return;
  }
  const sRow = e.target.closest('.series-game-row[draggable="true"]');
  if(sRow){
    dragSrcRow = { slug: sRow.dataset.series, id: sRow.dataset.id };
    e.dataTransfer.effectAllowed = 'move';
    return;
  }
  const draggable = e.target.closest('.card, .rowD');
  if(!draggable) return;
  if(!adminMode || sortKey !== 'natural'){ e.preventDefault(); return; }
  dragSrcId = draggable.dataset.id;
  draggable.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
});
contentEl.addEventListener('dragover', e => {
  const block = e.target.closest('.series-block');
  if(block && dragSrcSeries && block.dataset.series !== dragSrcSeries){
    e.preventDefault();
    block.classList.add('drag-over');
    return;
  }
  const sRow = e.target.closest('.series-game-row');
  if(sRow && dragSrcRow && sRow.dataset.series === dragSrcRow.slug && sRow.dataset.id !== dragSrcRow.id){
    e.preventDefault();
    sRow.classList.add('drag-over');
    return;
  }
  const draggable = e.target.closest('.card, .rowD');
  if(!draggable || !dragSrcId) return;
  if(draggable.dataset.id === dragSrcId) return;
  e.preventDefault();
  draggable.classList.add('drop-target');
});
contentEl.addEventListener('dragleave', e => {
  const block = e.target.closest('.series-block');
  if(block) block.classList.remove('drag-over');
  const sRow = e.target.closest('.series-game-row');
  if(sRow) sRow.classList.remove('drag-over');
  const draggable = e.target.closest('.card, .rowD');
  if(draggable) draggable.classList.remove('drop-target');
});
contentEl.addEventListener('drop', e => {
  const block = e.target.closest('.series-block');
  if(block && dragSrcSeries){
    e.preventDefault();
    block.classList.remove('drag-over');
    const targetSlug = block.dataset.series;
    if(targetSlug === dragSrcSeries) { dragSrcSeries = null; return; }
    const order = MANIFEST.series_order.slice();
    const fromIdx = order.indexOf(dragSrcSeries);
    const toIdx = order.indexOf(targetSlug);
    if(fromIdx < 0 || toIdx < 0){ dragSrcSeries = null; return; }
    order.splice(fromIdx, 1);
    order.splice(toIdx, 0, dragSrcSeries);
    MANIFEST.series_order = order;
    pendingFileWrites.set('data/series_order.json', JSON.stringify(order, null, 2) + '\n');
    invalidateAllPanes();
    updatePendingStrip();
    renderContent();
    toast('Series reordered');
    dragSrcSeries = null;
    return;
  }
  const sRow = e.target.closest('.series-game-row');
  if(sRow && dragSrcRow){
    e.preventDefault();
    sRow.classList.remove('drag-over');
    const targetSlug = sRow.dataset.series;
    const targetId = sRow.dataset.id;
    if(targetSlug !== dragSrcRow.slug) { dragSrcRow = null; return; }
    if(targetId === dragSrcRow.id) { dragSrcRow = null; return; }
    const s = viewSeries(targetSlug);
    if(!s){ dragSrcRow = null; return; }
    const copy = pendingSeriesWrites.get(targetSlug) || JSON.parse(JSON.stringify(s));
    const order = (copy.order || []).slice();
    const fromIdx = order.indexOf(dragSrcRow.id);
    const toIdx = order.indexOf(targetId);
    if(fromIdx < 0 || toIdx < 0){ dragSrcRow = null; return; }
    order.splice(fromIdx, 1);
    order.splice(toIdx, 0, dragSrcRow.id);
    copy.order = order;
    pendingSeriesWrites.set(targetSlug, copy);
    invalidateAllPanes();
    updatePendingStrip();
    renderContent();
    toast('Series order updated');
    dragSrcRow = null;
    return;
  }
  const draggable = e.target.closest('.card, .rowD');
  if(!draggable || !dragSrcId) return;
  e.preventDefault();
  draggable.classList.remove('drop-target');
  const targetId = draggable.dataset.id;
  if(targetId === dragSrcId) return;
  const list = (pendingListWrites.get(tab) || MANIFEST.lists[tab] || []).slice();
  const fromIdx = list.indexOf(dragSrcId);
  const toIdx = list.indexOf(targetId);
  if(fromIdx < 0 || toIdx < 0) return;
  list.splice(fromIdx, 1);
  list.splice(toIdx, 0, dragSrcId);
  pendingListWrites.set(tab, list);
  updatePendingStrip();
  invalidateAllPanes();
  renderContent();
});
contentEl.addEventListener('dragend', () => {
  contentEl.querySelectorAll('.dragging, .drop-target, .drag-over').forEach(c => c.classList.remove('dragging','drop-target','drag-over'));
  dragSrcId = null;
  dragSrcSeries = null;
  dragSrcRow = null;
});

/* BOOT */
(async function boot(){
  await loadPlatforms();
  await loadManifest();
  (function restoreLastTab(){
    try{
      const saved = JSON.parse(localStorage.getItem('view_last_tab') || 'null');
      if(saved && saved.group && saved.tab
         && TABS[saved.group]
         && TABS[saved.group].some(t => t.id === saved.tab)){
        group = saved.group;
        tab = saved.tab;
      }
    }catch(e){}
    switchEl.dataset.active = group;
    bodyEl.dataset.group = group;
    applySortForTab(tab);
  })();
  applyView();
  renderTabs();
  renderContent();
  updatePendingStrip();
  bootAdminFlow();
})();
</script>
