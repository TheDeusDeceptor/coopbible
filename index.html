<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co-Op Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/corsfix"></script>
<style>
  :root{
    --bg:#0a0d14;--bg-glow:#0f1622;--card:#101624;--border:#1e2836;
    --accent:#38bdf8;--accent-soft:rgba(56,189,248,.14);--accent-line:rgba(56,189,248,.35);
    --text:#e6ebf2;--muted:#7d8798;
    --green:#4ade80;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;
    --purple:#a78bfa;--hltb:#fb7185;--pink:#f472b6;--steam:#66c0f4;--xbox:#4ade80;
    --font-head:'Chakra Petch',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
  }
  body[data-group="single"]{
    --bg:#0d0708;--bg-glow:#1a0b0e;--card:#160d10;--border:#2a161b;
    --accent:#e11d48;--accent-soft:rgba(225,29,72,.14);--accent-line:rgba(225,29,72,.38);
  }
  html{font-size:16px}
  *{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent-line);background-clip:padding-box}
  html{scroll-behavior:smooth}
  body{background:radial-gradient(ellipse 80% 55% at 50% -10%, var(--bg-glow) 0%, transparent 60%),var(--bg);background-attachment:fixed;color:var(--text);font-family:var(--font-body);min-height:100vh;padding:1.75rem;}
  .icon{display:inline-block;width:.85em;height:.85em;background-color:currentColor;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;flex-shrink:0;vertical-align:middle;}
  .icon-pcgw{-webkit-mask-image:url(icons/wrench.svg);mask-image:url(icons/wrench.svg);}
  .icon-nexus{-webkit-mask-image:url(icons/nexus.svg);mask-image:url(icons/nexus.svg);}
  .icon-generic{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'/%3E%3Cpath d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'/%3E%3Cpath d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'/%3E%3C/svg%3E");}
  .icon-search{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M21 21l-4.3-4.3'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M21 21l-4.3-4.3'/%3E%3C/svg%3E");}
  .icon-hltb{-webkit-mask-image:url(icons/clock.svg);mask-image:url(icons/clock.svg);}
  .icon-size{-webkit-mask-image:url(icons/hdd.svg);mask-image:url(icons/hdd.svg);}
  .icon-date{-webkit-mask-image:url(icons/calendar.svg);mask-image:url(icons/calendar.svg);}
  .icon-platform{-webkit-mask-image:url(icons/monitor.svg);mask-image:url(icons/monitor.svg);}
  .icon-dev{-webkit-mask-image:url(icons/code.svg);mask-image:url(icons/code.svg);}
  .icon-pub{-webkit-mask-image:url(icons/briefcase.svg);mask-image:url(icons/briefcase.svg);}
  .icon-pencil{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 20h9'/%3E%3Cpath d='M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4z'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 20h9'/%3E%3Cpath d='M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4z'/%3E%3C/svg%3E");}
  .icon-trash{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='3 6 5 6 21 6'/%3E%3Cpath d='M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6'/%3E%3Cpath d='M10 11v6M14 11v6'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='3 6 5 6 21 6'/%3E%3Cpath d='M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6'/%3E%3Cpath d='M10 11v6M14 11v6'/%3E%3C/svg%3E");}
  .icon-plus{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M12 5v14M5 12h14'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M12 5v14M5 12h14'/%3E%3C/svg%3E");}
  .icon-cols{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='7' height='18' rx='1'/%3E%3Crect x='14' y='3' width='7' height='18' rx='1'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='7' height='18' rx='1'/%3E%3Crect x='14' y='3' width='7' height='18' rx='1'/%3E%3C/svg%3E");}
  .icon-tools{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z'/%3E%3C/svg%3E");}
  .icon-void{-webkit-mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M12 8v4M12 16h.01'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M12 8v4M12 16h.01'/%3E%3C/svg%3E");}
  header{max-width:1400px;margin:0 auto 1.75rem;display:flex;justify-content:center;position:relative;}
  .admin-toggle,.tools-btn,.void-btn{position:absolute;top:50%;transform:translateY(-50%);display:none;align-items:center;gap:.5rem;font-family:var(--font-head);font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:.55rem .85rem;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.015);color:var(--muted);cursor:pointer;transition:all .18s ease;white-space:nowrap;}
  body.admin-on .tools-btn,body.admin-on .void-btn{display:inline-flex;}
  .tools-btn{left:0;}
  .void-btn{left:0;margin-left:6.5rem;}
  .tools-btn .icon,.void-btn .icon{width:14px;height:14px;}
  .void-btn.void-on{color:var(--red);border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
  .admin-toggle{right:0;display:inline-flex;}
  .admin-toggle:hover,.tools-btn:hover,.void-btn:hover{color:#cbd5e1;border-color:var(--accent-line)}
  .admin-toggle .lamp,.tools-btn .lamp,.void-btn .lamp{width:7px;height:7px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1px #4a5468;transition:all .18s ease;}
  body.admin-on .admin-toggle{color:var(--red);border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
  body.admin-on .admin-toggle .lamp{background:var(--red);box-shadow:0 0 8px var(--red)}
  .tools-btn.running .lamp{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1.4s ease-in-out infinite;}
  .tools-btn.running{color:var(--amber);border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.08)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .switch{position:relative;width:280px;height:58px;padding:5px;display:flex;cursor:pointer;user-select:none;border-radius:29px;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%, rgba(255,255,255,.02) 100%);box-shadow:inset 0 2px 6px rgba(0,0,0,.85),inset 0 -1px 0 rgba(255,255,255,.03),0 1px 0 rgba(255,255,255,.03);border:1px solid var(--border);transition:border-color .25s ease;}
  .switch:hover{border-color:var(--accent-line)}
  .switch-knob{position:absolute;top:5px;left:5px;width:calc(50% - 5px);height:calc(100% - 10px);border-radius:24px;background:linear-gradient(180deg,#2a3444 0%,#1b2330 55%,#141b26 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.6);transition:transform .32s cubic-bezier(.34,1.15,.4,1);z-index:1;}
  .switch-knob::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 50% 0%, var(--accent-soft), transparent 60%);transition:background .35s ease;}
  body[data-group="single"] .switch-knob{transform:translateX(100%)}
  .switch-label{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:.82rem;letter-spacing:.12em;color:#4a5468;transition:color .22s ease,text-shadow .22s ease;pointer-events:none;}
  .switch[data-active="coop"] .switch-label[data-side="coop"],.switch[data-active="single"] .switch-label[data-side="single"]{color:#e8f6ff;text-shadow:0 0 10px var(--accent-line);}
  .tabbar{max-width:1400px;margin:0 auto 1rem;display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;}
  .tabbar button{font-family:var(--font-head);font-weight:600;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:.5rem .9rem;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;transition:all .2s ease;}
  .tabbar button:hover{color:#cbd5e1;border-color:var(--accent-line)}
  .tabbar button.active{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
  .pending-strip{max-width:1400px;margin:0 auto 1rem;display:none;align-items:center;gap:1rem;padding:.6rem 1rem;background:linear-gradient(180deg,rgba(74,222,128,.06) 0%,transparent 100%);border:1px solid rgba(74,222,128,.35);border-radius:9px;cursor:pointer;transition:border-color .18s ease,background .18s ease;}
  .pending-strip:hover{border-color:rgba(74,222,128,.55);background:linear-gradient(180deg,rgba(74,222,128,.1) 0%,transparent 100%);}
  .pending-strip.on{display:flex}
  .pending-strip .count{font-family:var(--font-head);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);}
  .pending-strip .count .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);margin-right:.5rem;vertical-align:middle;animation:pulse 1.6s ease-in-out infinite;}
  .pending-strip .hint{margin-left:auto;font-family:var(--font-head);font-size:.58rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .pending-strip .btns{display:flex;gap:.5rem;pointer-events:auto;}
  .pending-strip button{font-family:var(--font-head);font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:.45rem .85rem;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;transition:all .18s ease;}
  .pending-strip button:hover{color:#cbd5e1;border-color:var(--accent-line)}
  .pending-strip button.commit{color:var(--green);border-color:rgba(74,222,128,.5);background:rgba(74,222,128,.08);}
  .pending-strip button.commit:hover{color:#fff;background:rgba(74,222,128,.2)}
  .pending-strip button:disabled{opacity:.5;cursor:wait}
  .toolbar{max-width:1400px;margin:0 auto 1.25rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;}
  .toolbar.empty{display:none}
  .tb-left{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
  .tb-right{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
  .dd{position:relative}
  .dd-btn{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--font-head);font-weight:600;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:.6rem .9rem;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.015);color:#cbd5e1;cursor:pointer;transition:all .18s ease;white-space:nowrap;}
  .dd-btn:hover{color:#fff;border-color:var(--accent-line);background:var(--accent-soft)}
  .dd.open .dd-btn{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
  .dd-btn .chev{font-size:.7rem;line-height:1;opacity:.7;transition:transform .18s ease;}
  .dd.open .dd-btn .chev{transform:rotate(180deg)}
  .dd-btn .val{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:.02em;font-family:var(--font-body);font-size:.82rem;}
  .dd.open .dd-btn .val,.dd-btn:hover .val{color:#e6ebf2}
  .dd-btn.non-default{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
  .dd-btn.non-default .val{color:var(--accent);}
  .dd-menu{position:absolute;top:calc(100% + .35rem);left:0;z-index:50;min-width:200px;background:#0c1017;border:1px solid var(--border);border-radius:9px;padding:.35rem;box-shadow:0 12px 32px rgba(0,0,0,.55);display:none;flex-direction:column;gap:.1rem;animation:menuIn .13s ease-out;}
  .dd.open .dd-menu{display:flex}
  @keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .dd-item{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-radius:6px;font-family:var(--font-body);font-size:.86rem;font-weight:500;color:#cbd5e1;background:transparent;border:none;cursor:pointer;text-align:left;width:100%;transition:background .12s ease,color .12s ease;white-space:nowrap;}
  .dd-item:hover{background:rgba(255,255,255,.04);color:#fff}
  .dd-item.active{color:var(--accent)}
  .dd-item.active .dd-tick{opacity:1}
  .dd-tick{margin-left:auto;font-size:.85rem;line-height:1;opacity:0;color:var(--accent);}
  .dd-item .dir{font-size:.75rem;line-height:1;opacity:.45;color:var(--muted);}
  .dd-item.active .dir{opacity:1;color:var(--accent)}
  .search-box{position:relative;display:flex;align-items:center;}
  .search-box .s-icon{position:absolute;left:10px;width:14px;height:14px;color:var(--muted);pointer-events:none;}
  .search-box input{font-family:var(--font-body);font-size:.85rem;color:#e6ebf2;background:rgba(255,255,255,.015);border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem .6rem 2.1rem;width:220px;outline:none;transition:border-color .18s ease,background .18s ease;}
  .search-box input::placeholder{color:#4a5468}
  .search-box input:focus{border-color:var(--accent-line);background:var(--accent-soft);}
  .chk{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-head);font-size:.6rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:.4rem .6rem;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;transition:all .16s ease;appearance:none;-webkit-appearance:none;}
  .chk:hover{color:#cbd5e1;border-color:var(--accent-line)}
  .chk .dot{width:7px;height:7px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1px #4a5468;transition:all .16s ease;}
  .chk.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
  .chk.on .dot{background:var(--accent);box-shadow:0 0 6px var(--accent);}
  .btn-add{display:none;align-items:center;gap:.45rem;font-family:var(--font-head);font-weight:700;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;padding:.6rem .95rem;border:1px solid var(--red);border-radius:8px;background:rgba(239,68,68,.1);color:var(--red);cursor:pointer;transition:all .18s ease;}
  body.admin-on .btn-add{display:inline-flex;}
  .btn-add:hover{background:rgba(239,68,68,.18);color:#fff;border-color:#fff}
  .section-header{max-width:1400px;margin:2rem auto 1rem;display:flex;align-items:center;gap:.85rem;scroll-margin-top:1.5rem;}
  .section-header:first-child{margin-top:0}
  .section-header .bar{width:3px;height:18px;background:var(--accent);border-radius:2px;flex-shrink:0;}
  .section-header .label{font-family:var(--font-head);font-size:.78rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);white-space:nowrap;}
  .section-header .line{flex:1;height:1px;background:var(--border);}
  .jump-btn{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-head);font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:.4rem .7rem;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .18s ease;}
  .jump-btn:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
  .jump-btn .arw{font-size:.85rem;line-height:1}
  .grid{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,36rem),1fr));gap:1.25rem;}
  body[data-cols="1"] .grid{grid-template-columns:1fr}
  body[data-cols="2"] .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  body[data-cols="3"] .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  body[data-cols="4"] .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .grid-empty{max-width:1400px;margin:1.5rem auto;padding:2rem 1rem;text-align:center;font-family:var(--font-head);font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--border);border-radius:9px;line-height:1.8;}
  /* Narrow-column chip shrink */
  body[data-cols="3"] .ov-chip,
  body[data-cols="4"] .ov-chip{
    font-size:.68rem;
    padding:.26rem .5rem;
  }
  body[data-cols="3"] .overlay-chips,
  body[data-cols="4"] .overlay-chips{
    gap:.25rem;
  }
  body[data-cols="3"] .dlc-counter,

function toast(msg, kind){

  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toastEl.classList.remove('show'); }, 3500);

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function slugify(name){
  if(!name) return '';
  const s = String(name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return s || 'unnamed';
}
const ROMAN_MAP = { i:1, ii:2, iii:3, iv:4, v:5, vi:6, vii:7, viii:8, ix:9, x:10, xi:11, xii:12, xiii:13, xiv:14, xv:15 };
function normalizeName(name){
  if(!name) return '';
  let s = String(name).toLowerCase();
  s = s.replace(/\b(xiii|xii|xi|xiv|xv|viii|vii|iii|ii|vi|ix|iv|x|v|i)\b/g, m => ROMAN_MAP[m] || m);
  s = s.replace(/^the\s+/, '');
  s = s.replace(/[^a-z0-9\s]/g, ' ');
  s = s.replace(/\s+/g,' ').trim();
  return s;
}
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(m === 0) return n;
  if(n === 0) return m;
  const prev = new Array(n + 1), curr = new Array(n + 1);
  for(let j = 0; j <= n; j++) prev[j] = j;
  for(let i = 1; i <= m; i++){
    curr[0] = i;
    for(let j = 1; j <= n; j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      curr[j] = Math.min(curr[j-1]+1, prev[j]+1, prev[j-1]+cost);
    }
    for(let j = 0; j <= n; j++) prev[j] = curr[j];
  }
  return prev[n];
}
function nameSimilarity(a, b){
  const na = normalizeName(a), nb = normalizeName(b);
  if(!na || !nb) return 0;
  if(na === nb) return 1;
  const max = Math.max(na.length, nb.length);
  const dist = levenshtein(na, nb);
  let score = (max - dist) / max;
  if(na.includes(nb) || nb.includes(na)) score = Math.max(score, 0.85);
  return score;
}
function resolveImgUrl(url){
  if(!url) return '';
  const s = String(url);
  if(/^https?:|^data:|^\/\//.test(s)) return s;
  return PAGES_BASE + s.replace(/^\/+/, '');
}
function b64url(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/=+$/,'').replace(/\+/g,'-').replace(/\//g,'_');
}

  const u = resolveImgUrl(url);
  if(!u) return '';
  if(u.startsWith('data:')) return u;
  if(/\/images\//.test(u)) return u;
  return 'https://images.weserv.nl/?url=' + encodeURIComponent(u) + '&h=720';
}

  return String(key).trim().toLowerCase() === 'pc';
}
function extractYear(raw){
  if(raw == null) return '';
  if(typeof raw === 'number'){
    const i = Math.trunc(raw);
    if(i === raw && i >= 1900 && i <= 2100) return String(i);
  }
  const s = String(raw).trim();
  for(const m of s.matchAll(/\d{4}/g)){
    const y = parseInt(m[0], 10);
    if(y >= 1900 && y <= 2100) return String(y);
  }
  const xMatch = s.match(/(\d{3})[xX]/);
  if(xMatch) return xMatch[1] + 'x';
  return '';
}
function deriveIdYear(release, eaRelease){
  return extractYear(release) || extractYear(eaRelease) || 'unreleased';
}
function deriveGameId(name, release, eaRelease, platform){
  const slug = slugify(name) || 'unnamed';
  const year = deriveIdYear(release, eaRelease);
  const plat = slugify(platform) || 'unknown';
  return slug + '-' + year + '-' + plat;
}

/* FORMATTERS */
function fmtHltbMain(str){
  if(!str || str === '—') return '—';
  const m = String(str).trim().match(/^Main:\s*([\d.]+)/i);
  return m ? `${m[1]} hrs` : String(str).trim();
}
function fmtHltb(str, html){
  if(!str || str === '—') return '—';
  const s = String(str).trim();
  const m = s.match(/^Main:\s*([\d.]+)(?:\s*,\s*\+Extra:\s*([\d.]+))?$/i);
  if(m){
    const [_,main,extra] = m;
    if(html){
      if(extra && extra !== main) return `${main}<span class="sep">to</span>${extra}<span class="unit">hrs</span>`;
      return `${main}<span class="unit">hrs</span>`;
    }
    if(extra && extra !== main) return `${main} to ${extra} hrs`;
    return `${main} hrs`;
  }
  return s;
}
function fmtSize(str, html){
  if(!str || str === '—') return str || '—';
  const s = String(str).trim();
  if(!html) return s;
  const m = s.match(/^([\d.]+)\s*(GB|MB|TB|KB)$/i);
  return m ? `${m[1]}<span class="unit">${m[2]}</span>` : s;
}
function releaseKey(str){
  if(!str) return 0;
  let s = String(str).trim().replace(/^Init\.\s*/i, '').split('→')[0].trim();
  const full = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if(full) return +full[3]*10000 + +full[2]*100 + +full[1];
  const xMatch = s.match(/(\d{3})[xX]/);
  if(xMatch) return (+xMatch[1] * 10) * 10000;
  const y = s.match(/(\d{4})/);
  return y ? +y[1]*10000 : 0;
}
function sizeKey(str){
  if(!str || str === '—') return -1;
  const m = String(str).match(/([\d.]+)\s*(TB|GB|MB|KB)/i);
  if(!m) return -1;
  const v = parseFloat(m[1]), u = m[2].toUpperCase();
  if(u==='TB') return v*1024;
  if(u==='GB') return v;
  if(u==='MB') return v/1024;
  if(u==='KB') return v/1024/1024;
  return v;
}
function hltbMainKey(str){
  if(!str || str === '—') return -1;
  const s = String(str);
  if(/unending|ongoing/i.test(s)) return 999999;
  const m = s.match(/Main:\s*([\d.]+)/i);
  return m ? parseFloat(m[1]) : -1;
}
function hltbExtraKey(str){
  if(!str || str === '—') return -1;
  const s = String(str);
  if(/unending|ongoing/i.test(s)) return 999999;
  const m = s.match(/\+Extra:\s*([\d.]+)/i);
  if(m) return parseFloat(m[1]);
  const main = s.match(/Main:\s*([\d.]+)/i);
  return main ? parseFloat(main[1]) : -1;
}
function nameKey(str){ return String(str||'').toLowerCase(); }

function viewGame(id){
  const base = MANIFEST.games[id];
  const draft = pendingGameWrites.get(id);
  if(!draft) return base || null;
  if(!base) return draft;
  return { ...base, ...draft };
}
function viewSeries(slug){
  const base = MANIFEST.series[slug];
  const draft = pendingSeriesWrites.get(slug);
  if(!draft) return base || null;
  if(!base) return draft;
  return { ...base, ...draft };
}
function listFor(tabId){
  if(!REAL_LISTS_SET.has(tabId)) return [];
  if(pendingListWrites.has(tabId)) return pendingListWrites.get(tabId).slice();
  return (MANIFEST.lists[tabId] || []).slice();
}
function gamesOfTab(tabId){
  return listFor(tabId).map(viewGame).filter(Boolean);
}
function membershipsOf(gameId){
  const out = new Set();
  for(const t of REAL_LISTS){
    const ids = pendingListWrites.has(t) ? pendingListWrites.get(t) : (MANIFEST.lists[t] || []);
    if(ids.includes(gameId)) out.add(t);
  }
  return out;
}
function gamesWithNoList(){
  const out = [];
  const seen = new Set();
  for(const id of Object.keys(MANIFEST.games)){
    if(pendingGameDeletes.has(id)) continue;
    const mem = membershipsOf(id);
    if(mem.size === 0 && !seen.has(id)){ out.push(viewGame(id)); seen.add(id); }
  }
  for(const [id] of pendingGameWrites){
    if(seen.has(id)) continue;
    if(pendingGameDeletes.has(id)) continue;
    if(MANIFEST.games[id]) continue;
    const mem = membershipsOf(id);
    if(mem.size === 0){ out.push(viewGame(id)); seen.add(id); }
  }
  return out;
}

/* SERIES HELPERS */
function seriesOrderLive(){
  return MANIFEST.series_order.filter(s => !pendingSeriesDeletes.has(s));
}
function allSeriesUndoneInOrder(){
  const out = [];
  for(const slug of seriesOrderLive()){
    const s = viewSeries(slug);
    if(!s) continue;
    for(const id of (s.order || [])){
      const g = viewGame(id);
      if(!g) continue;
      if((g.series_status || '') === 'done') continue;
      out.push(g);
    }
  }
  return out;
}
function seriesTotals(slug){
  const s = viewSeries(slug);
  if(!s) return { main: 0, extra: 0, hasAny: false };
  let main = 0, extra = 0, hasAny = false;
  for(const id of (s.order || [])){
    const g = viewGame(id);
    if(!g) continue;
    const h = g.hltb || '';
    const mm = String(h).match(/Main:\s*([\d.]+)/i);
    const me = String(h).match(/\+Extra:\s*([\d.]+)/i);
    if(mm){ main += parseFloat(mm[1]); hasAny = true; }
    if(me){ extra += parseFloat(me[1]); }
  }
  return { main, extra, hasAny };
}
function isInAnySeries(gameId){
  for(const slug of Object.keys(MANIFEST.series)){
    if(pendingSeriesDeletes.has(slug)) continue;
    const s = viewSeries(slug);
    if(!s) continue;
    if((s.order || []).includes(gameId)) return true;
  }
  return false;
}

async function verifyToken(token){
  try{
    const res = await fetch('https://api.github.com/user', {
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
    });
    if(res.status === 200){ const data = await res.json(); return { ok:true, login: data.login }; }
    if(res.status === 401) return { ok:false, err:'Invalid or expired token' };
    if(res.status === 403) return { ok:false, err:'Token rejected' };
    return { ok:false, err:'GitHub API HTTP ' + res.status };
  }catch(e){ return { ok:false, err:'Network error: ' + e.message }; }
}

/* GITHUB */
async function ghFetch(url, opts = {}){
  const tok = getToken();
  if(!tok) throw new Error('No token');
  const headers = { 'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json', ...(opts.headers || {}) };
  return fetch(url, { ...opts, headers });
}
async function ghGetHeadSha(){
  const r = await ghFetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/ref/heads/main`);
  if(!r.ok) throw new Error('ref HTTP ' + r.status);
  return (await r.json()).object.sha;
}
async function ghGetCommitTree(sha){
  const r = await ghFetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/commits/${sha}`);
  if(!r.ok) throw new Error('commit HTTP ' + r.status);
  return (await r.json()).tree.sha;
}
async function ghCreateBlob(content){
  const r = await ghFetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/blobs`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content, encoding: 'utf-8' })
  });
  if(!r.ok) throw new Error('blob HTTP ' + r.status);
  return (await r.json()).sha;
}
async function ghCreateTree(baseTree, tree){
  const r = await ghFetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ base_tree: baseTree, tree })
  });
  if(!r.ok) throw new Error('tree HTTP ' + r.status);
  return (await r.json()).sha;
}
async function ghCreateCommit(message, treeSha, parentSha){
  const r = await ghFetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/commits`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, tree: treeSha, parents: [parentSha] })
  });
  if(!r.ok) throw new Error('commit-create HTTP ' + r.status);
  return (await r.json()).sha;
}
async function ghUpdateRef(sha){
  const r = await ghFetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/refs/heads/main`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sha, force: false })
  });
  if(!r.ok) throw new Error('ref-update HTTP ' + r.status);
}

/* COMMIT */
function regenerateManifest(){
  const games = { ...MANIFEST.games };
  for(const id of pendingGameDeletes) delete games[id];
  for(const [id, g] of pendingGameWrites) games[id] = g;
  const lists = {};
  for(const t of REAL_LISTS){
    lists[t] = (pendingListWrites.get(t) || MANIFEST.lists[t] || []).filter(id => !pendingGameDeletes.has(id));
  }
  const series = {};
  for(const slug of Object.keys(MANIFEST.series)){
    if(pendingSeriesDeletes.has(slug)) continue;
    const base = MANIFEST.series[slug];
    const over = pendingSeriesWrites.get(slug);
    const merged = over ? { ...base, ...over } : { ...base };
    merged.order = (merged.order || []).filter(id => !pendingGameDeletes.has(id));
    series[slug] = merged;
  }
  for(const [slug, s] of pendingSeriesWrites){
    if(!series[slug]) series[slug] = { ...s, order: (s.order || []).filter(id => !pendingGameDeletes.has(id)) };
  }
  const order = (MANIFEST.series_order || []).filter(s => !pendingSeriesDeletes.has(s));
  for(const slug of Object.keys(series)){
    if(!order.includes(slug)) order.push(slug);
  }
  const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  return { version: 4, updated: now, games, lists, series, series_order: order };
}
async function commitPending(){
  const total = totalPendingCount();
  if(total === 0){ toast('Nothing to commit', 'bad'); return; }
  if(!getToken()){ showTokenPrompt(); return; }

  const stripCommit = pendingStrip.querySelector('.commit');
  const stripDisc = pendingStrip.querySelector('.discard');
  if(stripCommit){ stripCommit.disabled = true; stripCommit.textContent = '…Committing'; }
  if(stripDisc) stripDisc.disabled = true;

  try{
    const writes = [];
    for(const [id, g] of pendingGameWrites){
      writes.push({ path: 'games/' + id + '.json', content: JSON.stringify(g, null, 2) + '\n' });
    }
    for(const tabId of pendingListWrites.keys()){
      const ids = pendingListWrites.get(tabId) || [];
      const payload = { version: 1, updated: new Date().toISOString().replace(/\.\d+Z$/, 'Z'), ids };
      writes.push({ path: 'data/lists/' + tabId + '.json', content: JSON.stringify(payload, null, 2) + '\n' });
    }
    for(const [slug, s] of pendingSeriesWrites){
      writes.push({ path: 'data/series/' + slug + '.json', content: JSON.stringify(s, null, 2) + '\n' });
    }
    for(const [path, content] of pendingFileWrites){
      writes.push({ path, content });
    }

    const manifest = regenerateManifest();
    writes.push({ path: 'data/manifest.json', content: JSON.stringify(manifest, null, 2) + '\n' });
    writes.push({ path: 'data/series_order.json', content: JSON.stringify(manifest.series_order, null, 2) + '\n' });

    const headSha = await ghGetHeadSha();
    const baseTree = await ghGetCommitTree(headSha);
    const tree = [];
    for(const w of writes){
      const blobSha = await ghCreateBlob(w.content);
      tree.push({ path: w.path, mode: '100644', type: 'blob', sha: blobSha });
    }
    for(const id of pendingGameDeletes){
      tree.push({ path: 'games/' + id + '.json', mode: '100644', type: 'blob', sha: null });
    }
    for(const slug of pendingSeriesDeletes){
      tree.push({ path: 'data/series/' + slug + '.json', mode: '100644', type: 'blob', sha: null });
    }

    const newTree = await ghCreateTree(baseTree, tree);

    let adds = 0, edits = 0, dels = 0, files = 0, listWrites = 0, seriesWrites = 0;
    for(const [id] of pendingGameWrites){
      if(MANIFEST.games[id]) edits++; else adds++;
    }
    dels = pendingGameDeletes.size;
    listWrites = pendingListWrites.size;
    files = pendingFileWrites.size;
    seriesWrites = pendingSeriesWrites.size + pendingSeriesDeletes.size;

    const parts = [];
    if(adds) parts.push(`${adds} added`);
    if(edits) parts.push(`${edits} edited`);
    if(dels) parts.push(`${dels} deleted`);
    if(listWrites) parts.push(`${listWrites} list${listWrites===1?'':'s'}`);
    if(seriesWrites) parts.push(`${seriesWrites} series`);
    if(files) parts.push(`${files} file${files===1?'':'s'}`);
    const msg = 'Batch: ' + (parts.join(', ') || 'update');

    const newCommit = await ghCreateCommit(msg, newTree, headSha);
    await ghUpdateRef(newCommit);

    for(const id of pendingGameDeletes) delete MANIFEST.games[id];
    for(const [id, g] of pendingGameWrites) MANIFEST.games[id] = g;
    for(const [tabId, ids] of pendingListWrites) MANIFEST.lists[tabId] = ids.slice();
    for(const slug of pendingSeriesDeletes) delete MANIFEST.series[slug];
    for(const [slug, s] of pendingSeriesWrites) MANIFEST.series[slug] = s;
    MANIFEST.series_order = manifest.series_order;
    MANIFEST.version = 4;

    pendingGameWrites.clear();
    pendingGameDeletes.clear();
    pendingListWrites.clear();
    pendingFileWrites.clear();
    pendingSeriesWrites.clear();
    pendingSeriesDeletes.clear();
    PLATFORMS_ORIGINAL = JSON.parse(JSON.stringify(PLATFORMS));

    updatePendingStrip();
    invalidateAllPanes();
    renderContent();
    toast('Committed');
  }catch(e){
    console.error('commit failed', e);
    toast('Commit failed: ' + e.message, 'bad');
    updatePendingStrip();
  }
}

  }

        ${rows.map(r => `
          <div class="pending-row" data-key="${esc(r.key)}" style="display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;background:#0a0e15;border:1px solid var(--border);border-radius:6px;">
            <span style="font-family:var(--font-head);font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:2.5rem;">${esc(r.tab)}</span>
            <span style="font-family:var(--font-head);font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .5rem;border-radius:4px;border:1px solid var(--border);color:var(--muted);">${esc(r.action)}</span>
            <span style="flex:1;font-size:.85rem;color:#e6ebf2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(r.name)}">${esc(r.name)}</span>
            <button type="button" class="pr-discard" style="width:24px;height:24px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;">✕</button>
          </div>
        `).join('')}
      </div>
      <div class="token-actions" style="display:flex;gap:.6rem;justify-content:flex-end;">
        <button type="button" class="btn" data-close>Close</button>
        <button type="button" class="btn danger" id="pm-discard-all">Discard all</button>
        <button type="button" class="btn primary" id="pm-commit">Commit</button>
      </div>
    </div>`;
  pendingBackdrop.classList.add('open');
  pendingSlot.querySelectorAll('[data-close]').forEach(el => el.onclick = closePendingModal);
  pendingSlot.querySelectorAll('.pr-discard').forEach(btn => btn.onclick = () => {
    const key = btn.closest('.pending-row').dataset.key;
    if(key.startsWith('game:')) pendingGameWrites.delete(key.slice(5));
    else if(key.startsWith('gamedel:')) pendingGameDeletes.delete(key.slice(8));
    else if(key.startsWith('list:')) pendingListWrites.delete(key.slice(5));
    else if(key.startsWith('series:')) pendingSeriesWrites.delete(key.slice(7));
    else if(key.startsWith('seriesdel:')) pendingSeriesDeletes.delete(key.slice(10));
    else if(key.startsWith('file:')) pendingFileWrites.delete(key.slice(5));
    updatePendingStrip();
    invalidateAllPanes();
    renderContent();
    if(totalPendingCount() === 0) closePendingModal();
    else openPendingModal();
  });
  pendingSlot.querySelector('#pm-discard-all').onclick = () => {
    if(!confirm('Discard all pending changes?')) return;
    clearAllPending();
    closePendingModal();

  pendingSlot.querySelector('#pm-commit').onclick = () => {

    commitPending();

/* TOOLS */
let lbdbState = 'idle', lbdbMessage = '', lbdbPollTimer = null, lbdbStartTime = 0;
let toolsActiveTab = 'general';

function renderToolsBtn(){
  toolsBtn.classList.remove('running');
  if(lbdbState === 'running'){ toolsBtn.classList.add('running'); toolsBtnLabel.textContent = 'Tools · LBDB'; }
  else toolsBtnLabel.textContent = 'Tools';
}
function setLbdbState(state, msg){
  lbdbState = state;
  lbdbMessage = msg || '';
  renderToolsBtn();
  renderLbdbStatusInModal();
}
function renderLbdbStatusInModal(){
  const el = toolsSlot.querySelector('#lbdb-status');
  if(!el) return;
  el.classList.remove('running','done','error');
  if(lbdbState === 'running') el.classList.add('running');
  else if(lbdbState === 'done') el.classList.add('done');
  else if(lbdbState === 'error') el.classList.add('error');
  const label = toolsSlot.querySelector('#lbdb-status-label');
  if(label){
    if(lbdbState === 'idle') label.textContent = 'Idle';
    else if(lbdbState === 'running') label.textContent = lbdbMessage || 'Running…';
    else if(lbdbState === 'done') label.textContent = lbdbMessage || 'Up to date';
    else if(lbdbState === 'error') label.textContent = lbdbMessage || 'Failed';
  }
  const btn = toolsSlot.querySelector('#lbdb-run');
  if(btn){ btn.disabled = (lbdbState === 'running'); btn.textContent = lbdbState === 'running' ? 'Running…' : 'Update LBDB'; }
}
async function triggerLbdbUpdate(){
  if(!getToken()){ showTokenPrompt(); return; }
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/${LBDB_WORKFLOW}/dispatches`;
  try{
    const res = await ghFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ref: 'main' }) });
    if(res.status === 204){ toast('LBDB update queued'); startLbdbPolling(); }
    else if(res.status === 404){ toast('Workflow not found', 'bad'); setLbdbState('error', 'Workflow not found'); }
    else if(res.status === 403 || res.status === 401){ toast('Token needs Actions: write', 'bad'); setLbdbState('error', 'Token needs Actions: write'); }
    else { toast('Trigger failed: HTTP ' + res.status, 'bad'); setLbdbState('error', 'HTTP ' + res.status); }
  }catch(e){ toast('Trigger failed: ' + e.message, 'bad'); setLbdbState('error', e.message); }
}
function startLbdbPolling(){
  lbdbStartTime = Date.now();
  setLbdbState('running', 'Running…');
  clearInterval(lbdbPollTimer);
  lbdbPollTimer = setInterval(checkLbdbStatus, 8000);
  checkLbdbStatus();
}
async function checkLbdbStatus(){
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/${LBDB_WORKFLOW}/runs?per_page=1`;
  try{
    const res = await ghFetch(url);
    if(!res.ok) return;
    const run = ((await res.json()).workflow_runs || [])[0];
    if(!run) return;
    if(new Date(run.created_at).getTime() < lbdbStartTime - 30000) return;
    const elapsed = Math.round((Date.now() - lbdbStartTime) / 1000);
    setLbdbState('running', `Running… ${elapsed}s`);
    if(run.status === 'completed'){
      clearInterval(lbdbPollTimer); lbdbPollTimer = null;
      if(run.conclusion === 'success'){ setLbdbState('done', 'Up to date'); toast('LBDB updated'); }
      else { setLbdbState('error', 'Failed: ' + run.conclusion); toast('LBDB update failed: ' + run.conclusion, 'bad'); }
      setTimeout(() => { if(lbdbState === 'done' || lbdbState === 'error') setLbdbState('idle', ''); }, 8000);
    }
  }catch(e){}
}

let platDraft = null;
function clonePlatforms(o){ return JSON.parse(JSON.stringify(o || {})); }
function platRowStatus(key){
  const orig = PLATFORMS_ORIGINAL[key];
  if(!orig) return 'new';
  const cur = platDraft[key];
  if(!cur) return 'edited';
  if((orig.label || '') !== (cur.label || '') || (orig.icon || '') !== (cur.icon || '')) return 'edited';
  return '';
}
function platRowHTML(key){
  const p = platDraft[key] || { label:'', icon:'' };

  const badgeTxt = status === 'new' ? 'NEW' : (status === 'edited' ? 'EDITED' : ' ');
  const iconFile = (p.icon || '').trim();
  const iconUrl = iconFile ? (PLATFORM_ICON_BASE + iconFile) : '';
  return `
    <div class="plat-row ${status}" data-key="${esc(key)}">
      <input type="text" class="key-input" value="${esc(key)}" data-field="key">

}
function renderPlatformRows(){
  const host = toolsSlot.querySelector('#plat-rows');

function refreshToolsBody(){
  const host = toolsSlot.querySelector('.tools-modal');
  if(!host) return;
  host.querySelectorAll('.tools-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === toolsActiveTab));
  const gen = toolsSlot.querySelector('#tools-general');
  const plat = toolsSlot.querySelector('#tools-platforms');
  if(gen) gen.style.display = toolsActiveTab === 'general' ? '' : 'none';
  if(plat) plat.style.display = toolsActiveTab === 'platforms' ? '' : 'none';
  if(toolsActiveTab === 'general') { renderLbdbStatusInModal(); }
  if(toolsActiveTab === 'platforms') { renderPlatformRows(); }

function openToolsModal(){
  platDraft = clonePlatforms(PLATFORMS);
  toolsActiveTab = 'general';
  toolsSlot.innerHTML = toolsModalHTML();
  toolsBackdrop.classList.add('open');
  renderLbdbStatusInModal();

  toolsSlot.querySelectorAll('[data-close]').forEach(el => el.onclick = closeToolsModal);
  toolsSlot.querySelectorAll('.tools-tab').forEach(t => t.onclick = () => { toolsActiveTab = t.dataset.tab; refreshToolsBody(); });

  const lbdbRun = toolsSlot.querySelector('#lbdb-run');
  if(lbdbRun) lbdbRun.onclick = () => { if(lbdbState !== 'running') triggerLbdbUpdate(); };

  const rowsHost = toolsSlot.querySelector('#plat-rows');
  if(rowsHost){
    rowsHost.addEventListener('input', e => {
      const row = e.target.closest('.plat-row');
      if(!row) return;
      const key = row.dataset.key;
      const field = e.target.dataset.field;
      if(!field || !platDraft[key]) return;
      if(field === 'key'){
        const newKey = e.target.value.trim().toLowerCase().replace(/\s+/g,'_');
        if(!newKey || newKey === key) return;
        const entry = platDraft[key];
        delete platDraft[key];
        platDraft[newKey] = entry;
        row.dataset.key = newKey;
      } else {
        platDraft[key][field] = e.target.value;
        if(field === 'icon'){
          const prev = row.querySelector('.plat-icon-preview');
          const v = e.target.value.trim();
          if(v){
            prev.classList.remove('empty');
            prev.innerHTML = `<img src="${PLATFORM_ICON_BASE + v}" alt="" onerror="this.style.display='none';this.parentElement.classList.add('empty');">`;
          } else { prev.classList.add('empty'); prev.innerHTML = ''; }
        }
        const status = platRowStatus(key);
        row.classList.remove('new','edited');
        if(status) row.classList.add(status);
        const badge = row.querySelector('.plat-badge');
        badge.classList.remove('new','edited','empty');
        if(status === 'new'){ badge.classList.add('new'); badge.textContent = 'NEW'; }
        else if(status === 'edited'){ badge.classList.add('edited'); badge.textContent = 'EDITED'; }
        else { badge.classList.add('empty'); badge.textContent = ' '; }
      }
    });
    rowsHost.addEventListener('blur', e => {
      if(e.target.dataset && e.target.dataset.field === 'key') renderPlatformRows();
    }, true);
    rowsHost.addEventListener('click', e => {
      const del = e.target.closest('.plat-del');
      if(!del) return;
      const row = del.closest('.plat-row');
      delete platDraft[row.dataset.key];
      renderPlatformRows();
    });
  }

  const platAdd = toolsSlot.querySelector('#plat-add');
  if(platAdd) platAdd.onclick = () => {
    let n = 1, key = 'new_platform';
    while(platDraft[key]) key = 'new_platform_' + (++n);
    platDraft[key] = { label: '', icon: '' };
    renderPlatformRows();
    const row = toolsSlot.querySelector(`.plat-row[data-key="${key}"]`);
    if(row){ const ki = row.querySelector('.key-input'); if(ki){ ki.focus(); ki.select(); } }
  };
  const platReset = toolsSlot.querySelector('#plat-reset');
  if(platReset) platReset.onclick = () => {
    if(!confirm('Reset platform edits (unsaved)?')) return;
    platDraft = clonePlatforms(PLATFORMS);
    renderPlatformRows();
  };
  const platSave = toolsSlot.querySelector('#plat-save');
  if(platSave) platSave.onclick = () => {
    const cleaned = {};
    for(const k of Object.keys(platDraft)){
      const v = platDraft[k] || {};
      const key = String(k).trim();
      const label = String(v.label || '').trim();
      const icon = String(v.icon || '').trim();
      if(!key && !label && !icon) continue;
      cleaned[key] = { label: label || key, icon };
    }
    const newStr = JSON.stringify(cleaned, null, 2);
    const oldStr = JSON.stringify(PLATFORMS, null, 2);
    if(newStr === oldStr){ toast('No platform changes to stage', 'bad'); return; }
    pendingFileWrites.set(PLATFORMS_FILE, newStr + '\n');
    PLATFORMS = cleaned;
    updatePendingStrip();
    invalidateAllPanes();
    renderContent();
    closeToolsModal();
    toast('Platforms staged — commit to push');
  };
}
function closeToolsModal(){
  toolsBackdrop.classList.remove('open');
  toolsSlot.innerHTML = '';
  platDraft = null;
}

});

async function igdbSearch(name){
  const res = await fetch(PROXY_URL + '?action=igdb&q=' + encodeURIComponent(name));
  if(!res.ok) throw new Error('IGDB proxy HTTP ' + res.status);
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return Array.isArray(data) ? data : [];
}
function igdbFmtDate(unixSec){
  if(!unixSec) return '';
  const d = new Date(unixSec * 1000);
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
}
function igdbImg(url, size){
  if(!url) return '';
  return url.replace(/^\/\//,'https://').replace(/\/t_[a-z0-9_]+\//, '/' + size + '/');
}
function igdbMapToFields(hit){
  const out = {};
  if(hit.name) out.name = hit.name;
  if(hit.first_release_date) out.release = igdbFmtDate(hit.first_release_date);
  const devs = [], pubs = [];
  (hit.involved_companies || []).forEach(ic => {
    const nm = ic.company && ic.company.name;
    if(!nm) return;
    if(ic.developer) devs.push(nm);
    if(ic.publisher) pubs.push(nm);
  });
  if(devs.length) out.dev = devs.join(', ');
  if(pubs.length) out.pub = pubs.join(', ');
  if(hit.screenshots && hit.screenshots.length) out.screenshot = igdbImg(hit.screenshots[0].url, 't_1080p');
  if(hit.summary) out.notes = hit.summary;
  if(hit.platforms && hit.platforms.length) out.platform = hit.platforms.slice(0,4).map(p => p.name).join(', ');
  return out;
}
function igdbPlatformString(hit){ return (hit.platforms || []).map(p => p.name).join(', '); }
function igdbReleaseYear(hit){ return hit.first_release_date ? String(new Date(hit.first_release_date * 1000).getFullYear()) : ''; }

}
function steamFmtDate(str){

  if(isNaN(d.getTime())) return String(str);
  return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();

function steamMapToFields(data){

function hltbMapToFields(d){
  if(!d) return {};
  const story = d.story != null ? Math.max(1, Math.round(d.story)) : null;
  const extras = d.extras != null ? Math.max(1, Math.round(d.extras)) : null;
  const comp = d.completionist != null ? Math.max(1, Math.round(d.completionist)) : null;
  let hltb = '';

async function pcgwGetWikitext(pageTitle){
  const target = 'https://www.pcgamingwiki.com/w/api.php?action=parse&page=' + encodeURIComponent(pageTitle) + '&prop=wikitext&format=json';
  const res = await corsfix.fetch(target);
  if(!res.ok) throw new Error('page HTTP ' + res.status);
  const data = await res.json();
  return (data.parse && data.parse.wikitext && data.parse.wikitext['*']) || '';
}
function pcgwExtractTemplateField(wikitext, field){
  const re = new RegExp('\\{\\{\\s*Infobox game\\/row\\/' + field + '\\s*\\|\\s*([^\\}\\|]+?)\\s*(?:\\||\\}\\})', 'gi');
  const out = []; let m;
  while((m = re.exec(wikitext)) !== null){
    const v = m[1].trim();
    if(v && !out.includes(v)) out.push(v);
  }
  return out;
}
function pcgwExtractDates(wikitext){
  const re = /\{\{\s*Infobox game\/row\/date\s*\|\s*([^\|\}]+?)\s*\|\s*([^\|\}]+?)\s*(?:\||\}\})/gi;
  const out = []; let m;
  while((m = re.exec(wikitext)) !== null){
    const d = new Date(m[2].trim());
    if(isNaN(d.getTime())) continue;
    out.push(String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear());
  }
  return out;
}
function pcgwExtractSize(wikitext){
  const re = /\|minHD\s*=\s*([^\|\}\n]+)/gi;
  let m, best = '';
  while((m = re.exec(wikitext)) !== null){
    const v = m[1].trim();
    if(v && (!best || v.length < best.length)) best = v;
  }
  const sz = best.match(/(\d+(?:[.,]\d+)?)\s*(GB|MB|TB)/i);
  if(!sz) return '';
  let num = parseFloat(sz[1].replace(',', '.'));
  let unit = sz[2].toUpperCase();
  if(unit === 'MB'){ num = num / 1024; unit = 'GB'; }
  return (Math.round(num * 10) / 10) + ' ' + unit;
}
function pcgwMapToFields(wikitext){
  const out = {};
  const devs = pcgwExtractTemplateField(wikitext, 'developer');
  const pubs = pcgwExtractTemplateField(wikitext, 'publisher');
  if(devs.length) out.dev = devs.join(', ');
  if(pubs.length) out.pub = pubs.join(', ');
  const dates = pcgwExtractDates(wikitext);
  if(dates.length) out.release = dates[0];
  const size = pcgwExtractSize(wikitext);
  if(size) out.size = size;
  return out;
}

/* LBDB */
let LBDB_INDEX = null, LBDB_LOADING = null;
function normKey(s){
  return String(s || '').toLowerCase()
    .replace(/\.[a-z0-9]+$/i, '')
    .replace(/[\[\]\(\)]/g, ' ')
    .replace(/[:_\-–—.,!®™'’]/g, ' ')
    .replace(/\b(the|a|an)\b/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function lbdbFmtDate(str){
  if(!str) return '';
  const m = String(str).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + '.' + m[2] + '.' + m[1] : String(str);
}
async function lbdbEnsure(){
  if(LBDB_INDEX) return LBDB_INDEX;
  if(LBDB_LOADING) return LBDB_LOADING;
  LBDB_LOADING = (async () => {
    const res = await fetch(LBDB_FILE);
    if(!res.ok) throw new Error('LBDB file missing (' + res.status + ')');
    const data = await res.json();
    const games = data.games || (Array.isArray(data) ? data : []);
    const map = new Map();
    for(const g of games){
      const n = g.n || g.name;
      if(!n) continue;
      const key = normKey(n);
      if(!key) continue;
      if(!map.has(key)) map.set(key, []);
      map.get(key).push(g);
    }
    LBDB_INDEX = { map, raw: games, count: games.length };
    return LBDB_INDEX;
  })();
  try { return await LBDB_LOADING; }
  catch(e){ LBDB_LOADING = null; throw e; }
}
async function lbdbLookup(name){
  const idx = await lbdbEnsure();
  const key = normKey(name);
  if(!key) return [];
  return idx.map.get(key) || [];
}
function lbdbMapToFields(entry){
  const out = {};
  if(entry.n) out.name = entry.n;
  if(entry.p) out.platform = entry.p;
  if(entry.dev) out.dev = entry.dev;
  if(entry.pub) out.pub = entry.pub;
  if(entry.rel) out.release = lbdbFmtDate(entry.rel);
  if(entry.logo) out.logo = 'https://images.launchbox-app.com/' + entry.logo;
  if(entry.screenshot) out.screenshot = 'https://images.launchbox-app.com/' + entry.screenshot;
  return out;
}
function levSimilarity(a, b){ return nameSimilarity(a, b); }
function scoreCandidate(cName, cPlatform, cRelease, fName, fPlatform, fRelease){
  let score = nameSimilarity(cName || '', fName || '');
  if(fPlatform && String(fPlatform).trim()){
    const cp = String(cPlatform || '').toLowerCase().trim();
    const fp = String(fPlatform).toLowerCase().trim();
    if(cp){
      if(cp === fp || cp.includes(fp) || fp.includes(cp)) score += 0.5;
      else score -= 0.4;
    }
  }
  if(fRelease && String(fRelease).trim() && cRelease){
    const fy = String(fRelease).match(/\d{4}/);
    const cy = String(cRelease).match(/\d{4}/);
    if(fy && cy){
      const diff = Math.abs(+fy[0] - +cy[0]);
      if(diff === 0) score += 0.4;
      else if(diff <= 1) score += 0.05;
      else if(diff >= 3) score -= 0.5;
      else score -= 0.15;
    }
  }
  return score;
}

async function saveMediaLocally(kind, gameId, sourceUrl, onDone){
  if(!gameId){ toast('Save the game first (name required)', 'bad'); return; }
  if(!sourceUrl){ toast('Nothing to save', 'bad'); return; }
  if(/^images\//.test(sourceUrl)){ toast('Already local'); return; }
  if(!/^https?:/.test(sourceUrl)){ toast('Only http(s) URLs can be saved', 'bad'); return; }

  try{
    const url = PROXY_URL + '?action=saveimage'
      + '&kind=' + encodeURIComponent(kind)
      + '&gameId=' + encodeURIComponent(gameId)
      + '&url=' + encodeURIComponent(sourceUrl);
    const res = await fetch(url);
    if(!res.ok) throw new Error('saveimage HTTP ' + res.status);
    const data = await res.json();
    if(data && data.error) throw new Error(data.error);
    const path = data.path;
    if(!path) throw new Error('No path returned from proxy');
    onDone(path);
  }catch(e){
    toast('Save failed: ' + e.message, 'bad');
  }
}

function getComparator(){
  switch(sortKey){
    case 'name':    return (a,b)=> nameKey(a.name).localeCompare(nameKey(b.name));
    case 'size':    return (a,b)=> sizeKey(a.size) - sizeKey(b.size);
    case 'release': return (a,b)=> releaseKey(a.release) - releaseKey(b.release);
    case 'main':    return (a,b)=> hltbMainKey(a.hltb) - hltbMainKey(b.hltb);

  }

}

/* HERO SIZING */
function applyHeroSize(heroEl){
  const img = heroEl.querySelector('[data-hero-img]');
  if(!img){ heroEl.style.width = ''; heroEl.style.height = ''; return; }
  if(!img.naturalWidth || !img.naturalHeight){ return; }
  const ratio = img.naturalWidth / img.naturalHeight;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const maxH = Math.min(vh * 0.48, 540);
  const minH = 320;
  const maxW = Math.min(vw * 0.9, 1300);
  let h = maxH;
  let w = h * ratio;
  if(w > maxW){ w = maxW; h = w / ratio; }
  if(h < minH){ h = minH; w = h * ratio; }
  heroEl.style.height = Math.round(h) + 'px';
  heroEl.style.width = Math.round(w) + 'px';
  const modalEl = heroEl.closest('.modal');
  if(modalEl) modalEl.style.width = Math.round(w) + 'px';
}
function recalcHeroSizes(){
  document.querySelectorAll('[data-hero]').forEach(applyHeroSize);
}

/* FUZZY MATCHES */
function findMatches(currentId, name){
  const out = [];
  if(!name || name.length < 2) return out;
  const seen = new Set();
  const allIds = new Set([...Object.keys(MANIFEST.games)]);
  for(const id of pendingGameWrites.keys()) allIds.add(id);
  for(const id of allIds){
    if(pendingGameDeletes.has(id)) continue;
    if(seen.has(id)) continue;
    const g = viewGame(id);
    if(!g) continue;
    const nameScore = nameSimilarity(g.name, name);
    let kind = null;
    if(currentId && id === currentId) kind = 'exact';
    else if(nameScore >= 0.8) kind = 'similar';
    else continue;
    out.push({ id, name: g.name, year: g.release || g.ea_release || '', platform: g.platform || '', kind, score: nameScore });
    seen.add(id);
  }
  out.sort((a,b) => {
    if(a.kind === 'exact' && b.kind !== 'exact') return -1;
    if(b.kind === 'exact' && a.kind !== 'exact') return 1;
    return b.score - a.score;
  });
  return out.slice(0, 8);
}

/* ADMIN EDITOR */
function hltbToParts(str){
  if(!str || str === '—') return { main:'', extra:'' };
  const s = String(str);
  const mm = s.match(/Main:\s*([\d.]+)/i);
  const me = s.match(/\+Extra:\s*([\d.]+)/i);
  if(mm) return { main: mm[1] || '', extra: me ? me[1] : '' };
  return { main: s, extra: '' };
}
function partsToHltb(main, extra){
  main = String(main||'').trim(); extra = String(extra||'').trim();
  if(!main) return '—';
  if(/^\d/.test(main) && extra && /^\d/.test(extra)) return `Main: ${main}, +Extra: ${extra}`;
  if(/^\d/.test(main)) return `Main: ${main}`;
  return main;
}
function hltbIsNumeric(str){ return !str || str === '—' || /^\d/.test(String(str).replace(/^Main:\s*/i,'')); }
function linkIconGuess(label){
  const l = String(label||'').toLowerCase();
  if(l.includes('steam')) return 'steam';
  if(l.includes('pcgw') || l.includes('pcgamingwiki')) return 'pcgw';
  if(l.includes('nexus')) return 'nexus';
  return '';
}

  function refreshMatches(){
    const curId = (idInput.value || '').trim();
    const nm = (nameInput.value || '').trim();
    const exists = !!(MANIFEST.games[curId] || pendingGameWrites.has(curId)) && (curId !== (draft.id || ''));
    const matches = findMatches(curId, nm);
    const filtered = isNew
      ? matches.filter(m => m.kind === 'exact' || m.id !== curId)
      : matches.filter(m => m.id !== draft.id);
    let finalMatches = filtered;
    if(isNew && exists && !finalMatches.some(m => m.id === curId)){
      const gg = viewGame(curId);
      if(gg) finalMatches = [{ id: curId, name: gg.name, year: gg.release || gg.ea_release || '', platform: gg.platform || '', kind: 'exact', score: 1 }, ...finalMatches];
    }
    if(finalMatches.length === 0 && !exists){
      matchesBox.classList.add('empty');
      matchesBox.innerHTML = '';
      idInput.classList.remove('exists');
      idInput.classList.add('ok');
      if(isNew){ saveBtn.textContent = 'ADD NEW GAME'; saveBtn.className = 'btn primary'; }
      modalSlot._attachId = null;
      return;
    }
    idInput.classList.remove('ok');
    idInput.classList.add('exists');
    const rowsHTML = finalMatches.map(m => {
      const cls = m.kind === 'exact' ? 'exact' : 'similar';
      const isSel = modalSlot._attachId === m.id;
      return `<div class="match-row ${isSel?'selected':''}" data-match-id="${esc(m.id)}" data-match-kind="${cls}">
        <span class="m-tag ${cls}">${cls === 'exact' ? 'EXISTS' : 'SIMILAR'}</span>
        <span class="m-id">${esc(m.id)}</span>
        <span class="m-meta">${esc(m.year || '')}${m.platform ? ' · ' + esc(m.platform) : ''}</span>
      </div>`;
    }).join('');
    const titleKind = exists ? 'exact' : 'similar';
    const titleText = exists
      ? `ID already exists — pick it to ADD TO LIST instead`
      : `Similar games found — pick one to add to a list, or keep typing`;
    matchesBox.classList.remove('empty');
    matchesBox.innerHTML = `
      <div class="mb-title"><span class="mb-kind ${titleKind}">${exists ? '⚠' : '≈'}</span>${esc(titleText)}</div>
      ${rowsHTML}`;
    if(isNew){
      if(modalSlot._attachId){ saveBtn.textContent = 'ADD TO LIST'; saveBtn.className = 'btn attach'; }
      else { saveBtn.textContent = 'ADD NEW GAME'; saveBtn.className = 'btn primary'; }
    }
  }

  function pickAttach(id){
    const g = MANIFEST.games[id] || viewGame(id);
    if(!g) return;
    modalSlot._attachId = id;
    nameInput.value = g.name || '';
    releaseInput.value = g.release || '';
    eaInput.value = g.ea_release || '';
    platformInput.value = g.platform || '';
    $('#f-size').value = g.size || '';

    $('#f-screenshot').value = g.screenshot || '';
    $('#f-logo').value = g.logo || '';
    $('#f-series').value = g.series || '';
    $('#f-series-note').value = g.series_note || '';
    const hp2 = hltbToParts(g.hltb);
    const numeric2 = hltbIsNumeric(g.hltb);
    $('#f-hltb-type').querySelector(`input[value="${numeric2 ? 'numeric' : 'text'}"]`).checked = true;
    $('#hltb-numeric').style.display = numeric2 ? '' : 'none';

    $('#f-screenshot').dispatchEvent(new Event('input', { bubbles: true }));
    $('#f-logo').dispatchEvent(new Event('input', { bubbles: true }));
    const sv = g.series_status || '';
    $$('#status-row .status-btn').forEach(b => {
      b.classList.remove('on','rerun','optional');
      if((b.dataset.status || '') === sv){
        b.classList.add('on');
        if(sv === 'rerun') b.classList.add('rerun');
        if(sv === 'optional') b.classList.add('optional');
      }
    });
    $$('#flag-row .flag-btn').forEach(b => b.classList.toggle('on', !!(g.flags || {})[b.dataset.flag]));
    const linksList = $('#links-list');
    linksList.innerHTML = (g.links || []).map((l, i) => `
      <div class="link-row" data-link-idx="${i}">
        <input type="text" class="link-label" value="${esc(l.label||'')}">
        <input type="text" class="link-url" value="${esc(l.url||'')}">
        <button type="button" class="remove-link" title="Remove">✕</button>
      </div>`).join('');
    const dlcHost = $('#dlc-editor-list');
    dlcHost.innerHTML = (g.dlc || []).map((d, i) => dlcEditRowHTML(d, i)).join('');
    [...dlcHost.querySelectorAll('.dlc-editor-row')].forEach(row => {
      row.querySelector('.dlc-played-toggle').addEventListener('click', function(){
        this.classList.toggle('on');
      });
      row.querySelector('.dlc-remove').addEventListener('click', () => row.remove());
    });
    const mem = membershipsOf(id);
    $$('#list-grid input[type=checkbox]').forEach(cb => { cb.checked = mem.has(cb.dataset.list); cb.closest('.list-cb').classList.toggle('on', cb.checked); });
    idInput.value = id;
    userEditedId = true;
    refreshMatches();
  }
